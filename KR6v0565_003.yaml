body:
  text: 瑜伽菩薩戒本講錄十九年十月在成都文殊院講釋名題一釋本題二釋說者三釋譯者釋文義甲一總勸勤學甲二正說戒相乙一說戒相丙一四重戒丁一標徵名數丁二正明四重丁三釋他勝名戊一明犯過失戊二明捨不捨戊三示堪重受丙二諸輕戒丁一總令了知丁二別顯戒相戊一障六度攝善己一障布施度庚一障財施戒辛一慳心不供三寶戒辛二貪名利戒辛三不敬有德同法戒辛四不應供受襯戒辛五不受重寶施戒庚二障法施戒庚三障無畏施戒己二障持戒度庚一明遮罪辛一與聲聞共學戒辛二與聲聞不共學戒庚二別明性戒辛一殺生辛二不與取辛三邪婬辛四妄語辛五兩舌辛六惡口辛七綺語庚三味邪命法戒庚四掉動嬉戲戒庚五倒說菩薩法戒庚六不護雪譏謗戒庚七不行楚罰戒己三障忍辱度庚一報復戒庚二不悔謝戒庚三不受懺戒庚四懷忿不捨戒己四障精進度庚一染心御眾戒庚二非時睡眠戒庚三虛談棄時戒己五障禪定度庚一惰慢不求禪法戒庚二不除五蓋定障戒庚三貪味靜慮戒己六障般若度庚一對於法者辛一不學小乘法戒辛二棄大向小戒辛三捨內學外戒辛四專習異論戒辛五不信深法戒庚二對於人者辛一愛恚讚毀戒辛二憍慢不聽正法戒辛三輕毀法師戒戊二障四攝利生己一不為助伴戒己二不往事病戒己三不為宣說障愛語戒己四有恩不報戒己五患難不慰戒己六希求不給戒己七攝眾不施戒己八不隨心轉戒己九不隨喜讚揚戒己十不隨行威折戒己十一不隨現神力折攝戒丁三總明無犯乙二明持悔乙三明悔法丙一對他懺除丁一上品纏犯應更受丁二懺中品纏犯丁三懺下品纏犯及餘違犯丙二自誓懺除甲三結應敬修顯要旨一應了知者三事二顯殊勝者三事釋名題一釋本題甲菩薩茲用因明法從破似立真以為釋在吾國俗習上往往提到菩薩即聯想及種種偶像以為菩薩者偶像之代名詞也嘗在小學教科書中見有指兒童玩偶謂洋菩薩者諸如此類不一而足因此任何神鬼人物偶像皆得名以菩薩遂令社會人士誤以信菩薩為迷信此不得不先破除者復次古來有望文生義以為之說者則曰菩者普也薩者濟也此雖推想到菩薩為救度眾生之義然未知菩薩乃梵語之譯音也又其次則知菩薩為梵音菩提薩埵之略然譯菩提為道譯薩埵為眾生謂菩薩者大道心眾生也此譯義亦未精確梵語末伽此譯為道梵語摩呼婆耆此譯眾生故亦為未得菩薩正義之相似解也上來既破其似今出真正之菩薩義則菩提者覺也薩埵者有情也菩薩謂覺有情有三種義其一菩薩亦為有情之一是從大悲心上發起求無上正覺心之有情故名覺有情即從初發心之菩薩以至三賢十聖行位之菩薩是唯因前菩薩其二以觀正覺及觀有情等所觀之境故名覺有情此通因前果後其三謂依無上正覺而化濟有情故名覺有情此唯果後菩薩如上三義為菩薩之正義乙戒梵語毗㮈耶或毗尼本為調伏之義謂調練三業制伏諸非也因調伏二字不適宜此方故譯為戒為律或為戒律但戒字之廣義為禁制之意如國家之法律社校之規約等皆得謂之為戒則其中可有善惡之不同若邪教等各有為其邪教徒所共遵守之戒條此為屬於戒禁取之惡戒善戒又為世戒佛戒之分世間善戒若孔子所謂血氣未定戒之在色血氣方剛戒之在鬥血氣既衰戒之在得等為人天之善法佛之戒法又名尸羅梵語尸羅此為清涼即菩薩六度中之尸羅波羅蜜乃為清淨純善之戒能解脫熱惱而清涼者也丙菩薩戒菩薩戒者為佛戒中之一種就佛戒言約分為二一七眾戒依佛徒之性別與程度別有比丘比丘尼沙彌沙彌尼優婆塞優婆夷之六眾以尼戒繁細難學在沙彌尼進受比丘尼戒之前更設有式差摩那尼之一階級故成七眾此之七眾各有其部勒之戒條多少難易秩然不同曰七眾戒若釋其名義梵語比丘此云乞士是乞法資心乞食資身義梵語沙彌古云息慈取息惡行慈義唐譯求寂乃志求寂滅之謂也梵語優婆塞優婆夷此云近事男近事女謂能親近承事三寶之男女也亦名正信清信男女能正信三寶故即受三皈或五戒之在家佛徒也二菩薩戒散見於大乘各經論考之有梵網經纓珞經菩薩優婆塞戒經密宗三昧耶戒儀軌與此瑜伽菩薩戒本五種而以梵網為最完具然梵網兼具律儀戒攝善法戒饒益有情戒而能發揮菩薩戒中攝善法戒饒益有情戒之殊勝相者則唯在此瑜伽戒本也菩薩通於七眾而別無部類故優婆來受菩薩戒則稱為菩薩優婆乃至比丘來受菩薩戒則稱為菩薩比丘也丁菩薩戒本此一本為從瑜伽師地論本地分菩薩地初持瑜伽處第十戒品中錄出者乃便於受學菩薩戒者平日誦持之讀本故云瑜伽菩薩戒本二釋說者瑜伽師地論為彌勒菩薩所說而此戒本出自彼論故云彌勒菩薩說也彌勒梵語正音梅呾麗耶此云慈氏為菩薩之姓也名阿逸多譯無能勝云無能勝者以其為一生補處菩薩惟盡此一生即補處佛位故名亦有經中稱彌勒比丘者因於釋迦佛七眾弟子中應攝在比丘眾中也彌勒菩薩與文殊菩薩同為生在印度之菩薩非若觀音等從他方應化於此方者至彌勒菩薩之歷史與成佛之因緣有彌勒上生經彌勒下生經等詳說茲不贅述但彌勒菩薩說此論時在釋迦如來滅度後九百年間其時彌勒菩薩早已生在兜率天以應無著菩薩之請降中印度阿踰闍國大講堂中而說此論無著菩薩乃初地以上之菩薩因當時聞說大乘佛法者或信或疑故上昇兜率請彌勒菩薩降說此論時之聽眾或能見其相好或但聞其法音而錄其說以流通於世者則無著菩薩也三釋譯者佛滅度後所結集之經文皆為梵文而此論初亦梵文也由梵文而翻為中國文者初有僅譯菩薩地者菩薩戒者全部翻出者為玄奘法師梵語沙門此云勤息乃勤修戒定慧息滅貪瞋癡意然沙門一名為精進修行出家者之通稱而佛法中亦有非沙彌比丘之五眾得稱為沙門者如近來錫蘭摩訶菩提會會長達摩波羅雖未入沙彌等五眾中然己為捨棄家財家眷等之出家人故亦稱沙門也玄奘法師之稱沙門乃苾芻眾中住持佛法之大沙門也因有深遠之智慧廣大之慈悲故名玄奘奘師譯經垂二十年奉詔係奉唐太宗或唐高宗之詔也示翻譯佛教之經論為最莊嚴隆重之事故須奉詔而譯使世人屏除疑偽之念也譯者易也翻彼梵文易為華文故名譯也釋文義甲一總勸勤學若諸菩薩已受菩薩所受淨戒應自數數專諦思惟此是菩薩正所應作此非菩薩正所應作既思惟已然後為成正所作業當勤修學又應專勵聽聞菩薩素呾纜藏及以菩薩摩呾理迦隨其所聞當勤修學謂菩薩於此戒當勤修學藉以熏成大乘種性而發菩提心行菩薩法也但若比丘等戒須受戒後方能修學而菩薩戒則雖未受亦可聽講以助發心然亦正為已受菩薩清淨戒者如理修行而說故應端心正慮念念不忘專精審諦思惟修學經揀擇決定是否菩薩正所應作已然後或行或止去作一切事業為菩薩之正所作業業之自體為動作心心所之思心所乃五遍行心所之一然此唯取與前六識相應之思心所此思心所若與煩惱心所相應則為有漏染業與善心所相應則為善業或無漏清淨業菩薩之正所作業是降伏一切有漏染業行種種方便以轉成為無漏清淨之業也然又當專精聽聞菩薩之經藏論藏梵語素呾纜此云契經摩呾理迦此云本母亦即論藏隨其所聞更加思惟以取得正確之了解如解觀察以勤修學蓋菩薩之所作當依菩薩之至教啟發理解如理而行依行證果為平正之坦途甲二正說戒相乙一說戒相丙一四重戒丁一標徵名數若諸菩薩隨戒律儀有其四種他勝處法何等為四此正標出菩薩之四種他勝處律儀一名狹義則為菩薩戒三聚中之律儀戒廣義則與戒之一字相同將戒律儀合為一名而用此云隨戒律儀即其例也梵網戒有十重此四重屬攝善法與饒益有情乃在十重中第七至第十之四重也餘之六重屬律儀戒已攝於菩薩依律儀戒之七眾戒中故略不說他勝者為他法所勝菩薩能勝一切若為他法所勝則非復菩薩類也正譯則為他勝處義丁二正明四重若諸菩薩為欲貪求利養恭敬自讚毀他是名第一他勝處法若諸菩薩現有資財性慳財故有苦有貧無依無怙正求財者來現在前不起哀憐而修惠捨正求法者來現在前性慳法故雖現有法而不捨施是名第二他勝處法若諸菩薩長養如是種類忿纏由是因緣不唯發起麤言便息由忿蔽故加以手足塊石刀杖捶打傷害損惱有情內懷猛利忿恨意樂有所違犯他來諫謝不受不忍不捨怨結是名第三他勝處法若諸菩薩謗菩薩藏愛樂宣說開示建立像似正法於像似法或自信解或隨他轉是名第四他勝處法此四重戒其一為貪乃六根本煩惱之首其二之慳亦為隨煩惱中貪分所攝第三為猛利瞋第四為邪見癡故云重也第一所貪利養如財物衣食等恭敬如名聞讚頌等但專貪求利養恭敬犯尚不重若因之而發生自讚毀他之言表業則從動機以至成事其所犯為重也以菩薩行純屬利他今既不能利他反為自讚毀他而損害他殊與菩薩之法相違故犯他勝處也第二有財不財施有法不法施者非菩薩法也蓋菩薩本為利他而受身命資財若遇貧苦及無依怙之人正求資財而來菩薩之前不起哀愍以行惠施又菩薩具有聞思慧修證之法正求法者來前應即方便提獎藉增勝行若不爾者則非菩薩此中須具三事謂能施者之菩薩及所施之財法與受施之正求財法者皆現在前吝而不施遂犯他勝處法第三忿為小隨煩惱中最猛利之瞋纏者煩惱別名因煩惱而不得解脫生死厥名曰纏既不能降伏對治此忿纏反恣縱令長養串習於中不特引起語業之惡並將引起身業之爭鬥等殊可畏也忿為對於當時現境而呈露身心之表者於過去瞋忿境深藏於心以不忘者名恨若懷損害於將來者名怨為忿所蔽成為意樂恨之不已以圖損惱有情不忍受他人之諫謝不捨怨結則非菩薩故犯他勝處法第四菩薩學菩薩法應習菩薩經藏論藏若隨像似正法之非正法而轉以信解彼像似正法而反謗真正菩薩法者則犯他勝處像似正法如偽君子之似君子最易令人迷誤若大乘中各分宗派互為障礙皆是如此便失菩薩近見凡在大乘佛法修學者對於自行化他之法須先認識清楚否則即墮像似有犯重戒此一條為菩薩最緊要之關頭學者其勿忽諸丁三釋他勝名戊一明犯過失菩薩於四他勝處法隨犯一種況犯一切不復堪能於現法中增長攝受菩薩廣大菩提資糧不復堪能於現法中意樂清淨是即名為相似菩薩非真菩薩他勝處法者為他惡法所勝不能進修菩薩行也持菩薩戒者於此四重隨犯一條則不復能於現法中增長廣大菩提資糧六度之前五度為福德資糧末一度為智慧資糧福智具足菩提圓滿犯他勝法即不能圓滿此六度亦即不復能得意樂清淨謂現生中不能得入初歡喜地由此故為相似菩薩非真菩薩戊二明捨不捨菩薩若用軟中品纏毀犯四種他勝處法不捨菩薩淨戒律儀上品纏犯即名為捨若諸菩薩毀犯四種他勝處法數數現行都無慚愧深生愛樂見是功德當知說明上品纏犯非諸菩薩暫一現行他勝處法便捨菩薩淨戒律儀如諸苾芻犯他勝法即便棄捨別解脫戒四重之前二從貪起第三由瞋生第四由癡發然此四重戒中亦分上中下品犯上品者即捨菩薩淨戒律儀犯中下者應當懺悔若不懺悔不生慚愧反生愛樂謂之功德者乃名上品纏犯而捨淨戒故不同比丘之違犯性罪一犯即捨戒也梵語波羅提木叉此云別解脫謂持此戒即得身口七支過惡之別別解脫也戊三示堪重受若諸菩薩由此毀犯棄捨菩薩淨戒律儀於現法中堪任更受非不堪任如苾蒭住別解脫戒犯他勝法於現法中不任更受比丘若犯重戒於現法此生中不能重受菩薩若犯重戒猶可重受因比丘戒限盡形壽而菩薩戒乃盡未來限形壽則犯者此生不能重受盡未來則雖棄捨猶可發心重受之也丙二諸輕戒丁一總令了知如是菩薩安住菩薩淨戒律儀於有違犯及無違犯是染非染軟中上品應當了知若諸菩薩受持此戒信解奉行於每日中作諸事宜或犯非犯是染非染總應了知染謂染污即是根本煩惱非染者或軟下品纏或是無記皆應熟習了知勿令懈廢善思分別是善非善可作不可作以熟習了知能作修行之標準乃得不易毀犯也丁二別顯戒相戊一障六度攝善己一障布施度庚一障財施辛一慳心不供三寶戒若諸菩薩安住菩薩淨戒律儀於日日中若於如來或為如來造制多所若於正法或為正法造經卷所謂諸菩薩素呾纜藏摩呾理迦若於僧伽謂十方界已入大地諸菩薩眾若不以其或少或多諸供養具而為供養下至以身一拜禮敬下至以語一四句頌讚佛法僧真實功德下至以心一清淨信隨念三寶真實功德空度日夜是名有犯有所違越若不恭敬懶惰懈怠而違犯者是染違犯若誤失念而違犯者非染違犯無違犯者謂心狂亂若已證入淨意樂地常無違犯由得清淨意樂菩薩譬如已得證淨苾蒭恆時法爾於佛法僧以勝供具承事供養凡佛弟子皆以皈敬三寶為首菩薩亦應六時禮拜讚歎三寶功德如不創修塔寺印造經論恭敬供養菩薩聖僧身不禮拜口不讚嘆意不觀想三業懈怠空過時日成染違犯或因忘念無記而然非染違犯其或公務紛煩暫時無暇可以無犯至於淨意菩薩則如證性比丘法爾契戒所以無犯梵語制多此云佛殿梵語僧伽此云眾此中謂大乘菩薩眾佛為初地以上菩薩說法示現他受用身淨土故初地以上之菩薩得正性身生生世世生如來家荷擔正法故名大乘菩薩聖僧此正明敬供大乘三寶也辛二貪名利戒若諸菩薩安住菩薩淨戒律儀有其大欲而無喜足於諸利養及以恭敬生著不捨是名有犯有所違越是染違犯無違犯者謂為斷彼生起樂欲發勤精進攝彼對治雖勤遮遏而為猛利性惑所蔽數起現行利養恭敬珍奇異寶深生貪著過分貪求毫無饜足之心者犯菩薩戒或為方便調伏他人去彼所愛令發道心或為煩惱之所迷惑雖精進勇猛修對治之行而諸煩惱猶現起者不名犯戒辛三不敬有德同法戒若諸菩薩安住菩薩淨戒律儀見諸耆長有德可敬同法者來憍慢所制懷嫌恨心懷恚惱心不起承迎不推勝座若有他來語言談論慶慰請問憍慢所制懷嫌恨心懷恚惱心不稱正理發言酬對是名有犯有所違越是染違犯非憍慢制無嫌恨心無恚惱心但由懶惰懈怠忘念無記之心是名有犯有所違越非染違犯無違犯者謂遭病重或心狂亂或自睡眠他生覺想而來親附語言談論慶慰請問或自為他宣說諸法論義決擇或復與餘談論慶慰或他說法論義決擇屬耳而聽或有違犯說正法者為欲將護說法者心或欲方便調伏彼出不善處安立善處或護僧制或為將護多有情心而不酬對皆無違犯不尊年高有德及酬對求法者以瞋惱心恣憍慢意憍是小隨煩惱謂耽著自法稱揚己能慢是根本煩惱謂自恃自傲蔑視於人名染違犯若無瞋恚嫌恨但因放逸懈怠與無記心非染違犯或因病重心狂睡眠昏瞶或彼問時正為他人說法或因調彼伏彼而不酬答等皆無違犯辛四不應供受襯戒若諸菩薩安住菩薩淨戒律儀他來延請或往居家或往餘寺奉施飲食及衣服等諸資生具憍慢所制懷嫌恨心懷恚惱心不至其所不受所請是名有犯有所違越是染違犯若由懶惰懈怠忘念無記之心不至其所不受所請是名有犯有所違越非染違犯無違犯者或有疾病或無氣力或心狂亂或處懸遠或道有怖或欲方便調彼伏彼出不善處安立善處或餘先請或為無間修諸善法欲護善品令無暫廢或為引攝未曾有義或為所聞法義無退如為所聞法義無退論義決擇當知亦爾或復知彼懷損惱心詐來延請或為護他多嫌恨心或護僧制不至其所不受所請皆無違犯若人迎請大乘菩薩奉施衣服資生之具菩薩懷瞋恚心不受其請以無慈愍心攝授四眾故犯菩薩戒或因懶惰懈怠失念無記所致犯而非染而我國向以懶散為高者又惡知其為犯戒乎若因道路懸遠或餘先請或修善法不能暫捨或詐來請或因僧制所限或為護多有情不令瞋恚不受其請則無違犯辛五不受重寶施戒若諸菩薩安住菩薩淨戒律儀他持種種生色可染末尼真珠琉璃等寶及持種種眾多上妙財利供具慇懃奉施由嫌恨心或恚惱心違拒不受是名有犯有所違越是染違犯捨有情故若由懶惰懈怠忘念無記之心違拒不受是名有犯有所違越非染違犯無違犯者或心狂亂或觀受已心生染著或觀後時彼定追悔或復知彼於施迷亂或知施主隨捨隨受由是因緣定當貧匱或知此物是僧伽物窣堵波物或知此物劫盜他得或知此物由是因緣多生過患或殺或縛或罰或黜或嫌或責違拒不受皆無違犯信士布施供具珍寶殷勤啟請勸哀納受而菩薩以瞋恚怨恨之心而不領受者是染違犯若由怠惰無記而不受者非染違犯或知受已心生染著妨礙精進或知彼人心生迷惑施後疑悔或因受施彼即貧困或知彼是不與取物是三寶物由是因緣或招打罵訶斥拒不受者不名犯戒庚二障法施戒若諸菩薩安住菩薩淨戒律儀他來求法懷嫌恨心懷恚惱心嫉妒變異不施其法是名有犯有所違越是染違犯若由懶惰懈怠忘念無記之心不施其法是名有犯有所違越非染違犯無違犯者謂諸外道伺求過短或有重病或心狂亂或欲方便調彼伏彼出不善處安立善處或於是法未善通利或復見彼不生恭敬無有羞愧以惡威儀而來聽受或復知彼是鈍根性於廣法教得法究竟深生怖畏當生邪見增長邪執衰損惱壞或復知彼法至其手轉布非人而不施與皆無違犯如有學者為法遠來而菩薩以瞋恨恚惱心故不說一字一句吝法施故即是染犯或因懶惰懈怠忘念無記失正念者名非染犯或有外道伺求過失或於是法未深了解或復因彼威儀缺廢或知彼是根性頑鈍聞勝深法則生狂怖邪見或因伏彼剛強惡心令住善處有是因緣不說法者不名吝法庚三障無畏施若諸菩薩安住菩薩淨戒律儀於諸暴惡犯戒有情懷嫌恨心懷恚惱心由彼暴惡犯戒為緣方便棄捨不作饒益是名有犯有所違越是染違犯若由懶惰懈怠棄捨由忘念故不作饒益是名有犯有所違越非染違犯何以故非諸菩薩於淨持戒身語意業寂靜現行諸有情所起憐愍心欲作饒益如於暴惡犯戒有情於諸苦因而現轉者無違犯者謂心狂亂或欲方便調彼伏彼廣說如前或為將護多有情心或護僧制方便棄捨不作饒益皆無違犯對於暴惡犯戒之諸有情菩薩以瞋恚心不為說法施以無畏犯菩薩戒或因怠惰無記非染違犯菩薩於諸淨身語意有情起憐憫心而不為暴惡犯戒有情說法者則失大乘菩薩悲心攝授有情方便或厭惡世而生遠離之想是不知釋迦如來設教為化剛強暴惡之理也然若為利彼一人故致令眾多有情失益則可不為彼說法所以此菩薩戒不同餘戒之呆板而是活潑圓融無礙之菩薩行己二障持戒度庚一明遮罪辛一與聲聞共學戒若諸菩薩安住菩薩淨戒律儀如薄伽梵於別解脫毗奈耶中將護他故建立遮罪制諸聲聞令不造作諸有情類未淨信者令生淨信已淨信者令倍增長於中菩薩與諸聲聞應等修學無有差別何以故以諸聲聞自利為勝尚不棄捨將護他行為令有情未信者信信者增長學所學處何況菩薩利他為勝聲聞戒具於七眾中之苾蒭戒與菩薩戒有共不共如聲聞別解脫戒中遮戒大乘方應該共守者其事雖非罪惡而佛制遮止者為避譏嫌攝化世間此在聲聞且學菩薩尤須學習令未信者信已信者增長否則於菩薩戒即成違犯薄伽梵乃譯音以含多義不翻有尊貴義或翻世尊此釋共學戒辛二與聲聞不共學戒若諸菩薩安住菩薩淨戒律儀如薄伽梵於別解脫毗奈耶中為令聲聞少事少業少希望住建立遮罪制諸聲聞令不造作於中菩薩與諸聲聞不應等學何以故以諸聲聞自利為勝不顧利他於利他中少事少業少希望住可名為妙非諸菩薩利他為勝不顧自利於利他中少事少業少希望住得名為妙如是菩薩為利他故從非親里長者居士婆羅門等及恣施家應求百千種種衣服觀彼有情有力無力隨其所施如應而受如說求衣求缽亦爾如求衣缽如是自求種種絲縷令非親里為織作衣為利他故應蓄種種憍世耶衣諸坐臥具事各至百生色可染百千俱胝復過是數亦應取積如是等中少事少業少希望住制止遮罪菩薩不與聲聞共學安住淨戒律儀菩薩於利他中懷嫌恨心懷恚惱心少事少業少希望住是名有犯有所違越是染違犯若由懶惰懈怠忘念無記之心少事少業少希望住是名有犯有所違越非染違犯聞佛音聲而悟道故名聲聞有遮戒菩薩不應共學者佛制聲聞三衣一缽不許積蓄不得儲金銀珠寶等物然在菩薩則可多蓄多求如長者等能恣施家應可多施衣具缽等以至珠寶珍奇財物菩薩儲蓄為利其餘僧眾及貧困有情等蓋聲聞以自利為本而菩薩以利他為要無愛染心故不名犯我國於學佛人名居士者本於維摩詰經之維摩詰居士以其為在家人學佛之最高者故沿習為定稱而印度則不然居士指素封之家自好之士之一種階級故不限于學佛之士印度之婆羅門即操民族及社會教化之權者略如我國古來儒家憍奢耶即蠶之繭絲抽繭絲所製之衣曰憍奢耶衣但印度之蠶絲是蠶成蛾後之破繭故非傷生所製現今法國科學會發明蠶蛾破繭飛去然後製絲並不減其精緻華美此今後事蠶桑而持戒者所應了知也其餘如文可知庚二別明性戒若諸菩薩安住菩薩淨戒律儀善權方便為利他故於諸性罪少分現行由是因緣於菩薩戒無所違犯生多功德此下有七條別明性戒亦與聲聞不共辛一殺生謂如菩薩見惡劫賊為貪財故欲殺多生或復欲害大德聲聞獨覺菩薩或復欲造多無間業見是事已發心思惟我若斷彼惡眾生命墮那落迦如其不斷無間業成當受大苦我寧殺彼墮那落迦終不令其受無間苦如是菩薩意樂思惟於彼眾生或以善心或無記心知此事已為當來故深生慚愧以憐愍心而斷彼命由是因緣於菩薩戒無所違犯生多功德性戒者謂此法自性是罪惡必應戒除故為外內小大之所共戒然大菩薩為利生故毫不為自私自利亦可權巧方便而開少分然須地上菩薩智慧力強善思決擇乃能正行如有盜賊傷害有情乃至聲聞菩薩弒父弒母出佛身血將造五無間業菩薩見已起憐憫心願自墮那落迦地獄而不令彼無間業成以大悲心無瞋恚意而殺於彼生多功德辛二不與取又如菩薩見有增上增上宰官上品暴惡於諸有情無有慈愍專行逼惱菩薩見已起憐愍心發生利益安樂意樂隨力所能若廢若黜增上等位由是因緣於菩薩戒無所違犯生多功德又如菩薩見劫盜賊奪他財物若僧伽物窣堵波物取多物已執為己有縱情受用菩薩見已起憐愍心於彼有情發生利益安樂意樂隨力所能逼而奪取勿令受用如是財故當受長夜無義無利由此因緣所奪財寶若僧伽物還復僧伽窣堵波物還窣堵波若有情物還復有情又見眾主或園林主取僧伽物窣堵波物言是已有縱情受用菩薩見已思擇彼惡起憐愍心勿令因此邪受用業當受長夜無義無利隨力所能廢其所主菩薩如是雖不與取而無違犯生多功德如有君主官吏以及惡霸土豪暴虐無道剝奪民財妨害道路擄掠行人菩薩見已痛念有情弔民伐罪孰曰不宜或知彼是塔寺僧物在家眾物奪為己有姿意受用菩薩方便施以強力取還原處不名犯戒反生功德辛三邪婬又如菩薩處在居家見有女色現無繫屬習婬欲法繼心菩薩求非梵行菩薩見已作意思惟勿令心恚多生非福若隨其欲便得自在方便安處令種善根亦當令其捨不善業住慈愍心行非梵行雖習如是穢染之法而無所犯生多功德出家菩薩為護聲聞聖所教誡令不壞滅一切不應行非梵行此明在家菩薩遇男無妻女無夫者對於菩薩婬欲熾盛求作不淨之行菩薩見已生憐憫心調彼伏彼安立善處攝為夫婦生多功德但此唯在家菩薩可作之而出家菩薩欲作此饒益應先白眾退出家戒還俗方可攝受否則破壞佛制出家團體律儀故特不許辛四妄語又如菩薩為多有情解脫命難囹圄縛難刖手足難劓鼻刵耳剜眼等難雖諸菩薩為自命難亦不正知說於妄語然為救脫彼有情故知而思擇故說妄語以要言之菩薩唯觀有情義利非無義利自無染心唯為饒益諸有情故覆想正知而說異語說是語時於菩薩戒無所違犯生多功德菩薩為諸有情脫離苦難謂斷手足削耳鼻舌剜眼等難菩薩為自命難亦不妄語今為利益有情以大悲心非愛染意雖說妄語不名犯戒辛五兩舌又如菩薩見諸有情為惡朋友之所攝受親愛不捨菩薩見已起憐愍心發生利益安樂意樂隨能隨力說離間語令離惡友捨相親愛勿令有情由近惡友當受長夜無義無利菩薩如是以饒益心說離間語乖離他愛無所違犯生多功德菩薩見諸有情為諸惡友之所引誘不能遠離菩薩方便說離間語令離惡友而近善知識者不名犯戒辛六惡口又如菩薩見諸有情為行越路非理而行出麤惡語猛利訶擯方便令其出不善處安立善處菩薩如是以饒益心於諸有情出麤惡語無所違犯生多功德如遇緊急關頭有諸有情須以呵罵令改過遷善者菩薩當以猛利粗言說其過咎而痛斥之亦是方便饒益有情之一法故言雖凶暴粗惡不名犯戒如應訶斥而不訶斥之者犯戒辛七綺語又如菩薩見諸有情信樂倡伎吟詠歌諷或有信樂王賊飲食淫蕩街衢無義之論菩薩於中皆悉善巧於彼有情起憐愍心發生利益安樂意樂現前為作綺語相應種種倡伎吟詠歌諷王賊飲食淫衢等論令彼有情歡喜引攝自在隨屬方便獎導出不善處安立善處菩薩如是現行綺語無所違犯生多功德或有喜談伎女優伶淫坊街衢歌笑諷詠之語及聞帝王官吏盜賊飲食之事菩薩知彼若正教之必不樂受方便隨順而說綺語為利生故不名犯戒庚三味邪命法戒若諸菩薩安住菩薩淨戒律儀生起詭詐虛談現相方便研求假利求利味邪命法無有羞恥堅持不捨是名有犯有所違越是染違犯無違犯者若為除遣生起樂欲發勤精進煩惱熾盛蔽抑其心時時現起邪命法違反八正道中之正命法正命者正當之生活凡在家出家以及菩薩等皆應有正當之生活其正當之生活法乃為正命法若用虛誕欺詐以取生活之所需為邪命故依不實之現相為方便而作假利求利之邪命法以認為資養生命之正當營業取著不捨而毫無羞恥者是染違犯若為遣除邪命令生正命生起樂欲發勤精進修對治之方便而尚未遣除者則無違犯因無始來邪命之惡習深時時現起以障蔽抑遏其心故一時不得自在斷除但菩薩修對治方便力行其法終可漸令伏滅無有違犯庚四掉動嬉戲戒若諸菩薩安住菩薩淨戒律儀為掉所動心不寂靜不樂寂靜高聲嬉戲諠譁紛聒輕躁騰躍望他歡笑如此諸緣是名有犯有所違越是染違犯若妄念起非染違犯無違犯者若為除遣生起樂欲廣說如前若欲方便解他所生嫌恨令息若欲遣他所生愁惱若他性好如上諸事方便攝受敬慎將護隨彼而轉若他有情猜阻菩薩內懷嫌恨惡謀憎背外現歡顏表內清淨如是一切皆無違犯菩薩所取之態度應端肅嚴正安住寂靜若輕舉掉動而心不寂靜或不樂於靜寂致心浮躁輕動引起諠譁紛笑諸緣是染違犯若因妄念而偶失於覺察者雖犯非染至欲遣除而尚未能遣除或作方便而欲解他愁惱或欲攝受他人以為權宜或他人對之有所忌恨而隱謀憎背菩薩欲令息嫌歸好外現歡顏以表內心清淨無他如上種種皆無違犯庚五倒說菩薩法戒若諸菩薩安住菩薩淨戒律儀起如是見立如是論菩薩不應欣樂涅槃應於涅槃而生厭背於諸煩惱及隨煩惱不應怖畏而求斷滅不應一向心生厭離以諸菩薩三無數劫流轉生死求大菩提若作此說是名有犯有所違越是染違犯何以故如諸聲聞於其涅槃欣樂親近於諸煩惱及隨煩惱深心厭離如是菩薩於大涅槃欣樂親近於諸煩惱及隨煩惱深心厭離其倍過彼百千俱胝以諸聲聞唯為一身證得義利勤修正行菩薩普為一切有情證得義利勤修正行是故菩薩當勤修集無雜染心於有漏事隨順而行成就勝出諸阿羅漢無雜染法梵語涅槃此云圓寂梵語俱胝此云萬億菩薩若生誤解謂應背涅槃而不斷煩惱以菩薩須三無數劫流轉生死中求大菩提故作此說者是染違犯何以故以菩薩欣涅槃而厭煩惱之樂欲心應較諸聲聞猶加百千俱胝倍數以聲聞但求一身涅槃而菩薩普度一切有情涅槃故菩薩若於煩惱雜染不勤斷除則雖修十善業非清淨業而為招感生死之煩惱業故菩薩應修習無雜染心隨順眾生以成就勝出阿羅漢以上之功德故菩薩雖入俗度生仍須不背涅槃修習斷除煩惱之法庚六不護雪譏謗戒若諸菩薩安住菩薩淨戒律儀於自能發不信重言所謂惡聲惡稱惡譽不護不雪其事若實而不避護是名有犯有所違越是染違犯若事不實而不清雪是名有犯有所違越非染違犯無違犯者若他外道若他憎嫉若自出家因行乞行因修善行謗聲流布若忿蔽者若心倒者謗聲流布皆無違犯菩薩於持戒時遇有人對於本身有毀謗之惡稱譽若為事實而不避護是染違犯若非事實而不清雪亦是違犯但非染耳若外道故意興謗為世人所明了者或為人憎嫉故施非毀若去昭雪而惡感愈深者若已出家因修乞食等行而有入市廛俗家之種種行動世人不識致謗聲流布者若人為忿惱所障蔽而欲令蒙毀者若傷心病狂顛倒黑白淆亂是非者如是種種而不護雪皆無違犯庚七不行楚罰戒若諸菩薩安住菩薩淨戒律儀見諸有情應以種種辛楚加行猛利加行而得義利護其憂惱而不現行是名有犯有所違越非染違犯無違犯者觀由此緣於現法中少得義利多生憂惱若菩薩對于世人或徒眾欲令速得成就義利應施種種辛楚及猛利之加行設或以愛染心恐彼憂惱而不施行是染違犯若觀察以加行因緣得利者少憂惱者多而不施者得無違犯但菩薩須難行能行難忍能忍若已認清目標應勇往直前乃自他俱利若姑息任令放縱者非菩薩之行也己三障忍辱度庚一報復戒若諸菩薩安住菩薩淨戒律儀他罵報罵他瞋報瞋他打報打他弄報弄是名有犯有所違越是染違犯菩薩於修忍辱度時處處不離慈悲方便以資攝化若尋常人固可以直報怨但菩薩之饒益有情恩者固應恩度怨者亦應慈度若隨怨報怨則非菩薩之行也庚二不悔謝戒若諸菩薩安住菩薩淨戒律儀於他有情有所侵犯或自不為彼疑侵犯由嫌嫉心由慢所執不如理謝而生輕捨是名有犯有所違越是染違犯若由懶惰懈怠放逸不謝輕捨是名有犯有所違越非染違犯無違犯者若欲方便調彼伏彼出不善處安立善處若是外道若彼希望要因現行非法有罪方受悔謝若彼有情性好鬥諍因悔謝時倍增憤怒若復知彼為性堪忍體無嫌恨若必了他因謝侵犯深生羞恥而不悔謝皆無違犯若菩薩對於有情或實有侵犯或雖不侵犯而彼疑為侵犯者應向稱謝懺悔若由嫌嫉或憍慢心不如理稱謝而致彼懷恨謀報復者是染違犯若由放逸而不自知雖犯非染若因稱謝反令生慢若藉此作方便以資調伏令彼增長善根若遇外道之惡見無法稱謝或於此侵犯中彼不欲如理悔謝而希望更有侵犯時方受悔謝者若遇剛強有情因稱謝反生憤怒而增惡業者若他能忍辱不生怨恨者若因悔謝反令他羞恥致心不安者如上種種而不悔謝皆無違犯庚三不受懺戒若諸菩薩安住菩薩淨戒律儀他所侵犯彼還如法平等悔謝懷嫌恨心欲損惱彼不受其謝是名有犯有所違越是染違犯雖復於彼無嫌恨心不欲損惱然由稟性不能堪忍故不受謝亦名有犯有所違越是染違犯無違犯者若欲方便調彼伏彼廣說一切如前應知若不如法不平等謝不受彼謝亦無違犯菩薩受他人侵犯後若他以平等相對而來悔謝時當歡顏承受其悔謝使彼心安而增善業若懷嫌恨等心不受悔謝致令損壞令名以增長煩惱者是染違犯或雖不欲損惱而稟性高抗不能忍受不受悔謝者亦染違犯以菩薩行忍辱行當優容有情若生性不能容忍亦須設法對治之若縱令長養此不容忍性遺誤何窮故不可有此也若因悔者取法不平居高位而傲慢不合於理及有如前種種原因而不受悔皆無違犯庚四懷忿不捨戒若諸菩薩安住菩薩淨戒律儀於他懷忿相續堅持生已不捨是名有犯有所違越是染違犯無違犯者為斷彼故生起樂欲廣說如前菩薩於其他有情處懷有忿恨不捨怨結是染違犯若知犯已生起樂修斷除方便而尚未能斷除可無違犯己四障精進度庚一染心御眾戒若諸菩薩安住菩薩淨戒律儀貪著供事增上力故以愛染心管御徒眾是名有犯有所違越是染違犯無違犯者不貪供侍無愛染心管御徒眾若菩薩因懶惰懈怠貪著供奉承事以愛染心管御徒眾使之勤修侍奉而於彼應所作業致令退惰者是染違犯反之無犯可知庚二非時睡眠戒若諸菩薩安住菩薩淨戒律儀懶惰懈怠耽睡眠樂臥樂倚樂非時非量是名有犯有所違越是染違犯無違犯者若遭疾病若無氣力行路疲極若為斷彼生起樂欲廣說一切如前應知菩薩因懶惰懈怠貪非時過量之睡眠等是染違犯若有病無力或欲斷除睡眠等以方便力而生起樂欲者無犯庚三虛談棄時戒若諸菩薩安住菩薩淨戒律儀懷愛染心談說世事虛棄時日是名有犯有所違越是染違犯若由忘念虛棄時日是名有犯有所違越非染違犯無違犯者見他談說護彼意故安住正念須臾而聽若事希奇或暫問他或答他問無所違犯菩薩空棄光陰而不修習善法及饒益有情者是染違犯若忘念無記而致虛擲時日者犯而非染若隨順他暫與談說令安住正意者或希有事於自行有關而暫問他者或答他所問令人正解等皆無違犯己五障禪定度庚一惰慢不求禪法戒若諸菩薩安住菩薩淨戒律儀為令心住欲定其心心懷嫌恨憍慢所持不詣師所求請教授是名有犯有所違越是染違犯懶惰懈怠而不請者非染違犯無違犯者若遇疾病若無氣力若知其師顛倒教授若自多聞自有智力能令心定若先已得所應教授而不請者無所違犯菩薩欲令其心安住一境以定其心為嫌恨憍慢所持故不詣師求教者是染違犯若知師顛倒教授亂自正修者或自有多聞熏習力能令心定而不請者無犯其餘如文可知庚二不除五蓋定障戒若諸菩薩安住菩薩淨戒律儀起貪欲蓋忍受不捨是名有犯有所違越是染違犯無違犯者若為斷彼生起樂欲發勤精進煩惱猛利蔽抑心故時時現行如貪欲蓋如是瞋恚惛沈睡眠掉舉惡作及與疑蓋當知亦爾蓋者覆義覆蓋禪定令不現前故菩薩若貪染五欲覆蔽自心堪忍承受而不捨離致令禪定不得現前是染違犯但以貪欲習氣深故曾以方便生起樂欲發勤精進猶難遣除無犯餘瞋恚蓋惛睡蓋掉悔蓋疑蓋應知亦復如是庚三貪味靜慮戒若諸菩薩安住菩薩淨戒律儀貪味靜慮於味靜慮見為功德是名有犯有所違越是染違犯無違犯者若為斷彼生起樂欲廣說如前若於禪那心生味著便不能與出世智慧相應謂之味禪即凡夫定四禪四空八定為凡聖所共修有大乘慧相應則大乘定有小乘慧相應則小乘定若知定心緣生性空固不應生貪著若凡夫定既不與出世三乘慧相應由愚癡故便成貪心相應曰味靜慮若於此見為功德而不見其過則起顛倒邪見鄰於外道是染違犯修禪定而得成就者其樂超過世樂故其味著頗不易除在勤斷除而未能者無犯己六障般若度庚一對於法者辛一不學小乘法戒若諸菩薩安住菩薩淨戒律儀起如是見立如是論菩薩不應聽聲聞乘相應法教不應受持不應修學菩薩何用於聲聞乘相應法教聽聞受持精勤修學是名有犯有所違越是染違犯何以故菩薩尚於外道書論精勤研究況於佛語無違犯者為令一向習小法者捨彼欲故作如是說菩薩學大乘法應廣學世出世間一切教法之文字般若以期成就世出世間圓遍智慧方為究竟教是能詮理是所詮具理行果與聲聞乘相應教理即聲聞法謂菩薩不應聽受與憶持誦習聲聞乘法若生此見立此論者是染違犯蓋聲聞乘教為對治煩惱之法菩薩亦當依此斷除煩惱令得清淨以菩薩法甚為廣大聲聞乘法亦菩薩法中之一分捨之即不圓滿所以聲聞極果名阿羅漢梵語阿羅漢此云應供佛十號中亦有名應供者可想而知夫應供者即斷煩惱之果菩薩不以聲聞為滿足則可若竟輕視其法殊非圓解況從利他以言菩薩若遇聲聞仍須講說聲聞藏法資助開解不特此也菩薩尚須研究凡外經論以為度他工具況於佛說之聲聞藏可拋棄乎若為對治一部份執小乘教以為究竟者令其回小向大故作此說如法華等所明可無違犯辛二棄大向小戒若諸菩薩安住菩薩淨戒律儀於菩薩藏未精研究於菩薩藏一切棄捨於聲聞藏一向修學是名有犯有所違越非染違犯若菩薩於大乘法藏不樂研究專取聲聞藏法一向修學雖犯非染因聲聞法雖非究竟非增長煩惱之法故然於菩薩功德不能成滿故亦有犯辛三捨內學外戒若諸菩薩安住菩薩淨戒律儀現有佛教於佛教中未精研究於異道論及諸外論精勤修學是名有犯有所違越是染違犯無違犯者若上聰敏若能速受若經久時能不忘失若於其義能思能達若於佛教如理觀察成就俱行無動覺者於日日中常以二分修學佛語一分學外則無違犯若世間無佛之教法菩薩可學外論以為方便若現前有佛之教法應勤修學以生正解若仍酷嗜外論及異道論並認為最尊最勝之教法則將損正知見而失菩薩善法故成染違犯也若有上等聰敏於佛教有深刻研究而不為外論所動者或短時間可受且受後不忘者或於外道論義能思維通達知其長短不為所惑者或已能契合佛理之觀察雖受外道論說理觀能同時俱起現行而不為外見動其正覺者學亦無妨如近來各佛學院之課程有哲學科學宗教學及世間普通知識等苟於佛學無深研究必為所轉故應多注意於佛學令有心得每日中以二分光陰修學佛法一分光陰學諸外論助生菩薩般若資糧方可無犯辛四專習異論戒若諸菩薩安住菩薩淨戒律儀越菩薩法於異道論及諸外論研求善巧深心寶翫愛樂味著非如辛藥而習近之是名有犯有所違越是染違犯若菩薩越菩薩藏法專向外道論及外論研究善巧愛著習近殊為失其本分之學但菩薩於佛之教法有心得後為便於利他故研究外論須知學外論時如味辛辣為隨順教化一類有情故非此藥不足以愈其病故所以不得不學固非樂其法也辛五不信深法戒若諸菩薩安住菩薩淨戒律儀聞菩薩藏於甚深處最勝甚深真實法義諸佛菩薩難思神力不生信解憎背毀謗不能引義不能引法非如來說不能利益安樂有情是名有犯有所違越是染違犯如是毀謗或由自內非理作意或隨順他而作是說若諸菩薩安住菩薩淨戒律儀若聞甚深最甚深處心不信解菩薩爾時應強信受應無諂曲應如是學我為非善盲無慧目於如來眼隨所宣說於諸如來密意語言而生誹謗菩薩如是自處無知仰推如來於諸佛法無不現知等隨觀見如是正行無所違犯雖無信解然不誹謗若菩薩學大乘法藏遇諸佛以無分別之第一義及不可思議之神通等事種種最深境界謂不必深信領受且生毀謗者是染違犯如謂見到者可信而聖智位所證之境深不可測甚難見到由此以神通威力為不足深信謂不能引生正法義空談理想不能利益安樂有情如此等皆是以凡夫心測如來境者犯謗法罪近來有專以哲學科學眼光研究佛法者往往有此大誤若於佛法之境之行雖生解信而於超過凡夫心境之聖果事因不可測致生毀謗或由自思維或隨逐他說皆有犯菩薩戒故菩薩對於此最甚深義不能諦解當勉強領受而責己無知以真實無諂曲之心自慚善根力弱無明所盲致於如來所證真實不能了解其深密意故應如是自處於無知之地位更應推仰如來於諸佛法無不觀察照見而我不能了解反生疑謗生深慚愧如是正行雖不了解然不毀謗故無違犯上來五條中前二條明對於聲聞法宜正修學中二條明對外法宜正修學末一條明對甚深法宜正修學犯此五條障學菩薩般若庚二對於人者辛一愛恚讚毀戒若諸菩薩安住菩薩淨戒律儀於他人所有染愛心有瞋恚心自讚毀他是名有犯有所違越是染違犯無違犯者若為摧伏諸惡外道若為住持如來聖教若為方便調彼伏彼廣說如前或欲令其未淨信者發生淨信已淨信者倍復增長菩薩於他人所有瞋恚發毀他之語表對自己之團體及法或徒眾等染心愛護常加自讚是染違犯若修佛法應讚佛法而摧邪外以佛法能顯世間真實義諦利益眾生若住持如來正法於所處之環境中有摧滅外道必需者或假讚毀以調和其感情降伏其邪執者或自讚三寶毀他邪教令未生淨信生淨信或已生淨信令增長者皆無違犯辛二憍慢不聽正法戒若諸菩薩安住菩薩淨戒律儀聞說正法論義決擇憍慢所制懷嫌恨心懷恚惱心而不往聽是名有犯有所違越是染違犯若為懶惰懈怠所蔽而不往聽非染違犯無違犯者若不覺知若有疾病若無氣力若知倒說若為護彼說法者心若正了知彼所說義是數所聞所持所了若已多聞具足聞持其聞積集若欲無間於境住心若勤引發菩薩勝定若自了知上品愚鈍其慧鈍濁於所聞法難受難持難於所緣攝心令定不往聽者皆無違犯菩薩若聞有講正法論正義決擇是否者應即往聽多聞熏習護正法幢若恃自滿懷瞋恚心不往聽者是染違犯若因自己不聞不知或知彼說法者顛倒而說或知說法者能力有限而自處尊勝若往聽者反令不安若已正修觀行於所觀境安住其心不欲移心他境若正引發菩薩勝定若自愚鈍雖聽亦難領受故取少句義而為所觀之境如念阿彌陀佛攝心令定者皆無違犯辛三輕毀法師戒若諸菩薩安住菩薩淨戒律儀於說法師故思輕毀不深恭敬嗤笑調弄但依於文不依於義是名有犯有所違越是染違犯凡佛法應有法師開導講授令依三藏教義隨聞思惟若於法師處故意輕毀調弄不生恭敬者是染違犯上來三十二條犯之障修六度無犯則能修諸善法持攝善法戒清淨矣戊二障四攝利生菩薩六度齊修集諸善法更應本大悲心行方便事數數諦思應作或不應作以四攝法饒益有情云何四攝布施愛語利行同事是也四攝中之布施雖與六度中之布施同名然此專在利他之義布施者謂犧牲自己利益他人最足以引動人心令皈向正法蓋世人之所營求者厥為利養故菩薩饒益有情在在以布施為先使易親近既親近已則施以愛語而使彼樂聞增進智德凡作事於他有益處輒為助作故名利行至於起居食息以及經營事業皆取同等容易令他生清淨信入佛智慧故名同事如觀音菩薩三十二應亦同事行也此四攝行融貫於此十一條中雖不別出而思之皆一一可明己一不為助伴戒若諸菩薩安住菩薩淨戒律儀於諸有情所應作事懷嫌恨心懷恚惱心不為助伴謂於能辦所應作事或於道路若往若來或於正說事業加行或於掌護所有財寶或於和好乖離諍訟或於吉會或於福業不為助伴是名有犯有所違越是染違犯若為懶惰懈怠所蔽不為助伴非染違犯無違犯者若有疹疾若無氣力若了知彼自能成辦若知求者自有依怙若知所作能引非義能引非法若欲方便調彼伏彼廣說如前若先許餘為作助伴若轉請他有力者助若於善品正勤修習不欲暫廢若性愚鈍於所聞法難受難持如前廣說若為將護多有情意若護僧制不為助伴皆無違犯修菩薩法應以四攝法而攝化有情當同事者應與同事若以嫌恨心故於道路上感困難處不為助伴或於佛法中修加行如打七等時不為之幫助或他有財而自有力不為保護或他評訟而不為之調解或不為助伴於吉會如喜慶事及修世福出世間福等事是染違犯若知其所作事非正或不為助以令彼勤奮或於善法正自修學或所聞法難受難持不容暫離不助伴者皆無違犯己二不往事病戒若諸菩薩安住菩薩淨戒律儀見諸有情遭重疾病懷嫌恨心懷恚惱心不往供事是名有犯有所違越是染違犯若為懶惰懈怠所蔽不往供事非染違犯無違犯者若自有病若無氣力若轉請他有力隨順令往供事若知病者有依有怙若知病者自有勢力能自供事若了知彼長病所觸堪自支持若為勤修廣大無上殊勝善品若欲護持所修善品令無間缺若自了知上品愚鈍其慧鈍濁於所聞法難受難持難於所緣攝心令定若先許餘為作供事如於病者於有苦者為作助伴欲除其苦當知亦爾菩薩遇有疾病之人現前無論親疏貴賤其無醫藥與無人照應者菩薩應作饒益之事而充分供給其所需若以嫌恨心欲惱害之而不看顧者是染違犯若非共住轉請他人前往供事若知病人有其依仗若知彼有資財及其徒眾自能醫治及有看護之人若知彼病長年如是病相雖重堪自支持若正精進修習善法及善品類之法恐其間斷而不圓滿若至愚鈍於先所聞法尚難領受其義於所緣境上攝心令定更屬難能未容暫時拋棄若已許為他人供侍同時不克分身如此等不往供事者無犯對於病者如此對於苦者亦然謂苦亦如病之當遣除也己三不為宣說障愛語戒若諸菩薩安住菩薩淨戒律儀見諸有情為求現法後法事故廣行非理懷嫌恨心懷恚惱心不為宣說如實正理是名有犯有所違越是染違犯若由懶惰懈怠所蔽不為宣說非染違犯無違犯者若自無知若無氣力若轉請他有力者說若即彼人自有智力若彼有餘善友攝受若欲方便調彼伏彼廣說如前若知為說如實正理起嫌恨心若發惡言若顛倒受若無愛敬若復知彼性弊𢤱悷不為宣說皆無違犯若諸有情為求現在世法之事或求將來世法之事以求取之時廣行惡行如求現在之福壽祿位等當求取時信邪倒見或殺生媚神扶乩信鬼等如印度之馬祭凡求福壽者須殺三百匹馬便可得現世之解厄與後來之福報等此皆從顛倒心所起惡業苦果了無已時菩薩若遇如此有情當為開導如實真理令生善行方可得到現後之好結果如教不殺生而救生可得長壽布施身命財力以濟群眾可得富貴利祿若對前人懷恨惱心不為如實開導而縱令造惡受苦者是染違犯若自心尚不知如實真理不能宣說或自無力轉請他人往說或知此人有大智力不久即可覺悟若他雖行非理現時有餘善友初信位以上菩薩及佛皆為善友亦即善知識善知識者以善法勉人為之提獎或因調伏或因惡行已深與說真理反令生謗反發惡言益深惡業或知其無智慧於真理上反生誤解如說眾生皆無我不可存我見從大公無私上去會則合真理彼即謂既云無我則人類等與木石同打罵殺害皆無罪過則倒受也或無愛敬而不至心領受或知身心𢤱悷不調乖僻不經如此等不為宣說者皆無違犯己四有恩不報戒若諸菩薩安住菩薩淨戒律儀於先有恩諸有情所不知恩惠不了恩惠懷嫌恨心不欲現前如應酬報是名有犯有所違越是染違犯若為懶惰懈怠所蔽不現酬報非染違犯無違犯者勤加功用無力無能不獲酬報若欲方便調彼伏彼廣說如前若欲報恩而彼不受皆無違犯菩薩所對之有情境種種不同此明先於菩提有恩惠之有情所應了知其恩惠而為相當報酬使施恩惠者樂於施與其他若對其人懷嫌恨故不為現前如應酬報者是染違犯若雖精勤加功用行而現前無力酬報或方便使他暫時不得報待之將來於彼較為有益若雖酬報他不受等皆無違犯己五患難不慰戒若諸菩薩安住菩薩淨戒律儀見諸有情墮在喪失財寶眷屬祿位難處多生愁惱懷嫌恨心不往開解是名有犯有所違越是染違犯若為懶惰懈怠所蔽不往開解非染違犯無違犯者應知如前於他事業不為助伴菩薩如遇遭感愁惱諸有情時應當前往開解令生正見了知緣生性空無得無失及種種因果之理等信入佛法若懷嫌恨心聽令愁惱者是染違犯若為其他勤加功用或為借作調伏方便或為事業所羈不前往開解皆無違犯己六希求不給戒若諸菩薩安住菩薩淨戒律儀有飲食等資生眾具見有求者來正希求飲食等事懷嫌恨心懷恚惱心而不給施是名有犯有所違越是染違犯若由懶惰懈怠放逸不能施與非染違犯無違犯者若現無有可施財物若彼悕求不如法物所不宜物若欲方便調彼伏彼廣說如前若來求者王所匪宜將護王意若護僧制而不惠施皆無違犯菩薩所承受之資生等物皆為利益攝受眾生之用若遇正來悕求應當施與使種善根若懷嫌恨而不給施者是染違犯若現在自給尚無無可施與者或求者是不如理法之物或所求之物與彼不相宜或知求者向非善類滿意之後反滋惡業或為國法所不許未便違政府之意以破壞法律擾亂社會或為僧眾戒律所不許如此原因不惠施者皆無違犯此菩薩戒皆切於實際可應用之法如布施不至於過分或不合理之要求可以不施無有違犯己七攝眾不施戒若諸菩薩安住菩薩淨戒律儀攝受徒眾懷嫌恨心而不隨時無倒教授無倒教誡知眾匱乏而不為彼從諸淨信長者居士婆羅門等如法追求衣服飲食諸坐臥具病緣醫藥資身什物隨時供給是名有犯有所違越是染違犯若由懶惰懈怠放逸不往教授不往教誡不為追求如法眾具非染違犯無違犯者若欲方便調彼伏彼廣說如前若護僧制若有疹疾若無氣力不任加行若轉請餘有勢力者若知徒眾世所共知有大福德各自有力求衣服等資身眾具若隨所應教授教誡皆已無倒教授教誡若知眾內有本外道為竊法故來入眾中無所堪能不可調伏皆無違犯正授經論使明如實真理名無倒教授正授以律使正身心行業名無倒教誡菩薩於所攝受徒眾若有顛倒之思及不正當行為當律其行而曉以理至於四事有所匱乏當從清信居士等處為之追求資身什具令彼心安意穩道業易成若懷嫌恨不為求供給者是染違犯若故意不教不養而為調伏之方便或與僧制不合或知彼有力堪可自給或曾住教道已無顛倒之行為或知徒眾中有外道潛伏為竊法來不可調伏如是而不教養皆無違犯己八不隨心轉戒若諸菩薩安住菩薩淨戒律儀懷嫌恨心於他有情不隨心轉是名有犯有所違越是染違犯若由懶惰懈怠放逸不隨其轉非染違犯無違犯者若彼所愛非彼所宜若有疾病若無氣力不任加行若護僧制若彼所愛雖彼所宜而於多眾非宜非愛若為降伏諸惡外道若欲方更調彼伏彼廣說如前不隨心轉皆無違犯菩薩於他有情當攝心令正住不隨物轉能轉於物方合佛理如普賢十大願行中恆順眾生應順有情心而轉者何耶以須隨順而資度脫也若菩薩以嫌恨心不隨眾生心轉者是染違犯若隨他轉非彼所宜或雖為他所愛所宜而在當前眾中共所非議或彼外道隨他轉者反增惡燄自惡惡人若欲調伏他等而不隨轉皆無違犯己九不隨喜讚揚戒若諸菩薩安住菩薩淨戒律儀懷嫌恨心他實有德不欲顯揚他實有譽不欲稱美他實妙說不讚善哉是名有犯有所違越是染違犯若由懶惰懈怠放逸不顯揚等非染違犯無違犯者若知其人性好少欲將護彼意若有疾病若無氣力若欲方便調彼伏彼廣說如前若護僧制若知由此顯揚等緣起彼雜染憍舉無義為遮此過若知彼德雖似功德而非實德若知彼譽雖似善譽而非實譽若知彼說雖似妙說而實非妙若為降伏諸惡外道若為待他言論究竟不顯揚等皆無違犯菩薩若遇有德有譽善於妙說之人應當稱揚讚歎使人知而生信植種德本若懷嫌恨而不稱揚是染違犯若知其人少欲知足為之稱揚反而引生他事致感不安或反使失其令名者若知雖有德行妙說但一旦為之顯揚反生憍矜輕舉等過或雖有相似之德譽妙說祗足引一般初進之趨附實為識者所不屑道因相似而非有實德之故或為降伏外道或待他言論等終結以如是等而不稱揚皆無違犯己十不隨行威折戒若諸菩薩安住菩薩淨戒律儀見諸有情應可訶責應可治罰應可驅擯懷染汙心而不訶責或雖訶責而不治罰如法教誡或雖治罰如法教誡而不驅擯是名有犯有所違越是染違犯若由懶惰懈怠放逸而不呵責乃至驅擯非染違犯無違犯者若了知彼不可療治不可與語喜出麤言多生嫌恨故應棄捨若觀待時若觀因此鬥訟諍競若觀因此令僧喧雜令僧破壞知彼有情不懷諂曲成就增上猛利慚愧疾疾還淨而不呵責乃至驅擯皆無違犯菩薩行四攝法饒益有情須扶助其防非止惡改過遷善不得懷染愛心縱令放逸倘應訶責應治罰應驅擯者須如律規懲辦勿得寬容或從輕治否則即犯染罪故佛法之慈悲方便在如何御人以道而非姑予優容者可比若法應如此而不如此者縱其任情墮落非慈悲也近來怙惡不悛之徒往往因要求不遂輒詆為不慈悲者至於握有統理大眾之僧權者不特自己放蕩形骸坐視大眾之墮落於不顧反自謂為方便實不知慈悲方便為何物遂致佛法不振不其痛乎若知其人不可救藥若與之語反生麤言惡念或觀後效或恐引起門爭結果不良或足使眾僧喧雜破僧和合或知為一時之錯誤但無諂曲之意如一明白即可從此增起猛利慚愧自得還淨因此不訶責乃至不驅擯者皆無違犯己十一不隨現神力折攝戒若諸菩薩安住菩薩淨戒律儀具足成就種種神通變現威力於諸有情應恐怖者能恐怖之應引攝者能引攝之避信施故不現神通恐怖引攝是名有犯有所違越非染違犯無違犯者若知此中諸有情類多著僻執是惡外道誹謗賢聖成就邪見不現神通恐怖引攝無有違犯菩薩以修禪定或證聖果得到種種神通變現之威力後對惡有情當恐怖之以挫折其惡燄而棄捨其惡行或遇有情樂於神變亦當方便引攝若避信施恐因之而得布施利養不為恐怖引攝者雖犯而非染違犯若知有情有偏僻之執著自以為是不受感化若現神通反致生謗而不現者皆無違犯丁三總明無犯又一切處無違犯者謂若彼心增上狂亂若重苦受之所逼切若未曾受淨戒律儀當知一切皆無違犯一切處者指四十三條輕戒中一切違犯之處此又總出無違犯者謂其心有增上狂亂或現有重病等逼迫無力實行戒法或未受淨戒律儀等於一切處皆無違犯若無此三因者有犯無犯在當人依戒條而自去觀察之乙二明持悔若諸菩薩從他正受戒律儀已由善清淨求學意樂菩提意樂饒益一切有情意樂生起最極尊重恭敬從初專精不應違犯設有違犯即應如法疾疾悔除令得還淨如是菩薩一切違犯當知皆是惡作所攝應向有力於語表義能覺能受小乘大乘補特伽羅發露悔滅菩薩於受戒後當持勿犯如稍有犯應速如法改悔使令還淨故有此段文義從他者謂受戒有其三品以所從之他緣不同而所得之戒有優劣凡受戒人一面從自發心一面仍須依他為增上緣若遇佛住世或大乘地上菩薩住世得從之受戒者皆多生善根所招方有此最上勝緣是為上品戒若無上述勝緣依佛法中曾經受過菩薩戒之十信等位外凡內凡之菩薩依可作為師範之菩薩比丘處從而受之是為依中等增上緣得中品戒在中國所通行之菩薩戒皆從施受但如此方無授戒師向千里外亦尋不得乃許於佛菩薩像前香花供養懺悔往業經若干時得感應後方為得戒若未感到佛菩薩現前摩頂之瑞像為不得戒但如此得戒猶為下品戒故須以從他正受為勝也意樂謂意志之所樂如仁者樂山智者樂水之意樂意樂起時所有各種所為皆隨之而轉移故意樂為一切行為之主動力若凡夫得到此種之清淨意樂宛如另換一心將無始染劣勢力完全革除從新建起菩提之心蓋凡夫心多貪五欲其意樂亦為五欲之意樂能改此意樂以成立此中三種意樂則得三聚淨戒由求學一切菩薩善清淨戒之意樂則得菩薩律儀戒之戒體便能離一切惡法而得清淨有此戒體則能持一切律儀戒菩提者即阿耨多羅三藐三菩提換言之即佛果之菩提也此菩提之意樂生起則於人天福報二乘解脫悉無所求惟念念求無上菩提即神通等亦為無上菩提而修自此意樂發起以後自能去修集無邊福智以為菩提之資糧是以菩提意樂為攝善法戒之戒體饒益有情意樂者謂意之所樂心心念念皆欲饒益有情乃能時時刻刻去作饒益有情之事是為饒益有情戒體若感發得此三種意樂為三聚戒體依戒體而持菩薩戒則易如順水行舟也因內心已有持戒之力故若由此意樂受菩薩戒者應對此菩薩戒生深恭敬從初受戒勿令違犯因此戒為心戒犯不犯皆繫於自心須在其動機上之隱微中以明察其德失又菩薩戒在佛果位方能清淨故菩薩地亦難全淨若有違犯應即如法懺悔令速清淨否則便毀戒體梵語突吉羅此云可懺悔菩薩正得戒體之後所有違犯是惡作罪故可懺悔其懺悔法應向有智慧力之菩薩前將惡作事如實發露請其證明務須在能覺到能領受所說語意之小乘或大乘人梵語補特伽羅此云數取趣在人趣即人前發露懺悔乙三明悔法丙一對他懺除丁一上品纏犯應更受若諸菩薩以上品纏違犯如上他勝處法失戒律儀應當更受丁二懺中品纏犯若中品纏違犯如上他勝處法應對於三補特伽羅或過是數應如發露除惡作法先當稱述所犯事名應作是說長老專志或言大德我如是名違越菩薩毗柰耶法如所稱事犯惡作罪餘如苾蒭發露悔滅惡作罪法應如是說丁三懺下品纏犯及餘違犯若下品纏違犯如上他勝處法及餘違犯應對於一補特伽羅發露悔法當知如前丙二自誓懺除若無隨順補特伽羅可對發露悔除所犯爾時菩薩以淨意樂起自誓心我當決定防護當來終不重犯如是於犯還出還淨若犯四重戒之上品纏者非可懺悔因戒體已失故應當重受若中品纏犯者當對三人以上小乘人或大乘人能覺能受懺悔人所發出之語言者前以表示所犯罪而發露懺悔之其懺悔法方能成立如稱長老或稱大德我如是名今犯菩薩戒中可懺悔之何事請為證明懺悔犯下品纏犯四重戒或上中下纏犯餘輕戒等當向一人已上之菩薩比丘前發露懺悔然懺悔既應從他而懺悔如此方無菩薩比丘及知菩薩戒之人時可於佛菩薩像前設香花供養如法披露以清淨意樂自誓悔改後當即防護終不再犯乃至得到感應其懺悔法亦可成立但不如正對他人之懺悔力為勝耳甲三結應敬修復次如是所起諸事菩薩學處佛於彼彼素怛纜中隨機散說謂依律儀戒攝善法戒饒益有情戒今於此菩薩藏摩怛理迦綜集而說菩薩於中應起尊重住極恭敬專精修學菩薩應學之菩薩戒法佛曾於瓔珞梵網經等中隨有情根機而散說若七眾戒及比丘之五篇戒等皆攝在菩薩戒之依律儀戒中而攝善法與饒益有情戒散說於各經今彌勒菩薩綜集而說於瑜伽師地論中菩薩於此戒法應恭敬尊重而精勤修學因為原是佛所說故顯要旨一應了知者三事此菩薩戒法有先應了知之三義第一應了知者受菩薩戒學菩薩法以先發大悲菩提心為體若未發起大悲菩提心者則非菩薩不應學受菩薩戒法故受戒時師應問曰已發菩提心否是菩薩否其時之求戒者當毅然答曰已發是菩薩方能得戒然小乘亦有智果故了生死之智可通大小若無大悲心為根本則不能起取大菩提之意故不得菩薩戒也且若不發大悲心者亦用不著來求學菩薩戒經云菩薩以菩提心為因大悲為根本方便為究竟故大乘菩薩心為大悲菩提心求菩薩戒必須先發此心第二應了知者受學此菩薩戒法須以智慧為先導故應先依菩薩藏之經論有深切研究得到圓滿透徹之正解時方有正見正知其正知見既已成就即以之為先導方可行持菩薩戒法因此菩薩戒為入俗利生之事不易行持持此戒者常於心地上觀照所作之業犯與不犯須有確切之審度與標準若無最高智慧以為審度標準則雖已犯而不自知便亦不能懺悔以求清淨則即無由學持此菩薩戒若梵網經所說之戒其作與不作皆為刻板之規定故猶易持而此戒法則在同一事上有犯不犯或染不染在纖微間甚難決也故須有智慧為先導方能受學第三應了知者在此菩薩戒法中皆為攝善法戒及饒益有情戒故應以七眾戒為律儀戒而善法戒與饒益有情戒又以律儀戒為所依故欲學此菩薩戒者應先受七眾戒以為菩薩戒中之律儀戒則於三聚淨戒方得圓滿如優婆塞受菩薩戒為菩薩優婆塞乃至比丘受菩薩戒為菩薩比丘等依瑜伽論所明若失於律儀戒則失餘一切戒故若不從僧受三皈及七眾戒即不能受此菩薩戒二顯殊勝者三事第一此戒法與其餘之菩薩戒法不同者餘兼三乘共同之律儀戒此戒專明應如何修六度以修集諸善法應如何行四攝饒益有情故此戒最明白而扼要者正大乘菩薩之特殊精神所存不學此菩薩戒無以見菩薩之殊勝第二菩薩戒法在於契真入俗之中道行因俗人在俗而不能契合出世真理二乘出世自利而不能作涉俗行事惟菩薩能上契真理下順凡情修圓融二諦之中道行門此戒法中處處皆能表現理事雙彰真俗并到之大乘了義行如對聲聞家之斷煩惱法既不捨離復能隨順有情成就勝出聲聞乘功德等皆明此義第三此菩薩戒乃深切現今七眾佛徒實際上辦事之應用者如出家僧辦佛學院及公益慈善等皆時勢上應辦之事換言之凡與眾人相關而有益社會之事今後皆應去辦非復閉門修行可盡其責然出家僧辦事須受學此菩薩戒法方有辦事行軌否則破壞佛法違背教規而不自知若以前出家僧所採之修行法非自了之禪宗即往生之淨土皆不圓滿此戒方為正修之菩薩行至於禮拜念誦亦萬行中之一若依此戒發菩提心去行六度四攝則尚何行不備惜中國向來修行者大都不知注意乎此惟以空心靜坐為修行對於現身社會去作一切利他事業極端反對謂非本分其有能作事者又多未得菩薩戒之真諦故其一舉一動皆貪瞋癡之煩惱為之主動將中國佛教弄成死氣沉沉怪象重重良可慨也夫菩薩之修行六度以不離有情界之實際作一切利生事業為正修行故非學此戒去修菩薩行不可此戒為現今在家出家之佛徒需要以在現今國家社會之環境中尤非昌明此大乘菩薩法不可其各顧身家以各自了之思想已用不著故佛教徒眾對於社會人群互關互益之事精勤去作方能顯出佛法精神方能為建立國民道德之基本故今在家佛弟子之設社立林結群集會以宏化者欲求得一寡過成德之標準法於此菩薩戒法大不可不深注意焉普超克全記見海刊十三卷六七八期
