body:
  text: 優婆塞戒經講録上二十四年五月在南京中國佛學會講懸論一佛法與人生之關係甲人生難得佛法難聞乙人道為罪福聖凡樞紐丙降生人間成佛説法二此經在佛法中之位置甲五乘共法與大乘不共法乙在境行果中特重在行丙優婆塞戒中心之佛法丁在家菩薩中心之佛法三本人在佛法中之意趣甲非研究佛書之學者乙不為專承一宗徒裔丙無求即時成佛貪心丁為學菩薩發心修行者四今講此經之所為甲為建立人間大乘佛教乙為提倡實踐修行丙為從基本之戒學修起丁為從普通之六度修去五本經譯傳之略史甲曇無讖法師在北涼姑臧譯乙與此經類似各經之辨別丙本經與優婆塞戒本釋經甲一敘啓分乙一追敘嘉會乙二問啓綱宗丙一本事問答丁一問禮六方丁二答修六度丙二決擇問答丁一辨能供養之菩薩性丁二辨所發生之菩提心戊一明十種能發因戊二示三種所發心戊三辨發心無定性丁三辨菩薩性之因緣生丙三揭示綱宗丁一彰一切菩薩之義類丁二顯在家菩薩之殊勝甲二正説分乙一明能行六度之菩薩丙一廣説修成菩薩之行丁一策發心願戊一策發總心己一明發心相庚一善生問庚二世尊説辛一分別廣説壬一信解發菩提心壬二修習發菩提心壬三真正發菩提心辛二結示正宗己二辨發心因庚一大悲生因辛一問答發因壬一通問發因壬二廣答因義癸一泛説多種因相癸二正辨悲是生因辛二問答修悲壬一善生問修悲法壬二如來説修悲相癸一三十六因明生悲癸二別以四因明大悲壬三結示修悲利益癸一總明修悲菩薩益癸二別顯在家菩薩益癸三結成修悲廣大益庚二解脫了因辛一承前起説辛二問答推明壬一問得體義壬二問方便得癸一辨得不得癸二得解脫時癸三得解脫人壬三問得法相癸一正明相得癸二廣辨得人子一就五趣辨子二就三乘辨癸三作菩提種癸四明佛難得癸五顯在家勝戊二別策勝願己一辨勝策發庚一辨三種菩提策發辛一善生問辛二如來答壬一就所問三義答壬二別增舉八事辨壬三廣明佛功德辨癸一總示佛功德癸二別顯身心力癸三列舉諸德號癸四結非聲緣比壬四結在家菩薩勝庚二修三十二相策發辛一善生躡問辛二如來廣説壬一正答得成身力壬二總明修相功德癸一略明功德癸二較顯功德癸三出修相人癸四示修相時壬三別明修相次第癸一泛説先修何相癸二正明修相次第壬四結在家菩薩勝己二正發勝願庚一善生問答庚二廣説發願辛一發願所因辛二正陳願言辛三顯示願果壬一總顯立願利益壬二別明法財長者壬三結示法王自在庚三結在家勝丁二積集福智戊一分別名義菩薩己一善生問己二如來答庚一假名菩薩庚二實義菩薩庚三彰在家勝戊二勉為實義菩薩己一正明實義菩薩庚一善生問庚二如來答辛一列舉本生行辛二泛明菩薩行辛三行時自觀心辛四較顯在家勝己二勉修菩薩功行庚一舉德勸修辛一舉自利利他勸壬一問答菩提及道壬二問答三乘同別壬三分別菩提學果壬四正明自他兼利癸一示自他兼利相癸二能自他兼利行癸三辨自他兼利人子一從説法聽法辨子二從在家出家辨子三從自行化他辨壬五顯在家菩薩勝辛二舉自他莊嚴勸壬一問答能自他利壬二問答八事所因壬三明八事所由成癸一三因緣癸二八所以壬四由八事所成德癸一有德不憍癸二處世不動壬五顯在家菩薩勝辛三舉福智二嚴勸壬一躡前問答壬二究因問答壬三明二嚴相癸一以果利明癸二以因行明癸三以別相明壬四結在家勝庚二化他攝衆辛一善生問辛二如來答壬一總明以四攝法蓄徒壬二無德有德蓄徒弊利壬三別辨在家出家蓄徒癸一總明出家在家癸二別辨出家在家子一出家教二衆丑一教出家弟子丑二教在家弟子子二在家教一衆丑一師長教徒衆丑二國王教民衆壬四結顯在家菩薩難勝丁三受持戒行戊一受戒己一善生問己二世尊答庚一受前方便辛一供養辛二請許辛三問答壬一問遮難壬二審至誠壬三示歸戒壬四廣教誡辛四試察庚二正受戒法辛一總授歸戒辛二別示重輕壬一六重戒相癸一正説癸二結讚壬二草八輕戒癸一列舉癸二結讚壬三結在家勝戊二持行己一持戒清淨庚一善生問庚二世尊答辛一示能淨法辛二辨淨心時辛三結在家勝己二息除諸惡庚一問答息惡庚二問答修法辛一問修法辛二答念佛壬一廣觀佛德壬二結會戒淨壬三結在家勝己三供養三寶庚一善生問庚二世尊答辛一三寶福田辛二住持三寶壬一廣明佛寶癸一建供塔像癸二敬讚佛法壬二略顯法僧辛三示供養益辛四結在家勝丙二正明能行六度之相丁一善生問丁二世尊答戊一正答能行人相戊二別明各有四事戊三確示定有六度戊四出六波羅蜜相戊五結顯在家為難乙二明菩薩所修之六度丙一施度丁一問答能事丁二廣明施度戊一略示施體戊二分別施相己一五種施己二四塵施己三二三施己四除障施己五辨施主己六觀施理己七能樂施己八策貧施戊三論施受義己一略明施受己二陰作陰受己三前作後受己四待時成受戊四成淨施主己一離不淨施己二正明淨施己三較量施福己四辨無惡果己五論得果別己六明財法施己七明鬼神施己八雜明施義己九施到彼岸己十先教後施己十一醫藥施病己十二廣作淨施丁三結在家難丙二戒度丁一三歸戊一善生問戊二如來答己一明三歸依義己二明三歸次第己三明三歸依戒己四明三歸得失己五明破邪崇正己六結在家難行丁二八戒齋戊一善生問戊二世尊答己一總答己二廣答庚一説四喻顯德庚二正受八戒齋庚三明此時受勝己三結勝丁三五戒戊一善生問戊二世尊答己一答得歸戒己二分別戒相己三廣讚戒德己四別詳戒齋己五法非法住己六顯在家難丁四尸波羅蜜戊一善生問戊二如來答己一通答堅固四法己二別明戒為根本庚一顯戒持犯得失庚二為自為世為法庚三持戒到於彼岸庚四正明持戒諸相己三結成在家難勝丁五十善戊一善生問戊二如來答己一略明十善源流己二廣説十善法義庚一開示業果勸修庚二分別善惡令持庚三説十不善業相辛一正説十不善業辛二分別復單輕重辛三示從貪瞋癡起辛四止十惡修十善辛五就殺廣辨業道辛六就餘總略分別庚四證成作無作義庚五辨明惡戒勸離庚六明受戒得戒相庚七別辨五逆罪相庚八辨得報定不定庚九顯由意成形義庚十明諸戒得捨相庚十一明善惡報壽命庚十二總明諸業報相己三結成在家難勝丙三忍度丁一善生問丁二如來答戊一略出忍體戊二忍波羅蜜戊三示修忍法戊四成就忍德戊五結在家難丙四進度丁一善生問丁二如來答戊一正答正因戊二分別邪正戊三進波羅蜜戊四結在家難丙五禪度丁一善生問丁二如來答戊一略明定相戊二示修禪法戊三顯禪功德戊四四無量定戊五禪波羅蜜戊六結在家難丙六慧度丁一善生問丁二如來答戊一顯示慧相戊二成慧功德戊三慧波羅蜜戊四總修六度戊五結在家難甲三結成分重示懸論優婆塞戒經即今日開講之經在未講經文之前先將宣講此經大意略言之一佛法與人生之關係現在流行於人世之佛法所以開導人生者最為深切故先就佛法與人生之關係分別明之甲人生難得佛法難聞從佛法出發點言佛法不獨為此地球人類而説是普為一切而説所謂普為盡虛空無邊世界一切衆生之類而説但現今流傳此世界之佛法則為釋迦牟尼在此人類中成佛所説人類固為衆生之一類而在一切衆生中卻具有特殊之意義蓋釋迦牟尼佛現身人類中説法大部分為依人類而施設者佛謂人生難得佛法難聞即言得生為人之不易以佛法觀人類確有優勝之點但得到人身者亦不一定能聞到佛法如不聞佛法則不知人生之真價而一期人生仍是空過必要聞到佛法方知無始以來從業受果一生一生生生相續因有善業方能得到人身而人身又復無常假使在人生中為惡為善或發解脫心或發菩提心則可轉受惡趣善趣或阿羅漢辟支佛以至菩薩及佛之果報此由聞到佛法乃知人生意義之深廣而佛法與人生關係之密切亦可見矣乙人道為罪福聖凡樞紐人為無數衆生中之一類佛法中常分衆生為十類所謂四聖六凡四聖為阿羅漢辟支佛菩薩及佛此四聖已超脫生死輪轉其猶在生死中輪回者則為六凡天人阿修羅地獄鬼畜生在六凡中人道之上祇有天之一道在人道下則為阿修羅地獄餓鬼畜生之四道即四惡趣係感受惡業之果報者阿修羅意為非天近似常人所説之所謂神道彼有天之威福而無天之德其性好鬥故時亦受苦此下畜生即飛禽走獸等類常人謂為動物者此為人類能見之衆生尚有人類所不能見者即所謂幽冥世界之衆生則地獄餓鬼兩道也此兩道衆生純受苦報大致在十類中人與天兩道適居中間但人天雖同處中間天道則以享受福報為勝其身心之創造能力則仍不及於人道在人道中造惡業則可受多生多劫之罪報造善業或值遇三寶聞持佛法則可受多生多劫之福報且從凡位轉超入四聖果位此唯人道為能之如餘經論中詳説由異生即六凡而生起聖道者唯人中能之為別道異生所無以人道能修習布施持戒多聞等極多功德雖天道亦有所不如此為人道特殊之功能所以謂人道為轉生四聖及其餘五凡之樞紐人生此種意義唯佛法發揮盡致非佛法則不能知人生乃有超凡入聖之希望丙降生人間成佛説法佛法是釋迦牟尼佛降生人間所證所説之法佛有三身所謂法性身受用身變化身佛之法性身與自受用身遍一切處無相可睹其所説八相成佛之變化身佛則為人類等衆生所共見之佛此係最後身菩薩從兜率天上降生人間出家修道成佛説法就此八相成佛言乃有佛所説法然此佛法非僅流行於人世即天宮海藏亦均由是而得有佛法化行因現身成佛説法度生皆在人間即可見佛法與人間關係尤切所以唐裴休長者作圓覺經序云諸天正樂修羅方瞋鬼神沉幽囚之苦畜生懷獝狖之悲其能整心慮趣菩提者唯人道為能故知佛法雖普為衆生而就特殊關係言之人類為佛法所依佛法為人類所最需要所以人生對於佛法極應研究了解依以修行也二此經在佛法中之位置此經即優婆塞戒經為衆經中之一部流行之佛典大概可分為經律論之三藏復有古德種種著作為雜藏併之可稱為四藏此經屬經藏中之一經經者梵語修多羅乃結集佛所説法以傳世者而此經在佛經中居如何之位置茲略加以分別甲五乘共法與大乘不共法佛法可分三類一五乘共法即人天聲聞緣覺菩薩共法此五乘共法中人天善法為出世三乘之基礎二三乘共法同為了脫生死超出輪轉之法即聲聞之四諦緣覺之十二因緣三大乘不共法即發菩提心廣度衆生修學六度萬行成佛之法此經在三大類中以名優婆塞戒故可為五乘共法以明發菩提心修學六度廣度衆生故又可為大乘不共法所以此經可謂為五乘共法與大乘不共法因之受持此經之戒者即為菩薩優婆塞乙在境行果中特重在行此經在佛法境行果中以説明何者為主佛經凡説明諸法性相者為境説明持戒修六度行者為行説明佛果福智莊嚴功德者為果諸經中有特重明境者有特重明行或果者有兼重若二若三者此經重在説明受持戒行故於境行果中為特重在行之經丙優婆塞戒中心之佛法以此經在明優婆塞戒所以為優婆塞戒為中心之佛法優婆二字為譯音譯意有翻為清信者有翻為近事者有翻為善宿者總而言之可謂清淨正信近事佛法之弟子塞字亦為譯音意指男性在家弟子有男性有女性此經因為男弟子善生所問起而説故題為優婆塞戒經論其性質亦可題為優婆夷戒經夷者女性也以優婆戒男女無分別故此經所明佛法關涉佛所證所説之一切法但以優婆塞戒為中心故應以之為線索而貫通之也由此點觀之自發菩提心至受戒品為明由能優婆塞戒之人而受戒自淨戒品至般若波羅密品為明受優婆塞戒人所應修之行故名之曰優婆塞戒經丁在家菩薩中心之佛法優婆塞戒經最好題為在家菩薩經蓋觀集會品所明在家之人發菩提心勝於阿羅漢辟支佛等果又每品末皆謂在家之人發菩提心種種之難於出家人是此經雖貫通於一切佛法靡不窮盡然究以在家菩薩為其中心而其讚歎在家之人發菩提心從四天王乃至阿迦尼吒諸天皆大驚喜尊得人天之師又以出家之人不事生産受人天供養於布施波羅密反難圓滿故此經乃特為在家菩薩之所宗也三本人在佛法中之意趣首都各界此次發起請本人講經原未定何種經典其決定講此優婆塞戒經者乃出於本人之選擇而選講此經有關本人在佛法中之意趣故特提出説明之甲非研究佛書之學者有人見本人有許多著述以為是於佛學有專門研究之學者其實從事考稽佛學書籍而研究其義理以造成一專門之學者亦殊非易易所以用字比句櫛勾古證今之功夫將佛書當學問來研究者並世雖不乏其人而本人則讀書每觀大略不事記誦不求甚解但資為自修化他之具故在吾之志願趣向上不在成為學者其所有著作亦皆為振興佛教弘濟人群之方便耳乙不為專承一宗徒裔在佛法中自古即有開承一宗者如中國之天台賢首等而宗又分派則如禪宗之臨濟曹洞溈仰等此皆是古德以自悟之心得及教化上適應時機而建立最早在印度有小乘十八派或二十派之別嗣後大乘復興遂有大小乘對立大乘復分法性法相之空有兩宗繼之又有真言宗興起故宗派對峙不獨在中國為然也至中國性相律密各宗為承傳印度之宗派台賢禪淨等宗則為創立之宗派日本承中國復有日蓮宗淨土真宗等之開創各宗至今皆有專承之人系統甚嚴而各自弘揚其本宗之教義至本人在佛法中之意趣以為由佛之無上遍正覺所證明之法界性相為度衆生應機設教則法有多門故法本一味而方便門則無量無邊佛法本旨既是如此所以一切菩薩古德所開承之宗派無非在方便妙用上顯其區別究竟均是趣向於無上大覺海中者由此本人於佛法中不為專承一宗而弘傳之人佛之現身人間應機説法而聽法承傳之人當即不免各有偏勝故佛所説法由迦葉阿難承傳之則成初期小乘由龍樹馬鳴無著天親傳弘之則成中期大乘由龍智善無畏蓮華生傳承之則成後期密法印度佛法因之即分為三期至佛滅千二百餘年後佛法在印度即由衰落而銷聲匿迹而轉盛行於異地印度初期佛法可以傳入於錫蘭暹羅緬甸等地之巴利文系見之以錫蘭為代表第二期佛法可以由梵文譯傳為中國之漢文系見之再傳入於高麗日本等地以中國為代表第三期佛法可以傳入西藏而密法為中心系見之西藏再傳於蒙古尼泊爾等地以西藏為代表此為印度三期分流三系之佛教流行二千餘年之大概其於諸法性相一味平等之各宗派法門本可隨人根機所宜而修學藉以通達究竟覺海則能修之人與所修之法本無高下所以本人觀察佛法之五乘共法三乘共法及大乘不共法原為一貫在教理解釋上教法弘揚上隨宜施設不專承一宗以自拘礙丙無求即時成佛之貪心佛法原不拘限以現身此世為立足點乃普為法界一切衆生而發心蓋以佛法觀察一人與一切衆生互相關涉而一世界與無量世界亦相攝相入如帝網之重重無盡因此佛法不是為此一人生與此一世界而起即此一生一世亦當體無始無終無邊無中所以發心修行應不為空間時間所限宜普遍平等超出一切時空而涉入一切時空於佛法如此理解信行即能自悟悟他精進無息再無庸拘定要即此身成佛蓋成佛亦不過自悟悟他而已菩薩行滿佛陀果成但勤耕耘自能收穫何藉刻期企求若有拘求心量自狹將不免為虛榮心所驅使為滿足此虛榮心而去著相貪求則反增煩悶難得自在佛法為接引一類好夸大之衆生亦曾施設立地成佛即身成佛等假名而本人則不因此假名而引起希求即身成佛之貪心丁為學菩薩發心修行者前三從消極的反面説此則從積極的正面言之本人係以凡夫之人得聞解佛法信受奉行者認為五乘共法三乘共法及大乘不共法均一貫可達到究竟圓滿之覺海凡從貫通五乘三乘之大乘教法發菩提心修菩薩行者即是菩薩願以凡夫之身學菩薩發心修行即是本人意趣之所在蓋真發菩提心已歷十信而登初住由此經十住十行十回向修菩薩行則為集福智資糧之菩薩今人每多稍具信行便爾心高氣傲不知尚未做到發菩提心之少分照起信論講入初發心住以前尚須十千大劫修習六度行乃成真正初發心菩薩然後再經三大無數劫方能成就無上遍正覺故本人為一欲學菩薩發真正菩提心而學修六度行者此經正是教凡夫人學發菩提心學修菩薩行者故深合本人之意趣四今講此經之所為因首都各界發起講經之機會本人選講優婆塞戒經亦自有其所為之意義今一言之甲為建立人間大乘佛教在佛法與人生之關係一條已詳説佛法與人生有深切之意義而推究佛法真正本旨凡所證所説均為大乘佛法故欲弘揚佛法應以人類世間為依據而弘揚大乘佛法又惟人生最需要大乘佛法所以應建立人間大乘佛教此經可為一切具善根之男人女人修成在家菩薩之規範如人皆依據此經去發心修行自利利他則人間大乘佛教即由此建立而此世界人類即可由此大乘佛教之利益而得享受和平安樂之幸福矣乙為提倡實踐修行學佛之人中有為專造成一宗一派之學者或為成一博學者因而努力研求然此雖亦佛法之所需而佛法之本旨原從修行成無上覺而證明諸法性相再由開示諸法性相而導他實踐修行期亦證明諸法性相而成無上正覺故佛所説法重在實行如由凡夫衆生而發心趣求菩提者即應從此優婆塞戒經而實踐修行如此經集會品辨菩薩性非本自有非依佛有乃由發心修行因緣而有尤為此經重行之特色今為提倡發心學佛人實踐修行故特選此經丙為從基本之戒學修起菩薩分為兩種一者出家二者在家出家人為數甚少在家人為數甚多此經係應在家之人而發揮學戒之需要故最能普及人類而於戒定慧三學應先修習戒學為基本所謂由戒生定依定發慧戒為定慧之基定生後戒即與之相應而成為定共戒慧發後戒即與慧相應而成為道共戒戒能生定者以戒具足後理得心安內心即常生歡喜安樂由安而定依定體驗觀察而發生智慧則為無漏聖智故佛法應從戒學之根本上修起丁為從普通之六度修去中國人多有豪邁不羈躐等之習性不屑從普通者平實做去又好專取一經之言或一宗之行標高立勝對他經他宗輒起水火是非之諍此經第十八六波羅密品講明應從菩薩普行通修之六度修去並引或者謂不必定有六度可合為四或通為一等言而斥破之蓋此雖為一即一切一切即一之圓融道理即一度可攝一切度一切度可入一度但根本上必先成立各各波羅密之獨殊相而後方能體會相攝相融之理故於六度均須普行通修方可由凡夫人歷菩薩位而成佛之平正大道五本經譯傳之略史此經之名優婆塞戒經已於優婆塞戒為中心之一段中説明其大概此外關於譯傳所應説明者分為三段説之甲曇無讖法師在北涼姑臧譯此説明本經翻譯之人及時與地者一切經皆釋尊所説由弟子結集而成當時或以文字紀録或用口語背誦皆用印度語文之巴利文或梵文等此經由梵文譯為漢文係由曇無讖法師在北涼朝之姑臧地方所譯北涼係在南朝劉宋文帝時代於現在甘肅地方所成立之一朝姑臧即今甘肅涼州為北涼之首都此經譯在北涼時代沮渠蒙遜玄始十三年至十五年或至承元元年之五六年間亦即劉宋文帝元嘉三年或元年至五年之間翻譯者為曇無讖曇無即法義讖即豐義合云法豐中印度即中天竺法豐法師通達經律論三藏故稱為三藏法師此經為法師到北涼後在姑臧所譯法豐法師在中國所譯除此經外尚有涅槃大集金光明經等而古譯之菩薩戒本經亦為法師所譯故師既為涅槃宗之初祖亦為中土傳弘菩薩戒之初祖與當時之求那跋摩功德鎧法師較略在前也法豐法師所譯之菩薩戒本與玄奘法師所譯之瑜伽菩薩戒本原本無異而譯文稍減故達磨迦羅此云法時為傳聲聞戒之首法豐法師為傳菩薩戒之首以此大師而譯此經可知此經係以大乘法及菩薩戒為結晶故所明優婆塞戒即是菩薩優婆塞戒行乙與此經類似各經之辨別類似此經者有中阿含經中優婆塞戒經為瞿曇僧伽提婆所譯但雖講五戒而仍為普通所行五戒又有優婆塞五戒相經為求那跋摩法師所譯乃佛因淨飯王所問而説亦為普通之五戒故皆與此經不同又有優婆塞五戒威儀經亦為求那跋摩所譯其實是瑜伽菩薩戒本之異譯與此經名稱相近又有優婆夷淨行法門經亦與此經不同係佛為最有名之優婆夷鹿母所説鹿母為大富婦施構竹林精舍以供養佛即於大乘優婆塞戒修行者優婆夷發心修大乘行亦可依此經也又此經係佛因善生之問而説然善生經有數譯本亦佛為善生長者子所説者一後漢安世高譯名佛説尸迦羅越此云善生六方禮經二西晉支法度譯名佛説善生子經三名善生經在中阿含第三十三四亦題善生經在長阿含中此四則與此經有關係然經文均甚少僅當此優婆塞戒經受戒品中之一部分如小乘有摩登伽女經而大乘則有楞嚴十卷其善生長者子問佛所説之一小部分經與此大乘部優婆塞戒經之關係亦然丙本經與優婆塞戒本有單行本題為優婆塞戒經受生品者即此經之受戒品內分六重二十八輕與梵網經之分為十重四十八輕瑜伽菩薩戒本之分為四重四十三輕者同可別行為常誦之戒本者釋經經題之優婆塞戒義前已言之其內容共有七卷分為二十八品品即品目凡文義相類則收為一品茲將二十八品經文依古德分為三分一敘啓分即集會一品二自發心品至般若品多分共二十七品皆為正説分又稱正宗分三結成分即最後兩行之文集會品第一甲一敘啓分乙一追敘嘉會如是我聞一時佛在舍衛國祇陀林中阿那邠坻精舍與大比丘僧千二百五十人五百比丘尼千優婆塞五百乞兒此為結集人追敘本經有説法者有聽法者及説聽之時與地謂之五重證信藉證此經之確實可信以流傳於永久佛弟子有阿難陀者義即慶喜在佛弟子中為多聞第一記持不忘佛滅後第一次結集經典時由五百弟子推舉阿難陀結集經藏優波離結集律藏大迦葉結集論藏此經為阿難陀所結集當結集時追敘有此嘉會如是我聞是敘親聞我字是結集者自稱如是含義甚深此中且指本經文義而言謂如此經義是我親從佛説得聞以證本經非道聽途説憑空杜撰者比是為親聞證信一時係敘説法之時所以不記明某年某月某日時者就廣遠義言天上人間年月日時長短不同就切近者言世界各國所用歷法亦互有差異不相統一故不能用某年某月某日時記之以便行於各地也復有事一時理一時之分所謂機教相扣説聽事畢謂之事一時依無分別智契無分別理理之與智無二無別謂之理一時是為説時證信佛係梵音具足應言佛陀或浮屠浮圖浮圖中國一般人每指塔而言其實塔為供佛舍利之所殆借名以代表佛耶古時文人又每以浮圖二字稱佛出家弟子實在出家人為學佛而尚未成就者不能徑稱之為佛或以出家人為佛弟子之上首代佛宣揚亦稱之為佛歟佛陀之本義為覺者覺為覺悟之覺與中國之聖字相似但佛法中阿羅漢辟支佛及地上菩薩亦可稱聖而佛則為聖中之聖覺者謂有覺悟之聖者譬如有學問之人稱為學者以有覺悟故稱之為覺者但此中覺者要無絲毫迷惑錯謬究竟圓滿者方可當之所以聖中阿羅漢乃至大菩薩尚不能謂為覺者要證得阿耨多羅三藐三菩提即無上正遍覺者方可稱為覺者正即正而不謬遍即遍而不偏大菩薩雖有正遍覺悟猶非無上故須福智兩足乃可稱佛佛本為通稱如東方藥師佛西方彌陀佛乃至十方諸佛皆可稱為佛但因此世界祇有釋迦牟尼佛教法化行故可單稱為佛別佛則須加別名於其上如藥師佛之類故此中佛字即指釋迦牟尼佛但十方諸佛福智均等其所證所説無有高下僅於應機設教上有各種方便之不同一佛説亦即等一切佛説耳此為説主證信舍衛國在中印度中印度非祇舍衛一國不過舍衛與摩竭陀等國較大耳舍衛為譯音其義為豐德謂豐富道德之國也祇陀林阿那邠坻精舍即是金剛經中所云祇樹給孤獨園祇陀簡稱為祇是舍衛國太子之名其義為戰勝因生在其父王戰勝時而命名阿那邠坻譯為善施即給孤獨長者以其常時給恤孤獨之人故稱為善施長者林為祇陀所有精舍為阿那邠坻所有故合謂為祇陀林阿那邠坻精舍此處原為祇陀太子之地阿那邠坻長者欲買此地以供養佛祇陀太子戲謂須黃金鋪滿其地方可長者供佛心切復饒有家産乃傾其所有金以鋪此地祇陀太子受其感動止其鋪金即以此地售與長者而留樹林以自供佛故謂之祇陀林長者得其園林構造最精美之房舍以供佛故謂之阿那邠坻精舍此中舍衛國為大地名譬如南京祇陀林阿那邠坻精舍為小地名譬如逸仙橋中國佛學會是為説處證信敘與大比丘僧比丘尼優婆塞乞兒者為同聞證信此中先敘比丘僧者出家五衆以比丘為首故比丘有人望文生義謂比於孔丘然比丘為譯音即乞士之義因出家之人不獨不事生産且將家財捨盡常行乞食以資生命現在錫蘭暹羅緬甸等地尚是如此又有乞法以資慧命之義乞法即求法謂從佛出家求學佛法以除煩惱了生死也比丘本義不過如此若引申之則有怖魔破惡等義蓋修學正法破除諸惡為天魔所恐怖也僧字多有錯用誤認之者或以僧為出家人之姓或以僧即是出家之人但僧為譯音具言應稱僧伽即衆也故僧即出家佛教徒之團體此團體係依戒律而住依比丘律而住者謂之比丘僧依比丘尼律而住者亦可謂之比丘尼僧僧即出家各類團體之通稱佛經中亦有譯為衆者比丘程度不齊有證聖度生者有破戒退墮者復有新學之人而此中比丘皆是證阿羅漢果發菩提心有大功德智慧者故謂之大比丘復是常隨從佛者其數有千二百五十人尼係譯音比丘尼即比丘之女性者其數有五百人比丘尼在佛徒中為晚起之事佛成道後約二三十年由佛之姨母求出家方有比丘尼又優婆塞之義前日雖曾略説今日聽衆中不乏新來者再約言之優婆塞為譯音又有譯為塢波索迦塢波塞迦或優蒲塞者義為近事能親近承事三寶故有處翻為善宿近宿清信中國習稱為居士其實佛典中居士稱通常之人若佛弟子應稱為優婆塞或優婆夷大概為受過五戒者所稱廣義則但歸依三寶者亦可稱為三歸優婆塞夷受五戒者稱為五戒優婆塞夷受八戒者稱為八戒優婆塞夷此中其總數有一千人乞兒乃普通之乞丐與前之比丘有乞食乞法之二義者不同其數有五百人此會僧俗男女貧福俱備全為人衆而無他道衆生亦此經特殊之一點可為本經正為人道而設之證此種集會追敘與現代之開會紀録相同如是我聞乃紀録人之自署也繼之有會時有主席有會地有會衆如此佛經證據確鑿無怪流傳至今永久可信也乙二問啓綱宗千優婆塞中有長者子名善生發問啓動佛説揭示此經之綱宗丙一本事問答丁一問禮六方爾時會中有長者子名曰善生白佛言世尊外道六師常演説法教衆生言若能晨朝敬禮六方則得增長命之與財何以故東方之土屬於帝釋有供養者釋提桓因則為護助南方之土屬閻羅王有供養者彼閻羅王則為護助西方之土屬婆婁那天有供養者彼婆婁那則為護助北方之土屬拘毗羅天有供養者彼拘毗羅則為護助下方之土屬於火天有供養者火則為護上方之土屬於風天有供養者風則為護世尊佛法之中頗有如是六方不耶長者為年高德劭饒有財譽人之尊稱善生年輕稱長者子在他經中言其父命終時囑令禮拜六方之事甚詳善生歸佛法後因再啓問六方之義因其有善根方生人中又能不空過此生增進為善故曰善生此時善生雖已歸佛然未詳問佛法故舉外道六師常説禮六方義以問凡非佛法即為外道據理所説所行與一切法實相相應則為內道反之則為外道在佛世外道有九十六種六師為其著名之代表涅槃經曾詳言之第一富蘭那迦葉富蘭那其字迦葉其姓立一切法斷滅性無君臣父子忠孝之道第二末伽梨拘賒梨此云不見道末伽梨其字拘賒梨其母名計衆生之苦樂非由因緣惟自然生第三刪闍夜毗羅胝子刪闍夜其字毗羅胝子其母名此云正勝不作計不須求道但經生死劫數自盡苦際如縷丸轉於高山縷盡自止第四阿耆多翅舍欽婆羅阿耆多翅舍其字欽波羅即粗衣也身著弊衣五熱炙身以苦行為道謂將長時之苦於短時受盡即得解脫第五迦那鳩陀迦旃延迦那鳩陀此云牛領其字也迦旃延此云剪髮姓也計諸法亦有相亦無相應物起見隨意而答謂之邪命外道第六尼犍陀若提子尼犍陀此云離繫為出家總名若提為母名計苦樂善福悉由前造非今生行道所能斷者即現在印度之耆那教徒衆甚夥以上六種外道均有徒衆亦教化衆生此中亦非六師皆如此説不過六師中有作如是言者耳增長命財如所謂添福添壽外道之人多隨順世俗之要求以圖其恭敬供養而在大乘佛法亦不僅修智慧尚欲兼修福德以增長財命為利他之資故東方之土土字訓為世界非泥土之土即天帝之領土能為天中之帝即為帝釋釋提桓因即是能天主之義閻羅王為地獄之主掌管地獄苦報衆生婆婁那即龍王名掌治水者水天之天可訓為神婆婁那天即水神拘比羅義為蛟乃夜叉神名非蛟龍之蛟火天即火神風天即風神禮彼天或神彼則為保護救助此外道禮六方之道理世尊為一切世界之所尊敬也譯音為薄伽梵丁二答修六度善男子我佛法中亦有六方所謂六波羅蜜東方即是檀波羅蜜何以故始初出者為出智慧光因緣故彼東方者屬衆生心若有衆生能供養彼檀波羅蜜則為增長壽命與財南方即是尸波羅蜜何以故尸波羅蜜名之為右若人供養亦得增長壽命與財西方即是羼提波羅蜜何以故彼西方者名之為後一切惡法棄於後故若有供養則得增長壽命與財北方即是毗梨耶波羅蜜何以故北方名號勝諸惡法若人供養則得增長壽命與財下方即是禪波羅蜜何以故能正觀察三惡道故若人供養亦得增長命之與財上方即是般若波羅蜜何以故上者即是無上無生故若有供養則得增長命之與財善男子是六方者屬衆生心非如外道六師所説佛答六方即六度所謂正人説邪法邪法皆成正佛即六方説為六度則外道轉成佛道矣波羅蜜係梵音義為度到彼岸凡事做到圓滿成功即謂之波羅蜜六度之義後當詳説此處祇約言之檀具言檀那義即布施先修布施可開智慧之光供養即修學之義尸具言尸羅義即持戒右訓為上為優能受戒修持則為上為優羼提義為忍辱後者能忍辱即是將惡法棄之在後毗梨耶義即精進北方能降伏惡法故號勝諸惡法禪即禪定具言禪那義為靜慮能靜觀善惡因果之義般若義即智慧乃無分別之真實智慧為善法中之最上者故云無上以無分別智契證真如無有生滅與般若心經所謂不生不滅不垢不淨不增不減之義相當故曰無生六度為衆生心中所行故曰屬衆生心非外道所説之六方神也外道有多神教有一神教佛法則證明一切皆屬衆生之心丙二決擇問答丁一辨能供養之菩薩性如是六方誰能供養善男子惟有菩薩乃能供養前已説如能供養六度則能敬禮六方依此義自應引起善生誰能供養如是六方之問善男子即稱呼善生佛即答言如是六方非菩薩不能供養菩薩有認作偶像之代名詞者凡木雕或泥塑金鑄神鬼之像皆呼之為菩薩實屬非是即以菩薩通稱一切神又或將神佛混而不分統稱菩薩亦不妥當蓋鬼神或為天道或為阿修羅道鬼道等不出六道輪回者至菩薩雖在人天中受生乃已發菩提心依其發菩提心之念即已超出三界二乘之上因此不能與未出三界鬼神並稱又有謂菩者普也薩者濟也菩薩為普濟之義者亦屬望文生義其實菩薩即菩提薩埵之略稱菩提即阿耨多羅三藐三菩提之略薩埵為有情衆生之義要之即發菩提心之有情人為有情之一類或近指發菩提心之人方可稱為菩薩故須發無上心堅固不可動搖者乃是菩薩菩薩乃能敬禮六方即能修行六度世尊以何義故名為菩薩佛言得菩提故名為菩薩菩提性故名為菩薩世尊若言得菩提已名為菩薩者若未供養彼六方時云何得名為菩薩耶若以性故名菩薩者誰有此性有此性者則能供養若無性者則不能供養是故如來不應説言彼六方者屬衆生心善男子非得菩提故名菩薩何以故得菩提者名之為佛未得菩提乃名菩薩亦非性故名菩薩也善男子一切衆生無菩提性如諸衆生無人天性師子虎狼狗犬等性現在世中和合衆善業因緣故得人天身和合不善業因緣故得師子等畜生之身菩薩亦爾和合衆善業因緣故發菩提心故名菩薩若有説言一切衆生有菩薩性者是義不然何以故若有性者則不應修善業因緣供養六方善男子若有性者則無初心及退轉心以無量善業因緣故發菩提心名菩薩性善生不明以何種義名為菩薩故而再問菩薩之義佛即答以得菩提故名為菩薩菩提性故名為菩薩得菩提是從果上講即究竟成就阿耨多羅三藐三菩提即是成佛菩提性是從因上講本來如此常常如此者謂之性本來則非從學得常則不變譬如有人性故名為人有男性故名為男有女性故名為女以有菩提性故則名為菩薩此兩句答又啓善生之疑故進而再問此一問甚為重要即本經特殊宗旨之所在善生問意若言已得菩提者方名為菩薩則未供養六方之前尚未得菩提即不得名為菩薩又何能供養六方故有矛盾若以有菩提性名為菩薩是否衆生皆有此性倘非皆有此性則無性者即不能供養以此推論彼六方者即非為衆生心又若非皆有此性則自己有無菩提性乃不可知從而不能決定能否供養六方豈不徒勞無益若言衆生皆有此性何以衆生不能供養六度若説有有性有無性又將無從知之以決定其能否供養是故不應説言彼六方者屬衆生心因已得菩提故則不必供養有菩提性故亦不可供養則佛説似不能成立所以善生大啓難問佛則答言非得菩提故為菩薩以得菩提者名之為佛故以在未得菩提之前方名菩薩故與前並無衝突前説得菩提故者重在其能得也又言非以性故名為菩薩性者指本有不變而言又言一切衆生本無菩提性譬如一切衆生無人天畜生等性以和合善惡因緣而得人天畜生等身以諸衆生能受衆多生死生生死死流轉六道都無一定之性若有一定之性則師子永遠為師子人天永遠為人天矣蓋由此生死流轉説無本有不變之性現在所得之人天師子虎狼等身即為善惡業因緣和合所得之果例如能修五戒則得人身能修十善不動業則得天身如行十不善業則得師子虎狼等身依此道理菩薩亦然以和合超出人天而包括人天等善業因緣又能發起誓得菩提之心所以名為菩薩菩薩所以為菩薩乃從此和合超出人天包括人天多數善行而得若説一切衆生有菩薩性者則不然本有不變謂之性以有本有不變之菩薩性則不必供養六方而能得菩提成佛故善男子若有性者下結成菩薩性非本有不變心蓋既屬本有則無初心既屬不變則無退轉以有初心及退轉心證明非一切衆生有菩薩性而為以無量善業因緣發菩提心名菩薩此上雖依經文加以説明在未曾研究其他經典者或能信解無疑若曾研究過其他經典者則反生難問矣蓋有一類經內曾言一切衆生皆有佛性有一類經內言衆生分為五種性有無性者即是無聲聞緣覺菩薩等涅槃性次有定性聲聞定性緣覺及大乘菩薩種性又有不定性者於聲聞緣覺三乘種性不定今此經言一切衆生皆無佛性與彼諸經如何會通雖佛法為一貫之理但説經造論各有特重之點特重之點分境果行三種説之境即宇宙萬有諸法性相從宇宙一切法平等真如性言離言説絶思慮一切衆生均屬平等無二無別則衆生皆有佛性即無情之一草一木山河大地亦皆同此佛性此從境法之性明皆有佛性者若從境法之相上言宇宙萬有各有其因如草木之種子各各不同則有情衆生亦各有本識中一切種之功能差別由此法相境以觀察即有無性三乘性不定性之分也有經論從果上談又有不同如涅槃經言一切衆生皆有佛性蓋從果上觀一切法一切衆生皆佛之法身故皆有以佛為性之義然法華經彰佛果教之力可明一切衆生皆無佛性故曰佛種從緣起是故説一乘以一切法從衆緣生衆生初非有佛性須有已成佛者大悲教化之殊勝增上緣乃可令其生起佛性即頓起佛性先起聲聞緣覺之性後被佛化回發大心起佛之性此皆依佛之教化為因緣而生起初皆無性此法華依菩提果之説也此經特重在行已説如前以重行故故以能發心修行者為有菩薩性譬如發羅剎之心行羅剎之行即有羅剎之性發人天之心行人天之行即有人天之性皆以發心修行為準此經以特重在行所以能發人天之心修行五戒十善為有人天之性以發菩提之心修菩薩之行則有菩薩之性若能修集無量無漏業三大劫滿則能成佛此顯本經重行之宗旨所在故菩薩性既不是已得菩提者又不是本有不變者須發菩提心修菩薩行者方有此性方名菩薩然此經與法華所説之義雖屬相近唯法華是從佛果菩提為緣起一面説故重在果此經則從衆生發菩提心修菩薩行一面説故重在行但其理則相通無滯此是辨明能供養六方六度之菩薩性明有此菩薩性者則名為菩薩丁二辨明所發生之菩提心戊一明十種能發因善男子有諸衆生受行外道不樂外典顛倒説故發菩提心或有衆生住寂靜處內善因緣發菩提心或有衆生觀生死過發菩提心或有衆生見惡聞惡發菩提心或有衆生深知自身貪欲瞋恚愚癡慳嫉為呵責故發菩提心或有衆生見諸外道五通神仙發菩提心或有衆生欲知世間有邊無邊故發菩提心或有衆生見聞如來不思議故發菩提心或有衆生生憐愍故發菩提心或有衆生愛衆生故發菩提心菩提心之能發因有十種一捨棄外道由捨邪説而歸投正法者此種人現時最多如由同善社道院乩壇等信從鬼神教者以從理論上研究其説難得成立所説多與事實不符乃捨卻不符事實之邪教邪師發心歸佛正知正見以修學也二為內因善根所啓發以先有善根故三觀生死流轉六道往返時生時死無間息時見生死有無限之過失而發起菩提心故四有衆生見惡聞惡引起悲愍心欲救拔衆生苦惱而發菩提心故五有人體會慳是貪之一分嫉為瞋之一分此為覺自己與衆生皆須闡明煩惱之根本故發心對治六五通即天眼天耳他心宿命神境通佛菩薩則更有漏盡通合之則為六通但佛菩薩雖有六通非有度衆生之必要則不常顯現外道特重在神通專以眩耀人心此為羡慕神通以為降伏外道乃發菩提心故七為求知欲所驅使現在講科哲學亦類是如欲知世界有始無始有終無終有中無中有邊無邊等為徹底了知個中道理故發求無上覺之菩提心八為羡慕佛道故因佛有十號以觀佛有最尊最勝之不思議事自己亦欲成就佛事故九即衆生有苦而欲救濟起憐愍心認為非發菩提心則不能成辦十欲成就其所親愛而發心觀衆生如父母兄弟妻子親愛之極故發心普度戊二示三種所發心善男子菩提之心凡有三種謂下中上若言衆生定有性者云何説言有三種耶衆生下心能作中心中心作上上心作中中心作下衆生勤修無量善法故能增上不勤修故便退為下若善修進則名不退若不修進名之為退一切時中常為一切無邊衆生修集善故名不退轉若不如是是名退轉如是菩薩則有退心及恐怖心若一切時中為一切衆生修集善法得不退轉是故我記是人決定不久當得阿耨多羅三藐三菩提此明三種所發之菩提心所謂下心能作上中心中心能作上心上心能作中心中心能作下心此之下上上下即增進退轉之意下心即是聲聞心中心即是辟支佛心上心即是菩薩心有先發菩提心後退發聲聞緣覺心者亦有先發聲聞緣覺心後發菩提心者是上中下變動不定以勤故上進不勤故不進且不進則為退進為不退要於一切時中常為一切無邊衆生修集故方名不退倘有一念之退心及恐怖心即為退若不退轉則佛定可授記記其經若干時即可成佛戊三辨發心無定性善男子三種菩提無有定性若有定性已發聲聞緣覺心者則不能發菩提之心善男子譬如衆僧無有定性是三種性亦復如是若有説言定有性者是名外道何以故諸外道等無因果故如自在天非因非果此發明菩提心無有定性僧衆和合無有定性如僧衆原為五六人今日離去一二人明日又來二三人分子不定時有變動以喻三種菩提變動如是若説有定性者即是外道之見以佛説諸法因緣生所謂諸法皆空亦是明因緣變化之無定性外道有自在天者與耶教之創造主宰體用相同謂為本有不變即為非因非果因是能變者如穀種生穀則因已變果自在天既常不變則為非因非果然佛法中之平等真如雖亦非因果但不於因果外有其存在不過遍於一切因緣生果諸法中之理性自在外道乃於因果之外有其本有不變之存在故為外道丁三辨菩薩性之因緣生善男子或有人説菩薩之性譬如石中定有金性以巧方便因緣發故得為金用菩薩之性亦如是者是梵志説何以故梵志等常言尼拘陀子有尼拘陀樹眼有火石是故梵志無因無果因即是果果即是因尼拘陀子具足而有尼拘陀樹當知即是梵志因果是義不然何以故因細果粗故若言眼中定有火者眼則被燒眼若被燒云何能見眼中有石石則遮眼眼若有遮復云何見善男子如梵志説有即是有無即永無無則不生有不應滅若言石中有金性者金不説性性不説金善男子因緣故則有和合緣和合故本無後有如梵志言無即永無是義云何金合水銀金則滅壞若言有不應滅是義云何若説衆生有菩薩性是名外道不名佛道善男子譬如和合石因緣故而有金用菩薩之性亦復如是衆生有思名為欲心以如是欲善業因緣發菩提心是則名為菩薩性也善男子譬如衆生先無菩提後乃方有性亦如是先無後有是故不可説言定有此處再辨因緣生石中有金性是梵志所説即因中有果説尼拘陀樹即菩提樹此樹甚大略與廣東榕樹相似此樹之子甚小小子內有大樹亦即因中有果人眼患病或覺燒疼或覺有星障彼謂眼中本有火與石燒即是火障即是石亦即因中有果若謂好眼已有火石尼拘陀子已有尼拘陀樹所以因即是果此與事實相違子小樹大是因細果粗如何子即是樹又若眼好時即有火者何以眼不被燒眼好時即有石者何以眼不被遮彼執有定性故説有即永有無即永無此近數論派所説如此則無生滅無生則與因緣和合本無後有之事實相違無滅則與金合水銀金即滅壞之事實相違且既已有金則不必説性既説是性不能説即是金如礦石不能作金用以非金故梵志之説與理相背是故若説衆生定有菩薩性者則為外道以有善業因緣和合始有菩薩性故欲心即願欲之心發菩提心即發菩提之願欲即志願得菩提之心以此即名為菩薩心故不可謂衆生定有菩薩性要成佛方得名菩提要發心方名有菩薩性雖無有決定性若一發欲得菩提之心則無論男女長幼即皆為有菩提心之菩薩丙三揭示綱宗丁一彰一切菩薩之義類善男子求大智慧故名菩薩欲知一切法真實故大莊嚴故心堅固故多度衆生故不惜身命故是名菩薩修行大乘善男子菩薩有二種一者退轉二者不退已修三十二相業者名不退轉若未能修是名退轉復有二種一者出家二者在家出家菩薩奉持八重具足清淨是名不退在家菩薩奉持六重具足清淨亦名不退大智慧即大覺亦即佛智由覺慧相應而得之一切智一切種智自然智廣大普遍之覺慧欲求如此智者為菩薩此總明菩薩之義次別明菩薩之義為五一欲知宇宙一切法之究竟真實此亦求智之動機何故求智此為發菩提心品之綱領大概世人求學問事業都不外乎求安樂免苦惱及求知識得智慧之二種世人一切欲望不外此二此中對宇宙萬有法界諸法之求知即最高無上之求知欲因此可成一切智故如法華經言諸法實相唯佛與佛乃能究盡了知二大莊嚴為此後自他莊嚴二莊嚴品之綱領即福智兩足尊之謂三心堅固以志向絶對住持趣向發心修行不免遭遇困難要心志堅固才能勝彼私欲欲堅固則須受戒所以有受戒品文四多度衆生為六波羅蜜品三十二相業品之綱領種種菩薩皆為度生五不惜身命菩薩為度生而受身衆生為煩惱牽引而受身菩薩為度衆生入生死海具足福智莊嚴施捨資財既為度生受身則如手足頭目等皆可施捨無慳惜心命即命根亦皆可為度生而施捨蓋菩薩真能照見五蘊皆空即人我已盡得生忍智依摩訶般若而度生以身命與資財及無畏等無差異上來明為求智慧等而發心既發心更須修行是為菩薩定義要具五義方為菩薩菩薩大乘如車中之火車能載多數人至目的地此下明菩薩之種類二種菩薩以退不退分在真發心以前不名有退無退既發心已於十信中六信名信不退初住名發心不退此要圓具十信才到發心不退第七住為位不退修菩薩行至第七住方不退故發心在因中修行於第六住尚有退轉到初地方證真理證真能不退故名為證不退第八地則為念不退以其念念任運增進真智現前故七地以前則尚起俱生煩惱有説到三劫行滿方修三十二相或説從初發心住已修三十二相業即是初住至三十二相業下面專有一品説明前明退不退二種下明出家在家二種即以持戒堅固與否明退不退足證此經重在戒行此中八重六重為輕重之重其重者犯則不可悔犯則失戒體可悔則輕比丘戒四重瑜伽菩薩戒亦四重八重即以比丘四重殺盜淫妄與菩薩四重自讚毀他慳不施法瞋不受悔説相似法合為出家八重以此八重完全修持無犯可名不退在家六重此經受戒品所明之六重二十八輕即在家菩薩之戒至下受戒品時詳言之亦要完全不犯方為不退足見此經重持戒以示宗旨之所在丁二顯在家菩薩之殊勝善男子外道斷欲所得福德勝於欲界一切衆生所有福德須陀洹人勝於一切外道異見斯陀含人勝於一切須陀洹果阿那含人勝於一切斯陀含果阿羅漢人勝於一切阿那含果辟支佛人勝於一切阿羅漢果在家之人發菩提心勝於一切辟支佛果出家之人發菩提心此不為難在家之人發菩提心是乃名為不可思議何以故在家之人多惡因緣所纏繞故在家之人發菩提心時從四天王乃至阿迦尼吒諸天皆大驚喜作如是言我今已得人天之師此以比較而顯殊勝善男子以下皆以比例而説外道亦能修世間四禪八定能斷五欲能超欲界諸天須陀洹即小乘聲聞初果由聞佛所説法修行解脫聲聞四果此為第一義為預流即初入聖人之流類已勝一切外道超過非想非非想天證人空無我見見所斷惑皆已斷竟非真實見為異見斯陀含人為聲聞第二果義為一來謂於人間一往來也阿那含為聲聞第三果義為不還即生色界五不還天不還人間即可證阿羅漢果阿羅漢依法華有十九種義根本義為無生辟支佛人義為獨覺或緣覺以從十二因緣得覺謂之緣覺以不聞佛説法而自覺又謂之獨覺其智慧超過阿羅漢果上來不專講在家此下特講在家在家人若能真發菩提心不僅勝過外道乃至辟支佛均超過之就此可見發菩提心之尊貴不要自貶去供養外道鬼神從前有一羅漢以他心通見跟隨背後負著包袱之小沙彌忽發菩提心羅漢應時知其發心即將包袱取來自負讓沙彌前行沙彌忽想起菩薩行之難行有退心羅漢即將包袱交還仍令沙彌背負後隨沙彌問何緣如此羅漢為説發菩提心即超越阿羅漢一有退轉即不及阿羅漢出家之人以下言在家發心之難出家人捨離五欲無惡緣纏繞清淨易進在家之人於五欲之中能發菩提心真不可思議以其有許多惡濁因緣故四天王天為第一天阿迦尼吒天是色究竟天共有二十四天皆生驚異歡喜以其於惡因緣中能發菩提心當為人天師表即與佛無異故由持戒清淨宗旨在重行尤重在家菩薩行故特在此品顯其殊勝故可謂在家菩薩經已顯全經綱宗以下各品於綱宗內詳明其義而已甲二正説分乙一明能行六度之菩薩丙一廣説修成菩薩之行丁一策發心願戊一策發總心己一明發心相現講發菩提心品即明發心義相發菩提心此心上已説明發求菩提或求佛果之願欲對佛果起求得之心可謂發願欲心或誓願心即對菩提願欲之心到初住成勝解由十住到十回向欲勝解念具足到四加行得定入初地得無漏智方是真正菩薩其初發心之實質即願欲發菩提心品第二庚一善生問善生言世尊衆生云何發菩提心云何即為何因何以何方法之意發起以下第二段世尊之所説庚二世尊説辛一分別廣説壬一信解發菩提心善男子為二事故發菩提心一者增長壽命二者增長財物復有二事一者為不斷絶菩薩種姓二者為斷衆生罪苦煩惱復有二事一者自觀無量世中受大苦惱不得利益二者雖有無量恆沙諸佛悉皆不能度脫我身我當自度復有二事一者作諸善業二者作已不失復有二事一者為勝一切人天果報二者為勝一切二乘果報復有二事一者為求菩提道受大苦惱二者為得無量大利益事復有二事一者過去未來恆沙諸佛皆如我身二者深觀菩提是可得法是故發心復有二事一者觀六住人雖有轉心猶勝一切聲聞緣覺二者勤心求索無上果故復有二事一者欲令一切衆生悉得解脫二者欲令衆生解脫勝於外道等所得果報復有二事一者不捨一切衆生二者捨離一切煩惱復有二事一者為斷衆生現在苦惱二者為遮衆生未來苦惱復有二事一者為斷智慧障礙二者為斷衆生身障信解發菩提心有十二種二事凡此皆是最初外凡發心未到十信位是由外凡進入十信位之發心先説之二事就平常人説即長命富貴多福多壽雖是平常人所求然亦至佛乃為具足福壽者又二一為不斷絶菩薩行二為斷衆生種種罪苦煩惱又二一以三世因果已明認為造業受苦而不得利二以無量恆沙諸佛皆不能度脫己身又二為濟世利人廣作善業但人由求知求經驗至能作善忽已衰老而死故常作已而失發菩提心乃不失之又二勝一切義如前已説又二一為不惜受大苦惱若不立堅固志願不成二為得無限量利益一切世界之利益得已易失惟發心後不失又二一過去未來諸佛未發心修行時亦與我同二如不可得即是妄想既為可得當立志求之又二一七住不退六住以前有退轉猶勝緣覺二發心勤求亦須立願又二欲令衆生解脫勝於外道解脫亦須立願又二菩薩以大悲度一切衆生衆生無盡故須不捨自斷煩惱方能度他又二為遮衆生現在未來苦惱故須立願以衆生無知菩薩能以智悲斷遮之又二智慧障礙即所知障佛智被無明無知所障衆生身報障由煩惱業所招故即煩惱障欲斷此二故發菩提願壬二修習發菩提心善男子發菩提心有五事一者親近善友二者斷瞋恚心三者隨師教誨四者生憐愍心五者勤修精進復有五事一者不見他過二者雖見他過而心不悔三者得善法已不生憍慢四者見他善業不生妒心五者觀諸衆生如一子想此即以修習兩種五事發菩提心此由學習發心為十信位菩薩為要長成菩薩心故須修一親近善友佛菩薩等皆是善友二斷瞋恚心三順師教誨四對衆生生憐愍心五勤修精進又有五事一觀他人須從好處看不觀其過二菩薩雖方便為人而難使離過仍不厭悔三發心修行若得善法或好境界或得禪定清淨或得好稱譽等若生憍慢則如好食中放毒藥成為有漏之善四一生嫉心則成有漏五有二子或生偏心若只一子決無異心前來猶非真實發心不過由信解以修習發心而已壬三真正發菩提心善男子有智之人發菩提心已即能破壞惡業等果如須彌山有智之人為三事故發菩提心一者見惡世中五濁衆生二者見於如來有不可思議神通道力三者聞佛如來八種妙聲復有二事一者了了自知己身有苦二者知衆生苦如已受苦為斷彼苦如己無異此以三事二事説有勝解之智者其發心乃為真發心即能破惡如須彌山須彌山即妙高山此界最高之山也有智之人以三事故發心一以大悲心觀衆生在劫濁見濁煩惱濁衆生濁命濁之五濁中欲為救度然非有無上菩提不可此一為下度衆生二見佛神力欲得佛果事三聞佛法音故欲成佛此二為上求佛道八梵音一轉好二柔轉三和適四尊慧五不妄六深造七不誤八不竭此三為內由悲智外藉教法之勝緣以發心也又二了了自知知最深切苦即聲聞苦諦所謂三苦八苦此一是三乘共法二即大乘不共法以有同體大悲心故第一句通發三乘心第二句惟發大乘菩提心辛二揭示正宗善男子若有人能發菩提心當知是人能禮六方增長命財不如外道之所宣説若能發心即成菩薩即能增長命之與財亦即增長功德法財可度衆生可成佛道即揭示正宗之別於外道悲品第三先明大悲生因即悲品後明解脫了因即解脫品己二辨發心因庚一大悲生因辛一問答發因壬一通問發因善生言世尊彼六師等不説因果如來所説因有二種一者生因二者了因如佛初説發菩提心為是生因是了因耶悲即慈悲之悲悲天憫人之悲亦即哀憐之心是為悲義須依一切衆生所發又須了知衆生性空方謂大悲非僅對自己親愛者所起悲痛之謂但悲有淺深不到佛果則悲起皆待緣一到佛果則悲不必由緣而起即是同體無緣大悲在此品中明應如何發起悲心進而起菩提心發即是發見或發生發見在科學上亦謂發明不過發生是生因發見是了因此段文即通問發因此文即善生問佛義六師在前第一品已講過外道因果不得成立雖説因果等於不説即六師説因果之理不能通達如來亦即佛陀尊稱之一生因即能産果者了因即明了因如屋內電燈之光一照則室內各物皆現室內各物並非燈光所生不過因光發現而已前兩品皆言發菩提心究竟發心之發是發生抑發見耶壬二廣答因義癸一泛説多種因相善男子我為衆生或説一因或説二因或説三因或説四因或説五因或説六七至十二因言一因者即生因也言二因者生因了因言三因者煩惱業器言四因者所為四大言五因者未來五支言六因者如契經中所説六因言七因者如法華説言八因者現在八支言九因者如大城經説言十因者如為摩男優婆塞説十一因者如智印説十二因者如十二因緣善男子一切有漏法無量無邊因一切無漏法無量無邊因有智之人欲盡知故發菩提心是故如來名一切智善男子者呼善生而答之也十二因以上有説十五依處二十四因乃至無量因者十二因就是普通所講十二因緣也一因為生因之因因所生者為果能生果者為因二因在涅槃經中常説為生因了因三因者煩惱與業為內因器即器世界為外因有根生為正報此中正指為因之業報四因為四大即地水火風亦即內身外器皆地水火風所成又通常四緣即因緣等無間緣所緣緣及增上緣亦為四因五因未來五支即十二因緣中之愛取有生老死六因為衆多契經所説梵文修多羅修妒路華語契經為衆經之通名因佛説法契理契機故具言契經不契理則不能切合真理不契機則不能化度衆生六因在大小乘論皆説之一能作因二俱有因三同類因四相應因五遍行因六異熟因七因者法華經並無明白説七因之文不過在方便品內有十如是除後二果報及本末其前即為七因八因者即十二因緣中現在八支所謂識名色六入觸受愛取有九因者出大城喻經十因者摩男優婆塞為佛之弟即須承王位欲出家未能者此二經待考大乘論中有明十種因者即一隨説因二觀待因三牽引因四生起因五攝受因六引發因七定異因八同事因九相違因十不相違因前六因俱舍論詳説之十因瑜伽師地論論之亦詳十一因者在漢文智印經不可考但説有七因發菩提心一如佛菩薩發菩提心二正法將滅為護持故發菩提心三見諸衆生衆苦所逼起大悲念發菩提心四菩薩教餘衆生發菩提心五布施發心六因他發菩提心而發心七見如來相好莊嚴與聞佛教而發心或漢譯簡略故十二因即十二因緣所謂無明緣行行緣識識緣名色名色緣六入六入緣觸觸緣受受緣愛愛緣取取緣有有緣生生緣老死以其展轉為因故名為十二因有漏如壺漏則茶盡屋漏則水滴無漏之法分別説其因則為數無量無邊如説六波羅蜜八萬四千波羅蜜無量數波羅蜜有漏之法亦然有智之人為欲盡知有無漏一切因故發菩提心佛以悉知一切法無量無邊因故稱為一切智者癸二正辨悲是生因善男子一切衆生發菩提心或有生因或有了因或有生因了因汝今當知夫生因者即是大悲因是悲故便能發心是故悲心為生因也發菩提心或有生因或有了因或有生因了因生因者即是大悲無上菩提心非有大悲則不能發不欲了脫生死亦不能發菩提心然小乘雖欲了脫生死但無大悲亦不能謂為發無上菩提之心故修發菩提心要從大悲修起如穀播種無種則穀不生發菩提心亦然無大悲則菩提心不生辛二問答修悲壬一善生問修悲法世尊云何而得修於悲心此即善生問如何而得修悲壬二如來説修悲相癸一三十六因明生悲善男子智者深見一切衆生沈沒生死苦惱大海為欲拔濟是故生悲又見衆生未有十力四無所畏大悲三念我當云何令彼具足是故生悲又見衆生雖多怨毒亦作親想是故生悲又見衆生迷於正路無有示導是故生悲又見衆生臥五欲泥而不能出猶故放逸是故生悲又見衆生常為財物妻子纏縛不能捨離是故生悲又見衆生以色命故而生憍慢是故生悲又見衆生為惡知識之所誑惑故生親想如六師等是故生悲又見衆生墮生有界受諸苦惱猶故樂著是故生悲又見衆生造身口意不善惡業多受苦果猶故樂著是故生悲又見衆生渴求五欲如渴飲鹹水是故生悲又見衆生雖欲求樂不造樂因雖不樂苦喜造苦因欲受天樂不具足戒是故生悲又見衆生於無我我所生我我所想是故生悲又見衆生無定有性流轉五有是故生悲又見衆生畏生老死而更造作生老死業是故生悲又見衆生受身心苦而更造業是故生悲又見衆生愛別離苦而不斷愛是故生悲又見衆生處無明暗不知熾然智慧燈明是故生悲又見衆生為煩惱火之所燒然而不能求三昧定水是故生悲又見衆生為五欲樂造無量惡是故生悲又見衆生知五欲苦求之不息譬如飢者食於毒飯是故生悲又見衆生處在惡世遭值虐王多受苦惱猶故放逸是故生悲又見衆生流轉八苦不知斷除如是苦因是故生悲又見衆生飢渴寒熱不得自在是故生悲又見衆生毀犯禁戒當受地獄餓鬼畜生是故生悲又見衆生色力壽命安隱辨才不得自在是故生悲又見衆生諸根不具是故生悲又見衆生生於邊地不修善法是故生悲又見衆生處飢饉世身體羸瘦互相劫奪是故生悲又見衆生處刀兵劫更相殘害惡心增盛當受無量苦報之果是故生悲又見衆生值佛出世聞説甘露淨法不能受持是故生悲又見衆生信邪惡友終不追從善知識教是故生悲又見衆生多有財寶不能捨施是故生悲又見衆生耕田種作商賈販賣一切皆苦是故生悲又見衆生父母兄弟妻子奴婢眷屬宗室不相愛念是故生悲善男子有智之人應觀非想非非想處所有定樂如地獄苦一切衆生等共有之是故生悲此即佛以三十六因明生悲若佛大悲須了衆生性空三十六因者一深見衆生沉沒苦海欲拔救故二見衆生無十力四無所畏大悲之三念欲彼具足故廣説還有十八不共法三十二相八十種好等亦是見賢思齊之意三即怨親平等無分別故四見衆生無有開示指導欲示導故五見諸衆生沈耽五欲即財色名食睡而又放逸欲救濟故六見衆生等為財物所束縛而造惡欲令捨離故七見衆生以色力健美壽命延長而生驕慢欲令悔改故八惡知識即惡友誑惑即故意顛倒是非偽似親愛如六師外道欲令衆生遠離故九苦略有三即苦苦行苦壞苦欲令衆生知苦斷苦故十身三殺盜淫口四妄言綺語兩舌惡口意三貪瞋癡之十惡欲令斷絶故十一渴求財色名食睡之五欲愈求愈苦欲令悔改故十二不樂苦而反造苦因欲求樂而不造樂因欲令離此倒行故十三我所即我所有所有即法律上所有權義非但我所有空四大皆空五蘊非有何處去覓我衆生不知欲令知故十四有有三有五有二十五有等之別五有即五道謂人天地獄餓鬼畜生之五趣欲令超出此流轉故十五畏而又造愚而不知欲令知故十六多有因身心疾病等而更造殺生業者欲令悔改故十七斷別離苦先得斷愛欲令斷故十八除無明黑暗須要智慧光明欲令熾然光明故十九除卻煩惱火須用三昧水三昧即定所謂心靜自然涼欲令得此故二十五欲本非樂欲令勿以此造惡故草一又有明知五欲之苦而仍求之不息欲令心息故草二遇暴王不知求避而放逸欲令悔改故草三八苦即生老病死求不得怨憎會愛別離五陰熾盛欲令斷除故草四飢渴寒熱欲令自在故草五衆生不自見毀戒得苦報欲令悔改故草六色力即健康壽命即命根長久安樂均不能自在者欲令自在故草七諸根不具為惡業所感欲自悔改故草八邊地即無佛法教化之地欲令得佛法教化故草九如現世互相搶奪之匪皆因飢饉羸瘦欲令免除故三十世界大戰更相殘害當受無量之苦欲令免除故在此時如各國人皆想弭戰爭求和平即可從此生悲發心而實現和平卅一雖聞佛説法每不能受持欲令其改變故卅二從邪棄正必受大苦欲令反其道故卅三有寶不施由此造惡欲令悔改故卅四農工商苦欲令解除故卅五不相愛亦惡業所感欲令改悔故卅六總言一句三界皆苦而生非想非非想天壽命經八萬大劫然以佛法觀之將來還有墮落地獄之苦以在輪回中故一切衆生亦莫不然前三十五為分別言之此第三十六為總括説也因見衆生有此種種之苦所以生悲癸二別以四因明大悲善男子未得道時作如是觀是名為悲若得道已即名大悲何以故未得道時雖作是觀觀皆有邊衆生亦爾既得道已觀及衆生皆悉無邊是故得名為大悲也未得道時悲心動轉是故名悲既得道已無有動轉故名大悲未得道時未能救濟諸衆生故故名為悲既得道已能大救濟故名大悲未得道時不共慧行是故名悲既得道已與慧共行故名大悲要證生空即人我空或生法人我法我空之智如聲聞須陀洹果以上或辟支佛以及初地菩薩方謂之得道若就廣義言初住發菩提心之勝解行地亦可謂得道得道之後法法無邊以得生法空其智無邊故觀衆生亦無邊故名大悲又生法空智一切平等雖與衆生種種苦相應而智不動常常如此故名大悲未得道時則否故只名悲又從功用上講以普救與否及與慧共行與否為悲與大悲分別之標準此以四種相顯明大悲壬一結示修悲利益癸一總明修悲菩薩益善男子智者修悲雖未能斷衆生苦惱已有無量大利益事善男子六波羅蜜皆以悲心而作生因與衆生相親相愛而無怨對故有無量利益癸二別顯在家菩薩益善男子菩薩有二種一者出家二者在家出家修悲是不為難在家修悲是乃為難何以故在家之人多有惡因緣故善男子在家之人若不修悲則不能得優婆塞戒若修悲已即便獲得善男子出家之人唯能具足五波羅蜜不能具足檀波羅蜜在家之人則能具足何以故一切時中一切施故是故在家應先修悲若修悲已當知是人能具戒忍進定智慧若修悲心難施能施難忍能忍難作能作以是義故一切善法悲為根本在家之人為一身一家之計以惡緣多故不易修悲但得優婆塞戒與否必以能修悲與否為斷即以修悲為戒體故真能發心之在家人多能樂善好施出家之人以法施為多而難行財施在家之人兩施俱能具足然行施先應修悲所謂慈悲為本方便為門故在家菩薩應注意修悲非然者則貪瞋易起而動輒作惡矣大乘智慧無悲則不能起無悲之智不過口頭上書本上之智慧而已離開口頭書本則無智慧癸三結成修悲廣大益善男子若人能修如是悲心當知是人能壞惡業如須彌山不久當得阿耨多羅三藐三菩提是人所作少許善業所獲果報如須彌山悲心如火惡業如薪有火可燒薪盡有悲可滅惡盡故不久可成正覺解脫品第四庚二解脫了因解脫即是涅槃大涅槃經説三德解脫其一也從果上説三乘之果皆名解脫又有經説三解脫門謂空無相無願又有八解脫定即依修八種定而得名又華嚴經善財童子參五十三善知識各言得一解脫門亦有以勝解名解脫者此中解脫品之解脫亦指三乘勝解及依勝解所成定慧即能得解脫之門名解脫故屬了因辛一承前起説善男子若善男子善女人有修悲者當知是人得一法體謂解脫分此即佛承前悲品文起説也若有善根之男子女人能修悲心者能得一種法體即從身口意修悲所得解脫分分者支分義又因分義此解脫在真見道謂無漏智在真見道前為加行慧及勝解慧對解脫果名解脫分若能照悲品修悲則可得此解脫分辛二問答推明壬一問得體義善生言世尊所言體者云何為體善男子謂身口意是身口意從方便得方便有二一者耳聞二者思惟復有三種一者惠施二者持戒三者多聞善生問佛所言體者以何種法為體佛答以身口意修三十二相品中明業體亦即以身口意業為體此解脫分法體之身口意從方便得方便有處是指善巧權巧亦多有指預備工夫者與工欲善其事必先利其器之利器義同此中亦指預備工夫解脫分法體如因受戒作羯磨受戒作法而得戒體此中解脫分法體從身口意得亦復如是聞即聞慧思即思慧此中之體由聞所成即聞慧由思所成即思慧又有由修所成者為修慧要得解脫法體須有聞思之慧又分三種者謂施戒多聞惠施有三見有苦而施為大悲施為報恩而供養為報恩施供養有德者如供佛菩薩及師長三寶為尊敬施此三皆能生解脫之慧又因持戒可生解脫之慧多聞佛教經典尤可得生解脫之慧此中智慧謂之了因以此種種智慧了知佛法衆生法而為發起菩提心之因故壬二問方便得癸一辨得不得善生言世尊如佛所説從三方便得解脫分是三方便有定數不不也善男子何以故有人雖於無量世中以無量財施無量人亦不能得解脫分法有人於一時中以一把麨施一乞兒能得如是解脫分法有人乃於無量佛所受持禁戒亦不能得解脫分法有人一日一夜受持八戒而能獲得解脫分法有人於無量世無量佛所受持讀誦十二部經亦不能得解脫分法有人唯讀一四句偈而能獲得解脫分法何以故一切衆生心不同故善男子若人不能一心觀察生死過咎涅槃安樂如是之人雖復惠施持戒多聞終不能得解脫分法若能厭患生死過咎深見涅槃功德安樂如是之人雖復少施少戒少聞即能獲得解脫分法善生問具足幾多惠施持戒多聞即能得此解脫分之法體佛答不必定數或有以多施而不能得者或有以少施而能得者一把麨即一團之麵食八戒即八關齋戒一不殺二不盜三不淫四不妄語五不飲酒六身不塗飾香鬘七不坐高廣大床八不歌舞觀聽是為八戒不過午食是為一齋又有以多持戒而不得以少持戒而得者又有以無量多聞而不得以持一四句偈而得者十二部即十二部分十二部類之義十二部者一契經二重頌三諷誦四因緣五本事六本生七未曾有八譬喻九論議十自説十一方廣十二授記有説小乘只有九部大乘為十二部者有説小乘為十一部大乘加方廣為十二部以説大小乘皆具十二部者為善偈即伽陀或四字一句或五字七字一句每句字數均整以四句為一偈得解脫分與否不以多少為準而以用心不同為分別有僅以修人天福報用心者有以求解脫生死用心者求人天福者雖多施多戒多聞亦不得解脫分求了生死者雖少聞少施少戒亦得解脫分解脫分即能得涅槃之因涅槃者即真解脫果知生死過患欲解脫知涅槃安樂而趣求故得解脫分也涅槃有翻為滅或滅度或寂滅或圓寂者以一切功德圓滿一切過患寂滅為義三界之中六道皆無此安樂惟解脫生死才有此安樂所以平常修心之人以存心為最要一切功德如回向人天福報即不得解脫分如回向無上菩提即得解脫分即念佛坐禪人雖已得定若不回向菩提未發真無漏慧亦不過得世間四禪四定而已癸二得解脫時善男子得是法者於三時中佛出世時緣覺出時若無是二阿迦尼吒天説解脫時是人聞已得解脫分善男子我於往昔初發心時都不見佛及辟支佛聞淨居天説解脫法我時聞已即便發心此佛言得解脫之時凡佛住世及佛法流行尚有經典存在於世時即為佛出世時無佛經教時即緣覺出時緣覺雖不度生而其神通威儀亦可起人信仰而發出世之心阿迦尼吒天即五不還天之色究竟天皆證聲聞三果或位登大菩薩者生在其中淨居天為五不還天別名即釋尊在作悉達太子時出城所遇沙門為説解脫法亦即淨居天所化此即以本生事來證明者癸三得解脫人善男子如是之法非欲界天之所能得何以故以放逸故亦非色天之所能得何以故無三方便故亦非無色天之所能得何以故無身口故是法體者是身口意鬱單曰人亦所不得何以故無三方便故是解脫分三人能得所謂聲聞緣覺菩薩衆生若遇善知識者轉聲聞解脫得緣覺解脫轉緣覺解脫得菩薩解脫菩薩所得解脫分法不可退轉不可失壞此説惟以人趣為能得真見道欲界天享欲樂無三方便即無施戒多聞無色界無身無口而得解脫分應以身口意三為體無色界缺二故不能得鬱單曰或譯鬱單越即北俱盧洲此地福報最勝故無貧富之分無壽夭之別亦無惠施持戒多聞因其無用之必要也三人即聲聞人緣覺人菩薩人即以人為能得聲聞解脫緣覺解脫及菩薩解脫又可由劣轉勝由聲聞轉緣覺由緣覺轉菩薩壬三問得法相癸一正明得相善生言世尊説法之人復以何義能善分別如是等人有解脫分如是等人無解脫分善男子如是法者二人所得謂在家出家如是二人至心聽法聽已受持聞三惡苦心生怖畏身毛皆豎涕泣橫流堅持齋戒乃至小罪不敢毀犯當知是人得解脫分法至心即至誠懇切之心聽後即能受持實行聞地獄餓鬼畜生之苦皆係造殺盜淫妄等十惡業而生即生恐怖涕泣持戒不犯此種人可謂得解脫分法之相癸二廣辨得人子一就五趣辨善男子諸外道等獲得非想非非想定壽無量劫若不能得解脫分法當觀是人為地獄人若復有人阿鼻地獄經無量劫受大苦惱能得如是解脫分法當觀是人為涅槃人善男子是故我於鬱頭藍弗生哀愍心於提婆達不生憐心外道得報雖居最高之非想非非想天經八萬大劫而業報一盡即落輪回難免墮生地獄故觀其為地獄人而地獄中如曾具有三方便得勝解者已能得解脫分故觀其為涅槃人鬱頭藍弗為外道之最高者佛得道後即欲度之而彼已生非想非非想天佛觀之知其第二生即轉畜生第三生即墮地獄所以哀之彼曾在水邊修定被水魚樹鳥所擾發願為水獺害魚鳥而生惡心致將來墮畜生地獄提婆達此云天授雖墮地獄在法華經中提婆達多品為提婆達多授記成佛故雖在地獄已具有解脫分矣子二就三乘辨善男子如舍利弗等六萬劫中求菩提道所以退者以其未得解脫分法雖爾猶勝緣覺根利善男子是法有三謂下中上下者聲聞中者緣覺上者諸佛善男子有人勤求優婆塞戒於無量世如聞而行亦不得戒有出家人求比丘戒比丘尼戒於無量世如聞而行亦不能得何以故不能獲得解脫分法故可名修戒不名持戒善男子若諸菩薩得解脫分法終不造業求生欲界色無色界常願生於益衆生處若自定知有生天業即回此業求生人中業者所謂施戒修定善男子若聲聞人得解脫分不過三身得具解脫辟支佛人亦復如是菩薩摩訶薩得解脫分法雖復經由無量身中常不退轉不退轉心出勝一切聲聞緣覺善男子若得如是解脫分法雖復少施得無量果少戒少聞亦復如是是人假使處三惡道終不同彼三惡受苦若諸菩薩獲得如是解脫分法名調柔地何故名為調柔地耶一切煩惱漸微弱故是名逆流善男子有四種人一者順生死流二者逆生死流三者不順不逆四者到於彼岸善男子如是法者於聲聞人名柔軟地於諸菩薩亦名柔軟復名喜地以何義故名為喜地聞不退故名菩薩故以何義故名為菩薩能常覺悟衆生心故如是菩薩雖知外典自不受持亦不教人如是菩薩不名人天非五道攝是名修行無障礙道舍利子此云鶖子為佛弟子因已修得大乘勝解故雖有退轉猶勝緣覺未得勝解者於戒即為修戒不為持戒即定共戒道共戒業有善惡有漏無漏之分此中為不造三界業而修無漏三業即布施持戒修定多聞之業人中易化故回生天業以生人中須陀洹若得解脫分但經三次生死身即涅槃不必七返須七返者為鈍根性以無相布施而福德不可思量故提婆達多在地獄阿難問其苦否彼言有如三禪之樂以有勝解功德故調柔地即勝解行地或登初地此中之四種人一者凡夫之人順生死流二者二乘之人逆生死流三者菩薩之人不順不逆四者到彼岸人為佛以涅槃功德妙用度生故喜地即初歡喜地此地以前為假名菩薩此地以上是實義菩薩覺悟衆生即是菩提薩埵外典雖知不受持亦不教人而惟受持佛法教以佛法癸三作菩提種善男子夫菩提者有四種子一者不貪財物二者不惜身命三者修行忍辱四者憐愍衆生善男子增長如是菩提種子復有五事一者於己身中不生輕想言我不能得阿耨多羅三藐三菩提二者自身受苦心不厭悔三者勤行精進不休不息四者救濟衆生無量苦惱五者常讚三寶微妙功德有智之人修菩提時常當修集如是五事增長熾然菩提種子復有六事所謂檀波羅蜜乃至般若波羅蜜是六種事因一事增謂不放逸菩薩放逸不能增長如是六事若不放逸則能增長善男子菩薩求於菩提之時復有四事一者親近善友二者心堅難壞三者能行難行四者憐愍衆生復有四事一者見他得利心生歡喜二者常樂稱讚他人功德三者常樂修集六念處法四者勤説生死所有過咎善男子若有説言離是八法得菩提者無有是處善男子若有菩薩初發無上菩提心時即得名為無上福田如是菩薩出勝一切世間之事及諸衆生四種種子即是悲心修此四種種子即是修悲復次修者中五事六事能增長此四種子熾然是最勝之意而六波羅蜜又以一不放逸行而增長善友指佛菩薩六念即念佛法僧戒天死即無常合兩種四事即八法初發菩提心在理性上即與佛無異故得名為無上福田癸四明佛難得善男子雖有人言無量世界有無量佛然此佛道甚為難得何以故世界無邊衆生亦爾衆生無邊佛亦如是假使佛道當易得者一佛世尊則應化度一切衆生若爾者世界衆生則為有邊善男子佛出世時能度九萬九那由他人聲聞弟子度一那由他而諸衆生猶不可盡故名無邊是故我於聲聞經説無十方佛所以者何恐諸衆生輕佛道故諸佛聖道非世所攝是故如來説無虛妄如來世尊無有妒心以難得故説無十方諸佛世尊善男子無量衆生發菩提心不能究竟行菩薩道若人難言若有現在無量諸佛何故經中但説過去未來二世有無量佛不説現在無量佛耶善男子我一國説過去未來有恆沙佛現在世中唯一佛耳善男子真實義者能得佛道無量衆生修行佛道多有退轉時有一人乃能得度如菴羅華及魚子等此言佛不易成若佛易成則衆生當有窮盡而與世界皆有邊矣那由他此云億佛及弟子能度此多衆生而衆生猶不可盡證明佛之難成恐衆生輕佛也從佛非世間攝之理故言十方世界無佛初發心者雖多而退墮者尤多故歷長時間方有一人成佛三千諸佛名經等不言現世有多佛乃據小乘以説其實現在有多佛也菴羅樹幾千幾百花而間結一二子水中魚子亦幾千幾百子偶成一二魚譬發心雖多而成佛者少以見得佛之難能可貴癸五顯在家勝善男子菩薩有二種一者在家二者出家出家菩薩得解脫分法是不為難在家得者是乃為難何以故在家之人多惡因緣所纏繞故此顯在家菩薩惡因緣所纏繞多於出家之人故説出家菩薩得解脫分法不為難而在家之人則為難能可貴也三種菩提品第五三種菩提即聲聞緣覺及諸佛菩提此品宗旨在從三種菩提中辨出諸佛菩提為最勝戊二別策勝願己一辨勝策發庚一辨三種菩提策發辛一善生問善生言世尊如佛所説菩薩有二種一者在家二者出家菩提三種一者聲聞菩提二者緣覺菩提三者諸佛菩提若得菩提名為佛者何故聲聞辟支佛人不名為佛若覺法性名為佛者聲聞緣覺亦覺法性以何緣故不名為佛若一切智名為佛者聲聞緣覺亦一切智復以何故不名為佛言一切者即是四諦三種菩提即文中所講聲聞緣覺及諸佛菩提證聲聞菩提即阿羅漢果證緣覺菩提即辟支佛果此二雖得解脫生死而不得謂無上菩提要得諸佛無上菩提才是真正菩提辨明三種菩提須捨劣取勝此品仍由善生問佛答本經各品皆然如金剛經為須菩提問佛問之類問意以聲聞聞佛説四諦法之聲而證阿羅漢之果緣覺由觀察因緣而覺悟同得一種菩提何故聲聞名為聲聞緣覺名為緣覺均不名佛若覺法性名為佛者聲聞緣覺亦覺法性若一切智名為佛聲聞緣覺亦知一切法何故不名為佛以四諦即攝一切法苦集攝世間果因滅即解脫生死而證涅槃道即達涅槃之方法則攝出世果因何以聲聞緣覺不名為佛以上有三種問意蓋欲起佛説三種之差別也辛二如來答壬一就所問三義答佛言善男子菩提有三種一者從聞而得二者從思惟得一者從修而得聲聞之人從聞得故不名為佛辟支佛人從思惟已少分覺故名辟支佛如來無師不依聞思從修而得覺悟一切是故名佛善男子了知法性故名為佛法性二種一者總相二者別相聲聞之人總相知故不名為佛辟支佛人同知總相不從聞故名辟支佛不名為佛如來世尊總相別相一切覺了不依聞思無師獨悟從修而得故名為佛善男子如來世尊緣智具足聲聞緣覺雖知四諦緣智不具足以是義故不得名佛如來世尊緣智具足故得名佛聲聞須從佛聞法而得菩提緣覺不必聞佛説法即以思惟而得菩提如來無師從修而得一切覺悟乃成無上菩提所以菩薩發心修行雖亦藉佛所説法為方便而由離言妙悟不同聲聞之拘執法相菩薩了諸法性空由修遍覺辟支佛只有少分覺未為深廣圓滿真要得一切智須以無師智離一切語言文字修證而得佛又能為一切衆生之機説法亦非聲聞緣覺所能所覺法性有總相別相之分達五蘊和合空無人我為總相智辟支佛以自思惟亦只了總相了別相則五蘊之法一一皆空無有自性此既從修而得一切言語文字皆無所用以無分別而證知者為妙智故名為佛以一切法為所緣境而佛智緣之無不圓滿此佛境界非聲聞緣覺僅於所緣境知其總相者所堪比以彼不具遍正覺故不名為佛壬二別增舉八事辨善男子如恆河水三獸俱渡兔馬香象兔不至底浮水而過馬或至底或不至底象則盡底恆河水者即是十二因緣河也聲聞渡時猶如彼兔緣覺渡時猶如彼馬如來渡時如彼香象是故如來得名為佛聲聞緣覺雖斷煩惱不斷習氣如來能拔一切煩惱習氣根原故名為佛善男子疑有二種一煩惱疑二無記疑二乘之人斷煩惱疑不斷無記如來悉斷如是二疑是故名佛善男子聲聞之人厭於多聞緣覺之人厭於思惟佛於是二心無疲厭故名為佛善男子譬如淨物置之淨器表裏俱淨聲聞緣覺智雖清淨而器不淨如來不爾智器俱淨是故名佛善男子淨有二種一者智淨二者行淨聲聞緣覺雖有淨智行不清淨如來世尊智行俱淨是故名佛善男子聲聞緣覺其行有邊如來世尊其行無邊是故名佛善男子如來世尊能於一念破壞二障一者智障二者解脫障是故名佛如來具足智因智果是故名佛一恆河為印度最大之河香象為最大之象此譬以恆河水喻十二因緣生死流轉大河以兔喻聲聞以馬喻緣覺以香象喻佛三獸雖同渡河而唯象達河底二聲聞緣覺僅斷煩惱不斷習氣如兔馬勉強渡河而不徹底佛則徹底斷其根本三疑為六根本煩惱之一煩惱疑障善法使之不生無記疑如地球為多少微塵所成有多少斤兩聲聞緣覺不須明白而佛則悉知之所謂佛於恆沙世界一滴之雨皆知頭數四聲聞從佛聞聲得悟生空而不願多聞緣覺雖以思惟而悟生空亦不願多所思惟唯佛則於山河大地微塵草木無不了知於聞於思心無疲厭五智慧喻物身心喻器聲聞緣覺之身心為業報所成故須灰身泯智方得無餘涅槃有餘身心則非究竟清淨六聲聞緣覺習氣未淨所以身心有時於行不淨佛則無不清淨七聲聞緣覺其行自利利他俱有邊際限量佛則俱無邊際限量八佛於最後一念能斷二障智障即所知障解脫障即煩惱障前障菩提後障涅槃智因即菩提心等智果即佛果壬三廣明佛功德辨癸一總示佛功德善男子如來出言無二無謬亦無虛妄智慧無礙樂説亦爾具足因智時智相智無有覆藏不須守護無能説過悉知一切衆生煩惱起結因緣滅結因緣世間八法所不能汙有大憐愍救拔苦惱具足十力四無所畏大悲三念身心二力悉皆滿足此總示佛功德智慧無障礙樂説即隨意所説了知一切衆生心行即因智知一切時為時智知一切因相果相差別相等為相智三業清淨全無過失故不覆藏守護結即煩惱起結即起煩惱滅結即滅煩惱八法即利衰毀譽稱譏苦樂之八風於衆生之大苦惱能憐愍之十力一知是處非處智力即知事理是非之力二知三世業報智力三知諸禪解脫三昧智力四知衆生心性之力五知種種解智力六知種種界智力七知一切所至道智力八知天眼無礙智力九知宿命無漏智力十知永斷習氣智力四無所畏一説一切智無所畏謂大衆中作獅子吼我為一切正智之人無怖心也二説漏盡無所畏謂説我已斷盡一切煩惱三説障道無所畏謂説煩惱等障法無有怖心四説盡苦道無所怖畏佛能在大衆中作獅子吼言我為一切智者斷盡一切煩惱能説起何業得何果及知苦之滅盡由此四無畏能於大衆中分明決定而説毫無怖畏大悲不必待緣衆生信與不信佛亦無喜與憂因此身心二力皆得充滿世人言有志者事竟成但初發菩提心雖有大悲救他之志尚無其力故須精進培養成身心二力癸二別顯身心力云何身力滿足善男子三十三天有一大城名曰善見其城縱廣滿十萬里宮室百萬諸天一千六十六萬六千六百六十有六夏三月時釋提桓因欲往波利質多林中歡娛受樂由乾陀山有一香象名伊羅鉢那具足七頭帝釋發念象知即來善見城中所有諸天處其頭上旋行而往其林去城五十由延是象身力出勝一切香象身力正使和合如是香象一萬八千其力唯敵佛一節力是故身力出勝一切衆生之力世界無邊衆生亦爾如來心力亦復無邊是故如來獨得名佛非二乘人名為佛也三十三天為欲界第二天其頂之城名善見城釋提桓因即三十三天之天主波利質多樹義為香遍樹為樹中之王乾陀山即香樹山伊羅鉢那即熱臭樹而大所有諸天即一千六十六萬餘天俱能變化隨意大小可處香象之頭上由延又謂由旬正譯踰繕那印度三十里之數即合如是香象一萬八千之力僅敵佛之一節力以世界無邊衆生亦爾形容佛心力之無邊癸三列舉諸德號以是義故名無上師名大丈夫人中香象師子龍王調御示導名大船師名大醫師大牛之王人中牛王名淨蓮華無師獨覺為諸衆生之眼目也是大施主是大沙門大婆羅門寂靜持戒勤行精進到於彼岸獲得解脫人天師中佛為無上故名無上師能調御衆生故名大丈夫能渡一切衆生到道岸故名大船師能醫一切衆生心病故名大醫師人比常牛故佛比大牛王一切清淨故名佛淨蓮華菩提樹下無師獨悟故為無師獨覺能指示衆生覺路故為衆生眼目為一切施故是大施主沙門為出家之通稱婆羅門為清淨之裔佛為出家之最極清淨者故稱大沙門大婆羅門身心清淨故名寂靜能止惡行善持戒不退勤行精進故得究竟解脫也癸四結非聲緣比善男子聲聞緣覺雖有菩提都無是事是故名佛聲聞緣覺都無上述佛之功德故惟有佛得名為佛壬四結在家菩薩勝善男子菩薩有二種一者在家二者出家出家菩薩分別如是三種菩提是不為難在家分別是乃為難何以故在家之人多惡因緣所纏繞故此中仍警策在家菩薩環境惡劣甚難辨識如是三種菩提修三十二相業品第六欲成最勝菩提須修三十二相福業之因此品次在第六故題為修三十二相業品第六庚二修三十二相策發辛一善生躡問善生言世尊如佛所説菩薩身力何時成就善生跟躡上文即問佛之身力何時成就辛二如來廣説壬一正答得成身力佛言善男子初修三十二相業時佛答上述佛之身力即成就三十二相業時壬二總明修相功德癸一略明功德善男子菩薩修集如是業時得名菩薩兼得二定一者菩提定二有定復得二定一者知宿命定二者生正法因定善男子菩薩從修三十二相業乃至得阿耨多羅三藐三菩提於其中間多聞無厭菩薩摩訶薩修一一相以百福德而為圍繞修心五十具心五十是則名為百種福德此為真正菩薩以修集三十二相之業故趣向無上菩提決定時即得菩提定於二十五有之中不墮三惡道謂之有定知自己宿命為知宿命定能了解正法修行正法為生正法因定自初發心修三十二相業乃至得無上遍正覺於中多聞無厭一種相有百福德者修心五十即十善法一一各有五善根合為五十到具心時十善法亦各有五善根合亦五十是名百福德癸二較顯功德善男子一切世間所有福德不及如來一毛功德如來一切毛孔功德不如一好功德聚合八十種好功德不及一相功德一切相功德不如白毫相功德白毫功德復不得及無見頂相世間所有福德不及佛之一毛孔功德即以三界之功德與佛之一毛較白毫相即眉間白毫光相佛説法華經即放眉間白毫相光説楞嚴經即放無見頂相光白毫相與無見頂相為相之最勝者癸三出修相人善男子菩薩常於無量劫中為諸衆生作大利益至心勤作一切善業是故如來成就具足無量功德是三十二相即是大悲之果報也轉輪聖王雖有是相相不明了具足成就是相業體即身口意業修是業時非於天中北鬱單曰唯在三方男子之身非女人身也菩薩摩訶薩修是業已名為滿三阿僧祇劫次第獲得阿耨多羅三藐三菩提三十二相即大悲之果報以因中修大悲而得此三十二相之功果也輪王有金銀銅鐵之四種轉輪王即金輪王王四天下金輪王雖具三十二相不及佛果三十二相光明顯現成就三十二相業即以身口意三業而成三方為東勝神洲西牛賀洲南贍部洲此三洲能修三十二相業男子相亦為三十二相之一三十二相修滿即滿三無數劫次第獲得無上遍正覺癸四示修相時善男子我於往昔寶頂佛所滿足第一阿僧祇劫然燈佛所滿足第二阿僧祇劫迦葉佛所滿足第三阿僧祇劫善男子我於往昔釋迦牟尼佛所始發阿耨多羅三藐三菩提心發是心已供養無量恆沙諸佛種諸善根修道持戒精進多聞善男子菩薩摩訶薩修是三十二相業已了了自知定得阿耨多羅三藐三菩提如觀掌中菴摩勒果其業雖定修時次第不必定也迦葉佛為賢劫第三佛即釋迦佛之前一佛此中釋迦佛即古釋迦佛滿三十二相業時明白自知成佛菴摩勒果此云難分別果印度人常握置掌中取如示諸掌意壬三別明修相次第癸一泛説先修何相或有人言如來先得牛王眼相何以故為菩薩時於無量世樂以善眼和視衆生是故先得牛王眼相次得餘相或有説言如來先得八梵音相餘次第得何以故為菩薩時於無量世恆以軟語先語實語教化衆生是故先得八梵音相或有説言如來先得無見頂相餘次第得何以故為菩薩時於無量世供養師長諸佛菩薩頭頂禮拜破憍慢故是故先得無見頂相或有説言如來先得白毫毛相餘次第得何以故為菩薩時於無量世不誑一切諸衆生故是故先得眉間毫相善男子除佛世尊餘無能説如是相業此是泛説先修何相前説已成三十二相功德未明先修何相佛言修時次第不必拘限先修何相蓋應隨機緣之先後發起而定自來多有人言先修何相者牛王眼相者即青蓮花目所謂目紺青相和視者即和平慈視八梵音相者即於一音有八種功德相先語者如於兩人對語時而先發實語即真實語無見頂相者以佛初生時其姨母不能見其頂持地菩薩觀至上方無量世界亦不能見此無見頂此正顯一切法之妙真如相所謂一相無相言語道斷心行處滅之無對待妙理故難可見佛為至尊無上菩薩為先進或同輩之有德者頭頂禮拜即五體投地在頂禮之中有種種儀式也憍是小隨煩惱以著己功德者為性慢為根本煩惱有七慢九慢之分恃己凌人為慢世界不平之事皆由慢心而起其根本在有我見接諸佛菩薩之足以破其憍慢則能達一切平等常人以憍慢故不平等故不能得此無見頂相白毫毛相者毛字可改作光字他經俱作光毛與毫同白毫光相透明有光細長而能卷舒自在因不誑衆生而成此表中道實相雖有此先修何相諸説以佛之意不必定言何先何後隨緣修之可也癸二正明修相次第善男子或復有人次第説言如來先得足下平相餘次第得何以故為菩薩時於無量世布施持戒修集道時其心不動是故先得足下平相得是相已次第獲得足下輪相何以故為菩薩時於無量世供養父母師長善友如法擁護一切衆生是故次得手足輪相得是相已次第獲得纖長指相何以故為菩薩時至心受持第一第四優婆塞戒是故次得纖長指相足跟長相得是相已次第獲得身傭滿相何以故為菩薩時善受師長父母善友所教敕故是故次得身傭滿相得是相已次得手足合網縵相何以故為菩薩時以四攝法攝衆生故是故次得手足網縵相得是相已次第獲得手足柔軟勝餘身相何以故為菩薩時於無量世以手摩洗師長父母身除去垢穢香油塗之是故次得手足軟相得是相已次得身毛上向靡相何以故為菩薩時於無量世常化衆生令修施戒一切善法是故次得毛上靡相得是相已次第獲得鹿王腨相何以故為菩薩時至心聽法志心説法為壞生死諸過咎故是故次得鹿王腨相得是相已次第獲得身方圓相如尼拘陀樹王何以故為菩薩時於無量世常施一切衆生病藥是故次得身方圓相得是相已次第獲得手過膝相何以故為菩薩時終不欺誑一切賢聖父母師長善友知識是故次得手過膝相得是相已次得象王馬王藏相何以故為菩薩時於無量世見怖畏者能為救護心生慚愧不説他過善覆人罪是故次得象馬藏相得是相已次得軟身一一孔中一毛生相何以故為菩薩時於無量世親近智者樂聞樂論聞已樂修樂治道路除去棘剌是故次得皮膚柔軟一一孔中一毛生相得是相已次第獲得身金色相何以故為菩薩時於無量世常施衆生房舍臥具飲食燈明是故次得金色身相得是相已次第獲得七處滿相何以故為菩薩時於無量世可瞋之處不生瞋心樂施衆生隨意所須是故次得七處滿相得是相已次第獲得缺骨滿相何以故為菩薩時於無量世善能分別善不善相言無錯謬不説無義可受之法口常宣説不可受者不妄宣傳是故次得缺骨滿相得是相已次得二相一者上身二者頰車皆如師子何以故為菩薩時於無量世自無兩舌教他不為是故次得如是二相得是相已次得三相一四十齒二白淨相三齊密相何以故為菩薩時於無量世以十善法淨化衆生衆生受已心生歡喜常樂稱揚他人功德是故次得如是三相得是相已次第獲得四牙白相何以故為菩薩時於無量世修欲界慈樂思善法是故次得四牙白相得是相已次得味中最上味相何以故為菩薩時於無量世不待求已然後方施是故次得味上味相得是相已次得二相一者肉髻二廣長舌何以故為菩薩時於無量世至心受持十善法教兼化衆生是故次得如是二相得是相已次得梵音相何以故為菩薩時於無量世自不惡口教他不為是故次得梵音聲相得是相已次得牛王紺色目相何以故為菩薩時於無量世等以慈善視怨親故是故次得牛王目相得是相已次得白毫相何以故為菩薩時於無量世宣説正法實法不虛是故次得白毫光相得是相已次得無見頂相何以故為菩薩時於無量世頭頂禮拜一切聖賢師長父母尊重讚歎恭敬供養是故獲得無見頂相此言次第僅二十八種相與他經論有不盡同者一足下平相道即菩薩道達一切法空平等其心如實不動二足下輪相者即足下千輻輪相擁護即愛護三四五足跟長為二相纖長指相者此處亦重持在家戒足跟長者即足跟圓滿此中攝三相纖長及足跌端厚並足圓滿六身分傭滿者即身分圓滿前一相包括三相此一相即為第六七四攝即布施愛語同事利行網縵即指間之網八柔軟在他處又謂網軟九上向靡即毛向上十鹿王為鹿中之最美滿者腨即足脛十一尼拘陀樹其幹端直衆生身不端正圓滿故無此相十二手足過膝即能立身摩膝十三藏相他處又云馬陰藏相又謂勢峰密藏相謂與象王馬王無異十四一一孔中一毛生相即每一孔生一毛樂聞樂論樂修均對佛法言十五佛身常現真金色故名得身金色相十六七處平滿相者在全身七處皆圓滿即頭胸臍間及四支又謂之七處充滿凡人生瞋恨心即現醜陋相生善心即現好相十七缺骨者人身有骨節處皆現缺陷相缺骨滿即骨處皆圓滿無缺十八十九頰車又謂師子頰輪上身即如師子身頰輪即如師子面兩皆圓滿此即兩相二十草一草二三相皆關於齒者白淨齊密皆齒之圓滿相草三四牙即門牙寬闊鮮白此亦修四無量心而得草四上味相即不待他求先施而得草五草六肉髻即頂上隆起之紅肉廣長舌能遍於世界而説法此為二相草七梵音相已如前釋草八草九牛王紺色目相分為牛王睫相目紺青相牛王睫似其形目紺青言其色三十白毫相以説不偏不虛中道實法而得卅一無見頂相解釋見前此中只明三十一相無項光及胸卍字之相其次第自足修至頂亦即此經明在家修行次第明應從施戒修起佛之功德所感皆無漏果非出有漏之業菩薩須修三十二相業以度衆生壬四結在家菩薩勝善男子菩薩二種一者在家二者出家出家菩薩修如是業是不為難在家菩薩修是業者是乃為難何以故在家之人多惡因緣所纏繞故在家菩薩多障礙纏繞以難修勉勵精進發願品第七上來策發無上菩提即辨勝策發勉以修大悲心行菩薩道因有前兩品之辨勝策發所以有正發勝願之此品來就實體講願即是欲欲通善惡無記之三性此願即善性之欲三乘之願並是無漏非有漏攝願之發與草木種子發芽相同在中國普通謂之立志願與回向不同於有功德之後用向於何途謂回向未有功德之前欲修功德謂之發願己二正發勝願庚一善生問答善生言世尊是三十二相業誰能作耶佛言善男子智者能作世尊云何名智者善男子若能善發無上大願是名智者善生進問云何為智者佛答發無上大願無上者即最高最上有廣大心量深遠志趣者之謂庚二廣説發願辛一發願所因菩薩摩訶薩發菩提心已身口意等所作善業願為衆生將來得果一切共之菩薩摩訶薩常親近佛聲聞緣覺善知識等供養恭敬咨問深法受持不失摩訶即大義大即勝義從真正開發菩提心即初住或初地以上菩薩發心即發菩提總心願即如普賢十大願王藥師十二願行彌陀四十八願各有不同四宏誓願則為共願不外願衆生皆能享受其所修之功德親近亦是普賢十願之一此兩願仍是願之總相辛二正陳願言作是願言我今親近諸佛聲聞緣覺善友寧無量世受大苦惱不於菩提生退轉心衆生若以惡心打罵毀辱我身願我因是更增慈心不生惡念願我後生在在處處不受女身無根二根奴婢之身復願令我身有自在力他為給使不令他人有自在力而驅使我願令我身諸根具足遠離惡友不生惡國邊裔之處常生豪姓色力殊特財寶自在得好念心自在之心心得勇健凡有所説聞者樂受離諸障礙無有放逸離身口意一切惡業常為衆生作大利益為利衆生不貪身命不為身命而造惡業利衆生時莫求恩報常樂受持十二部經既受持已轉教他人能壞衆生惡見惡業一切世事所不能勝既得勝已復以轉教善治衆生身心重病見離壞者能令和合見怖畏者為作救護護已為説種種之法令彼聞已心得調伏見飢施身令得飽滿願彼不生貪惡之心當噉我時如食草木常樂供養師長父母善友宿德於怨親中其心等一常修六念及無我想十二因緣無三寶處樂在寂靜修集慈悲一切衆生若見我身聞觸之者遠離煩惱菩薩雖知除菩提已不求餘果為衆生故求以弘利不退轉者不論遇何苦惱打罵毀辱而不生惡念即大慈悲心修行度生須色力具足女身力弱無根者即無丈夫相二根者即男女根不決定奴婢者無自在力菩薩雖恆順衆生而須有轉衆生之力及教化衆生之力不為他人所支配惡國者即有惡王惡法之國邊裔者不拘地域方所但指無文化及氣候不良之地而言生豪姓則人多欽仰色力殊特者即勇健好念即常起善念十二部經前已詳述心病者即煩惱病六念十二因緣前均已解三寶即佛法僧此上為正願言辛三顯示願果壬一總顯立願利益善男子菩薩若能如是立願當知是人即是無上法財長者是求法王未得法王菩薩為利他故而求得法王於發願時尚未得到法王之位但若能立如上願言即是無上法財長者壬二別明法財長者善男子菩薩摩訶薩具足三事則得名為法財長者一者心不甘樂外道典籍二者心不貪著生死之樂三者常樂供養佛法僧寶復有三事一者為人受苦心不生悔二者具足微妙無上智慧三者具善法時不生憍慢復有三事一者為諸衆生受地獄苦如三禪樂二者見他得利不生妒心三者所作善業不為生死復有三事一者見他受苦如己無異二者所修善事悉為衆生三者善作方便令彼離苦復有三事一者觀生死樂如大毒蛇二者樂處生死為利衆生三者觀無生法忍多諸功德復有三事一者捨身二者捨命三者捨財捨是三事悉為衆生復有三事一者多聞無厭二者能忍諸惡三者教他修忍復有三事一者自省己過二者善覆他罪三者樂修慈心復有三事一者至心奉持禁戒二者四攝攝取衆生三者口言柔軟不粗復有三事一者能大法施二者能大財施三者以此二施勸衆生行復有三事一者常以大乘教化衆生二者常修轉進增上之行三者於諸衆生不生輕想復有三事一者雖具煩惱而能堪忍二者知煩惱過樂而不厭三者自具煩惱能壞他結復有三事一者見他得利歡喜如己二者自得安樂不樂獨受三者於下乘中不生足想復有三事一者聞諸菩薩苦行不怖二者見有求者終不言無三者終不生念我勝一切此十四種三事如文可解壬三結示法王自在善男子菩薩若能觀因觀果能觀因果能觀果因如是菩薩能斷因果能得因果菩薩若能斷得因果是名法果諸法之王法之自在此明能觀所觀以善因得善果離惡因解脫惡果從因觀果謂觀因果從果觀因即觀果因如觀苦集滅道即從果觀因能斷因果乃能得因果斷因果即斷德得因果即恩德智德王者自在義能支配一切而不為一切所支配法華經言我為法王於法自在凡夫之心亦可造一切法謂之心王但未做到一切自在故不名法王也庚三結在家勝善男子菩薩有二種一者在家二者出家出家菩薩立如是願是不為難在家菩薩立如是願是乃為難何以故在家菩薩多惡因緣所纏繞故此言要常行精進不放逸以勉勵發心而時加警策名義菩薩品第八假名及實義之二種菩薩在此品中分別以出其相故名丁二積集福智戊一分別名義菩薩己一善生問善生言世尊如佛所説菩薩二種一者假名菩薩二者實義菩薩云何名為假名菩薩此品分別假名實義兩種菩薩善生所問僅及假名菩薩就以下答文觀之應兩種菩薩俱在問中己二如來答庚一假名菩薩善男子衆生若發菩提心已樂受外術及其典籍持諷誦讀即以此法轉化衆生為自身命殺害他命不樂修悲樂於生死常造諸業受生死樂無有信心於三寶所生疑網心護惜身命不能忍辱語言粗獷悔恨放逸於己身所生自輕想我不能得無上菩提於煩惱中生恐怖想亦不勤修壞結方便常生慳貪嫉妒瞋心親近惡友懈怠亂心樂處無明不信六度不樂修福不觀生死常樂受持他人惡語是名假名菩薩善男子復有衆生發菩提心欲得阿耨多羅三藐三菩提聞無量劫苦行修道然後乃得聞已生悔雖修行道心不真實無有慚愧不生憐愍樂奉外道殺羊祀天雖有微信心不堅固為五欲樂造種種惡倚色命財生大憍慢所作顛倒不能利益為生死樂而行布施為生天樂受持禁戒雖修禪定為命增長是名假名菩薩已發菩提心之菩薩不於佛法中自學化他而以學外道化他乃至常樂受持他人惡語故為假名粗獷者即粗惡獷野悔恨者即發菩提心後又生悔心自輕者即不信自己能得無上菩提不勤修壞結方便即不修布施以度慳貪不修忍辱以度嫉妒瞋心等六度即六波羅蜜是雖發菩提心而不修菩薩行即假名菩薩此是一類復有一類假名菩薩先發菩提心原非真實誠懇故後見難生畏而悔慚愧在修行中為最重要慚者即崇善見己不如諸佛菩薩善行而崇仰之愧者即拒惡見諸衆生惡行而輕拒之慚愧在中國通謂之羞恥殺羊祀天即如現在亦有受佛法僧皈戒後仍祀禮神鬼者復有雖修布施持戒禪定乃為生天長命而起者均為假名菩薩庚二實義菩薩實義菩薩者能聽深義樂近善友樂供養師長父母善友樂聽如來十二部經受持讀誦書寫思義為法因緣不惜身命妻子財物其心堅固憐愍一切口言柔軟先語實語無有惡語及兩舌語於自身所不生輕想舒手惠施無有禁固常樂修磨利智慧刀雖習外典為破邪見出勝邪見善知方便調伏衆生於大衆所不生恐怖常教衆生菩提易得能令聞者不生怖心勤修精進輕賤煩惱令彼煩惱不得自在心不放逸常修忍辱為涅槃果持戒精進願為衆生趨走給使令彼安隱歡娛受樂為他受苦心不生悔見退菩提心生憐愍能救一切種種苦惱能觀生死所有過罪能具無上六波羅蜜所作世事勝諸衆生信心堅固修集慈悲亦不悕求慈悲果報於怨親中其心無二施時平等捨身亦爾知無常相不惜身命以四攝法攝取衆生知世諦故隨衆生語為諸衆生受苦之時其心不動如須彌山雖見衆生多作諸惡有少善者心終不忘於三寶所不生疑心樂為供養若少財時先給貧窮後施福田先為貧苦後為富者樂讚人善為開涅槃所有技藝欲令人學見學勝己生歡喜心不念自利常念利他身口意業所作諸善終不自為恆為他人是名實義菩薩此策勸為實義菩薩修行進退本無一定如假名菩薩習修菩薩行又可轉為實義菩薩忽進忽退或忽退忽進為凡夫常有之事若自己省察尚在假名菩薩相中時一生慚愧而轉進修仍可為實義菩薩深義者即佛法之深義受持讀誦書寫解説思義在法華為五法師行詳之為十法行即對於經典十種行法一書寫二供養三施他四諦聽五披讀六受持七開演八諷誦九思惟十修習為法因緣不惜妻子財物者即可為出家菩薩智慧刀者能斷煩惱緣之義所謂聞慧思慧修慧善知方便調伏衆生者衆生有種種性種種欲善知善調可令止惡行善自在者每一法能轉動他法謂之自在煩惱能轉動善法則煩惱力得自在矣要令彼煩惱不得自在須勤賤視煩惱信心者即信三寶之心不惜身命者知身命無常而不惜之四攝法義見前認世事為真實者謂之世諦財多可平等施若財少則先貧窮令人學藝所謂菩薩當於五明處求五明謂內明聲明因明醫藥明工巧明技藝即後四明之學若此者則為實義菩薩是即勸勉從假修真庚三彰在家勝善男子菩薩有二種一者在家二者出家出家菩薩為實義菩薩是不為難在家菩薩是乃為難何以故在家之人多惡因緣所纏繞故每品末後皆置此勉勵之語佛之慈悲深切極矣義菩薩心堅固品第九戊二勉為實義菩薩己一正明實義菩薩庚一善生問善生言世尊義菩薩者云何自知是義菩薩佛了了知何者為假名菩薩何者為實義菩薩然菩薩以何法能自知為假為實為行菩薩道者所要知之事故有斯問庚二如來答辛一列舉本生行本生為佛舉自己修行之事十二部中有説佛之本生部而本事則為説弟子修行之事善男子菩薩摩訶薩修苦行時先自誠心善男子我念往昔行菩薩道時先從外道受苦行法至心奉行心無退轉無量世中以灰塗身唯食胡麻小豆粳米粟米𢇲等日各一粒荊棘惡刺椓木地石以為臥具牛屎牛尿以為病藥盛夏之月五熱炙身孟冬之節凍冰襯體或受草食根食莖食葉食果食土食風食作如是等諸苦行時自身他身俱無利益雖爾猶故心無退轉出勝一切外道苦行善男子我於往昔為四事故捨棄身命一者為破衆生諸煩惱故二者為令衆生受安樂故三者為自除壞貪著身故四者為報父母生養恩故菩薩若能不惜身命即自定知是義菩薩善男子我於往昔為正法故剜身為燈三千六百我於爾時具足煩惱身實覺痛為諸衆生得度脫故諭心令堅不生退轉爾時即得具足三事一者畢竟無有退轉二者得為實義菩薩三者名為不可思議是名菩薩不可思議又我往昔為正法故於一劫中周身左右受千瘡苦爾時具足一切煩惱身實覺苦為諸衆生得度脫故諭心令堅不生退轉是名菩薩不可思議又我往昔為一鴿故棄捨是身爾時具足一切煩惱身實覺苦為諸衆生得度脫故諭心令堅不生退轉是名菩薩不可思議善男子一切惡友諸煩惱業即是菩薩道莊嚴伴何以故一切凡夫無有智慧正念之心故以煩惱而為怨敵菩薩智慧正念具足故以煩惱而為道伴惡友及業亦復如是善男子捨離煩惱終不得受惡有之身是故菩薩雖現惡業實非身口意惡所作是誓願力以是願力受惡獸身為欲調伏彼畜生故菩薩現受畜生身已善知人語法語實語不粗惡語不無義語心常憐愍修集慈悲無有放逸是名菩薩不可思議善男子我於往昔受熊身時雖具煩惱煩惱於我無自在力何以故具正念故我於爾時憐愍衆生擁護正法修行法行受瞿陀身劫賓耆羅身兔身蛇身龍身象身金翅鳥身鴿身鹿身獮猴羖羊雞雉孔雀鸚鵡蝦蟆我受如是鳥獸身時雖具煩惱煩惱於我無自在力何以故具正念故憐愍衆生擁護正法修行法行善男子於飢饉世我立大願以願力故受大魚身為諸衆生離於飢渴食我身者修道念道無惡罪過疾疫世時復立大願以願力故身為藥樹諸有病者見聞觸我及食皮膚血肉骨髓病悉除愈善男子菩薩摩訶薩受如是苦心不退轉是名義菩薩誠心者菩薩修苦行為度外道須先誠心警策云此苦行為度外道而修往昔行菩薩道時者即佛自己本生之事蓋外道苦行亦能起世人尊敬於此外道盛行時修菩薩行若要起世人信仰則須行勝過外道唯食胡麻等即食一麻一麥之行椓者為已死之木乃至土食風食外道俱有此行雖於自他身無利益而為降伏外道啓世人信仰即應一一修之菩薩能為法為衆生而捨命者即為實義菩薩千瘡苦者所謂百孔千瘡極言其苦以惡友諸煩惱業為道伴者即能於濁惡世中度生雖羅剎餓鬼亦皆能度之矣大凡菩薩證道愈高則其行愈下證道不高者只能於人天中度生不能三入惡道能於三惡趣度生者即觀音地藏諸大菩薩是受熊身者其他經上説佛往昔受熊身能扶養人之小孩成長雖在煩惱不被其轉故云於我無自在力瞿陀身即牛身劫賓耆羅身即鳥身羖羊即雌羊謂自在能轉煩惱而不為煩惱所轉辛二泛明菩薩行菩薩修行六波羅蜜時終不悕求六波羅蜜果但以利益衆生為事菩薩深知生死過患所以樂處為利衆生受安樂故菩薩了知解脫安樂生死過患而能處之是名菩薩不可思議菩薩所行不求恩報受恩之處常思反報善男子一切衆生常求自利菩薩所行恆求利他是名菩薩不可思議菩薩摩訶薩具足煩惱於怨親所平等利益是名菩薩不可思議善男子若諸外道化衆生時或以惡語鞭打罵辱擯之令出然後調伏菩薩不爾化衆生時無粗惡語瞋語綺語唯有軟語真實之語衆生聞已如青蓮遇月赤蓮遇日善男子菩薩施時財物雖少見多乞求不生厭心是名菩薩不可思議菩薩教化盲聾瘖啞愚癡邊地惡衆生時心無疲厭是名菩薩不可思議善男子菩薩有四不可思議一者所愛重物能以施人二者具諸煩惱能忍惡事三者離壞之衆能令和合四者臨終見惡説法轉之是名菩薩四不可思議復有三事不可思議一者訶責一切煩惱二者處煩惱中而不捨之三者雖具煩惱及煩惱業而不放逸是名菩薩三不可思議復有三事不可思議一者始欲施時心生歡樂二者施時為他不求果報三者施已心樂不生悔恨是名菩薩三不可思議青蓮遇月者青蓮華遇月而開赤蓮遇日者赤蓮華遇日而開也教化盲聾等者世人用愛遇不美妙者則不愛之菩薩用悲愈不美妙者則愈憐憫之臨終説法者有將命終自見其惡者即説佛法以轉之呵責煩惱及不捨煩惱者自煩惱則呵責之他煩惱則不捨之煩惱業者乃由煩惱所生之業煩惱在心而業通身口意三不思議者在理為言語道斷心行處滅方謂之不思議此處不可思議指平常難能者而言辛三行時自觀心善男子菩薩摩訶薩作是行時自觀其心我是名菩薩耶義菩薩乎衆生若能作如是事當知是人即義菩薩也菩薩能常自觀其心省察自己是否真能為實義菩薩而不為假名菩薩即是實義菩薩矣辛四較顯在家勝善男子菩薩有二種一者在家二者出家出家菩薩作如是事是不為難在家菩薩為如是事是乃為難何以故在家之人多惡因緣所纏繞故聽此經者皆能如説修行才不辜負佛於每品之勉勵語自利利他品第十此品於二十八品中次在第十即為利他而成自利成自利適能利他己二勉修菩薩功行庚一舉德勸修辛一舉自利利他勸壬一問答菩提及道善生言世尊云何菩提云何菩提道佛言善男子若離菩提無菩提道離菩提道則無菩提菩提之道即是菩提菩提即是菩提之道出勝一切聲聞緣覺所得道果是名菩提菩提之道菩提與菩提道兩名當有分別菩提在大乘則為阿耨多羅三藐三菩提在三乘菩提分為聲聞緣覺及諸佛三種此經之盡智無生智可通三乘菩提道指能得菩提因分之法如四諦之道諦及三十七道品是不過就此處文義觀菩提道亦即所證所成之果而菩提則為能證能成就之智以大乘理智如如不二言所證菩提道與能證菩提智不一不異所以謂菩提即菩提道也若離能證之菩提智即無菩提道果離菩提道果亦無菩提智若通因果不相離言道為因分菩提為果大乘道果即是菩提聲聞緣覺所證涅槃之果與菩提智非為同一大乘無住涅槃方為無上菩提之智故常言菩提即指無上菩提而言壬二問答三乘同別善生言世尊聲聞緣覺所得道果即是菩提即是菩提道云何言勝善男子聲聞緣覺道不廣大非一切覺是故菩提菩提之道得名為勝猶如一切世間經書十二部經為最第一何以故所説不謬無顛倒故二乘之道比菩提道亦復如是云何言勝者謂何故言大乘為勝聲聞緣覺不廣大者以不能遍一切覺故世間經書者即指佛經外之世間講道德説仁義等之經書壬三分別菩提學果善男子菩提道者即是學即是學果云何名學行菩提道未能具足不退轉心是名為學已得不退是名學果未得定有是名為學已得定有第三劫中是名學果初阿僧祇劫猶故未能一切惠施一切時施一切衆生施第二阿僧祇劫雖一切施未能一切時施一切衆生施如是二處是名為學第三阿僧祇劫能一切施一切時施一切衆生施是名學果善男子菩薩修行施戒忍辱進定智時是名為學到於彼岸是名學果善男子有是惠施非波羅蜜有波羅蜜不名為施有亦惠施亦波羅蜜有非惠施非波羅蜜善男子是施非波羅蜜者聲聞緣覺一切凡夫外道異見菩薩初二阿僧祇劫所行施是是波羅蜜非惠施者如尸波羅蜜乃至般若波羅蜜是亦是惠施亦波羅蜜者菩薩第三阿僧祇劫所行施是非施非波羅蜜者聲聞緣覺持戒修定忍慈悲是善男子非施非波羅蜜是名為學亦施亦波羅蜜是名學果善男子夫菩提者即是盡智無生智也為此二智勤心修集三十七品是名為學得菩提已是名學果自調諸根次調衆生是名為學自得解脫令衆生得是名學果修集十力四無所畏大悲三念是名為學具足獲得十八不共法是名學果為利自他造作諸業是名為學能利他已是名學果習學世法是名為學學出世法是名學果為諸衆生不惜身財是名為學為諸衆生亦不吝惜身財壽命是名學果能化衆生作人天業是名為學作無漏業是名學果能施衆生一切財物是名為學能行法施是名學果能自破壞慳貪嫉妒是名為學破他慳貪嫉妒之心是名學果受持五根修行憶念是名為學教他修集成就具足是名學果菩提道即修菩提之因分即是學亦即是學果定有者有三有五有九有二十五有六十二有之分定有即在人天不墮惡趣者普通須初地菩薩方不墮惡趣即要初阿僧祇劫滿第二劫即初地到七地之位第三劫在八地以上菩薩就布施波羅蜜有四句分別後當詳言亦惠施亦波羅蜜者須第八地以上菩薩及佛所行施是所謂盡法界虛空界一切衆生界而究竟施也非施非波羅蜜第一非字以改為是字較通前後文義盡智者證阿羅漢果知我生已盡之智無生智者證知再不生受後有之智小乘要到阿羅漢果大乘要到佛果才得三十七品者即四念住四正勤四如意足五根五力七覺分八聖道自修持戒禪定謂之調伏諸根十力四無所畏前已詳十八不共法為佛獨有三無失即身口意三業無過失又三隨法行即無異想無不定心無不知已捨又六無減即欲無減精進無減慧無減解脫無減解脫知見無減又三隨智慧行即身口意三業隨智慧行又三無礙即知過去現在未來無礙阿羅漢知八萬大劫菩薩雖知無盡劫亦復有礙佛為究竟無礙以上為十八不共法平常修行人小有神通仍是在不可知之中若妄用之反成顛倒如舍利弗為阿羅漢之上首而觀察鴿子至八萬劫前仍是鴿子而不知以何因緣墮鴿身而唯佛之不共功德乃能決知也五根即是五善根信進念定慧壬四正明自他兼利癸一示自他兼利相善男子菩薩信根既自利已復利益他自利益者不名為實利益他者乃名自利何以故菩薩摩訶薩為利他故於身命財不生慳吝是名自利菩薩定知若用聲聞緣覺菩提教化衆生衆生不受則以天人世樂教之是名利他利益他者即是自利菩薩不能自他兼利唯求自利是名下品何以故如是菩薩於法財中生貪著心是故不能自利益也行者若令他受苦惱自處安樂如是菩薩不能利他若自不修施戒多聞雖復教他是名利他不能自利若自具足信等五根然後轉教是名菩薩自利利他善男子利益有二一者現世二者後世菩薩若作現在利益是不名實若作後世則能兼利善男子樂有二種一者世樂二者出世樂福德亦爾菩薩若能自具如是二樂二福化衆生者是則名為自利利他以人天世樂教他者因觀機以大乘教化不能受次以聲聞緣覺法教化亦不能受則以人天世樂教之令現世後世出世樂與福德自具化他方為真正利益癸二能自他兼利行善男子菩薩摩訶薩具足一法則能兼利謂不放逸復有二法能自他利一者多聞二者思惟復有三法能自他利一者憐愍衆生二者勤行精進三者具足念心復有四法能自他利謂四威儀復有五法能自他利一者信根二者持戒三者多聞四者布施五者智慧復有六法能自他利所謂六念復有七法能自他利謂壞七慢善男子若沙門婆羅門長者男女或大衆中有諸過失菩薩見已先隨其意然後説法令得調伏如其不能先隨其意便為説法是則名為下品菩薩善男子菩薩二種一者樂近善友二者不樂樂善友者能自他利不樂近者則不能得自他兼利善男子樂近善友復有二種一樂供養二不樂供養樂供養者能自他利不樂供養不能兼利樂供養者復有二種一能聽法二不能聽至心聽者能自他利不至心聽則無兼利至心聽法復有二種一者能問二不能問能問義者能自他利不能問者則不能得自利他利能問義者復有二種一至心持二不能持至心持者能自他利不至心者則不能得自利他利至心持者復有二種一者思惟二不思惟能思惟者能利自他不思惟者則不得名自利他利能思惟者復有二種一者解義二不解義能解義者能自他利不解義者則不得名能自他利解義之人復有二種一如法住二不如法住如法住者能自他利不如法住者則不得名自利他利如法住者復有二種一者具足八智二者不能具足何等八智一者法智二者義智三者時智四者知足智五者自他智六者衆智七者根智八者上下智是人具足如是八智凡有所説具十六事一者時説二至心説三次第説四和合説五隨義説六喜樂説七隨意説八不輕衆説九不呵衆説十如法説十一自他利説十二不散亂説十三合義説十四真正説十五説已不生憍慢十六説已不求世報如是之人能從他聽從他聽時具十六事一者時聽二者樂聽三者至心聽四者恭敬聽五者不求過聽六者不為論議聽七者不為勝聽八者聽時不輕説者九者聽時不輕於法十者聽時終不自輕十一聽時遠離五蓋十二聽時為受持讀十三聽時為除五欲十四聽時為具信心十五聽時為調衆生十六聽時為斷聞根善男子具八智者能説能聽如是之人能自他利不具足者則不得名自利他利不放逸者即勿以善小而不為勿以惡小而為之之義蓋須精進也六念者即念佛法僧施戒天七慢者即慢過慢慢過慢增上慢卑劣慢邪慢我慢能壞七慢即為七法先隨其意然後説法者見諸衆生過失不能生忿怒而隨意教化之令得調伏善友範圍甚廣自佛菩薩以及一切修行有德者皆是能問者則更能起説者之廣説能思惟者則能體察考究解義者即勝解決定之結果如法住者能身口意三業皆如法住如法者能得智果上來層層升進至如法住則可得智果矣時智者知時節因緣知足智者離欲知足根智者知衆生根上下智者即知之上下根和合説者即説一法與他法均能融通隨意説者即無礙説欲何説皆能説之如法説者即契理不輕衆不呵衆者為契機不散亂者為有條理合義説者即合理論前講説法功德下為聽法功德自輕者以自己難學言五蓋即貪欲瞋恚睡眠掉悔及疑五欲即財色名食睡之粗五欲與色聲香味觸之細五欲斷聞根者從聞所成慧而到思所成慧再到修所成慧而得根本智即是斷所聞言説等癸三辨自他兼利人子一從説法聽法辨善男子能説法者復有二種一者清淨二不清淨不清淨者復有五事一者為利故説二者為報而説三者為勝他説四者為世報説五者疑説清淨説者復有五事一先施食然後為説二為增長三寶故説三斷自他煩惱故説四為分別邪正故説五為聽者得最勝故説善男子不淨説者名曰垢穢名為賣法亦名汙辱亦名錯謬亦名失意清淨説者名曰淨潔亦名正説亦名實語亦名法聚善男子若具足知十二部經聲論因論知因知喻知自他取是名正説聽者有四一者略聞多解二者隨分別解三者隨本意解四者於一一字一一句解如來説法正為三人不為第四何以故以非器故如是四人分為二種一者熟二者生熟者現在調伏生者未來調伏善男子譬如樹林凡有四種一者易伐難出二者難伐易出三者易伐易出四者難伐難出在家之人亦有四種一者易調難出二者難調易出三者易調易出四者難調難出如是四人分為三種一者呵責己調二者軟語而調三者訶責軟語使得調伏復有二種一者自能調伏不假他人二者自若不能請他令調復有二種一者施調二者咒調是調伏法復有二時一者喜時二者苦時為是四人説正法時有二方便一者善知世事二者為其給使善男子菩薩若知是二方便則能兼利若不知者則不能得自利他利善男子菩薩摩訶薩為利他故先學外典然後分別十二部經衆生若聞十二部經乃於外典生於厭賤復為衆生説煩惱過煩惱解脫歎善友德呵惡友過讚施功德毀慳過失菩薩常寂讚寂功德常修法行讚法行德若能如是是名兼利十二部經者為內明聲論者為聲明因論者為因明知因知喻知自他取者皆言因明譬如樹林四種喻調在家人四種咒調者即祈禱回向之類聞十二部經於外典不生願者真能聞十二部經者對於外典自不樂聞子二從在家出家辨在家菩薩先自調伏若不調伏則不出家在家菩薩能多度人出家菩薩則不如是何以故若無在家則無三乘出家之人三乘出家修道持戒誦經坐禪皆由在家而為莊嚴善男子有道有道莊嚴道者所謂法行道莊嚴者所謂在家出家菩薩為在家者修行於道在家之人為出家者而作法行在家之人多修二法一者受二者施出家之人亦修二法一者誦二者教此下言在家出家相互為增上緣蓋無在家修行者則無具善根出家之人在家之人能布施供養護持出家人而作法行受者受法施者布施誦者即誦十二部經教即以佛法教化子三從自行化他辨善男子菩薩摩訶薩兼有四法受施誦教如是名為自利利他菩薩若欲為衆生説法界深義先當為説世間之法然後乃説甚深法界何以故為易化故菩薩摩訶薩應護一切衆生之心若不護者則不能調一切衆生菩薩亦應擁護自身若不護身亦不能得調伏衆生菩薩不為貪身命財護身命財皆為調伏諸衆生故菩薩摩訶薩先自除惡後教人除若不自除能教他除無有是處是故菩薩先應自施持戒知足勤行精進然後化人菩薩若不自行法行則不能得教化衆生善男子衆生諸根凡有三種菩薩諸根亦復三種謂下中上下根菩薩能化下根不及中上中根菩薩能化中下不及上根上根菩薩能三種化化他須應機説法不善巧者每開口即説法界深義以眩自己之高深而無益於度生佛則因衆生機之淺深而設教化擁護自身者即雪譏謗等菩薩雖證生空無有我見以利他不得不擁護自身故下根者則可説以人天法中根者則可説以二乘法上根者即可説以大乘法菩薩三根係就程度言壬五顯在家菩薩勝善男子菩薩有二種一者在家二者出家出家菩薩自利利他是不為難在家菩薩修是二利是乃為難何以故在家菩薩多惡因緣所纏繞故此示勉勵精進之意望大衆勿辜佛恩自他莊嚴品第十一由假名菩薩入實義菩薩自他兼利即能自他莊嚴辛二舉自他莊嚴勸壬一問答能自他利善生言世尊菩薩摩訶薩具足幾法能自他利善男子具足八法能自他利何等為八一者壽命長遠二者具上妙色三者身具大力四者具好種姓五者多饒財寶六者具男子身七者言語辨了八者無大衆畏幾法者幾多功德之意謂須具若干功德方能自他兼利八種法前六皆福德後二則有關智慧壽命長遠者非特異其類之壽命也自古聖賢如釋尊年八十歲孔子七十餘歲如在人中即得人中較長之壽命耳蓋人須至五十六十歲後其經驗道德學問年齡方為衆所欽仰而能利人也具上妙色者即色身具足相好身具大力者佛菩薩皆身具大力若人身力不具則雖有利自他之心而無其力所謂心有餘而力不足也具好種姓者如印度婆羅門剎帝利之類為多人所欽仰方能自他利具男子身者以其身比女子強健能耐勞苦艱難之事蓋修菩薩行須行常人所不能行故言語辨了者須舌根鋭利智慧具足無大衆畏者即於大衆中無怖畏憶昔有一修行人經典極熟於少數人中頗能講解後於升大座講經時聽者甚衆忽起怖畏不能講説下座後即懊惱致病以死壬二問答八事所因善生言世尊何因緣故菩薩得壽命長乃至大衆不生怖畏佛言善男子菩薩摩訶薩無量世中慈心不殺以是因緣獲得長壽無量世中常施衣燈以是因緣獲得上色無量世中常壞憍慢以是因緣生上種姓無量世中常施飲食以是因緣身力具足無量世中常樂説法以是因緣多饒財寶無量世中呵責女身以是因緣得男子身無量世中至心持戒以是因緣言語辨了無量世中供養三寶以是因緣無大衆畏善生意有果必有因上八事究以何因而得故問世尊不殺以得壽命者不獨前生修今生得即現生修亦可現生得生上種姓者在中國如生在世家大族身力原藉飲食資養能常施飲食俾無飲食者得到飲食故能得身力充足之報以法施人俾人得到學問道德者亦能得饒財之報呵責者不貪著之謂中國有所謂女中丈夫者即有剛健之氣此種人將來可轉得男子身以三界言超過欲界則無男女之分至諸佛真如法身平等平等更無男女性之差別在欲界中因有男女貪愛之性故有男女之報在因中男女均可以修男子身持戒者即止惡行善因戒生定因定發慧即生真實智慧所以得言語辨了之果佛法僧三寶為真正皈依處他若諸天等所成功德均不免有欠缺故非真正可歸依處惟佛有大威德大智慧其所説法亦究竟圓滿依佛法修行之僧亦真實無漏此三者譬如波濤大海中之救渡寶筏故為真正歸依處壬三明八事所由成癸一三因緣如是八事有三因緣一者物淨二者心淨三者福田淨云何物淨非偷盜物非聖遮物非衆共物非三寶物非施一人回與多人非施多人回與一人不惱他得不誑他得不欺人得是名物淨云何心淨施時不為生死善果名稱勝他得色力財不斷家法眷屬多饒唯為莊嚴菩提故施為欲調伏衆生故施是名心淨云何福田淨受施之人遠離八邪名福田淨善男子以如是等三因緣故八法具足物淨者指所施之物言非從偷盜不義之行而得之物聖遮物者為聖法所遮之物如五葷不淨蔥蒜等類非衆共物即非己所有之公物回與者謂已施與人者又拿來施與他人惱他得者係惱恨他人而得之物誑他得者即騙他而得欺人得者係以智識乘智淺者而得心淨者以布施動機存心利他而定生死善果者即欲得人天福報名稱勝他者即為名而施得色力財者菩薩為弘法利人非為得色力財不為家法眷屬多饒者菩薩應普為一切衆生不應為不斷家法盛旺及眷屬多饒唯為二種一為莊嚴佛果二為調伏衆生菩薩除此二種外即無所事所施之物為施物能施人之心即施心受施之人為受施之福田八邪者即與八正道相反八正為正語正見正業正勤正定正命正念正思惟八邪即邪語邪見邪業邪勤邪定邪命邪念邪思惟常行八正道者為三乘聖衆三種清淨不僅布施有之其他善行亦有之癸二八所以善男子菩薩所以求於長命欲為衆生讚不殺故菩薩所以求上色者為令衆生見歡喜故菩薩所以求上種姓為令衆生生恭敬故菩薩所以求具足力為欲持戒誦經坐禪故菩薩所以求多財寶為欲調伏諸衆生故菩薩所以求男子身為欲成器盛善法故菩薩所以求語辨了為諸衆生受法語故菩薩所以求不畏大衆為欲分別真實法故不畏大衆者要心如大海安然不動其目的在為衆生授真實法覺悟一切衆生壬四由八事所成德癸一有德不憍善男子是故菩薩具足八法能自他利能如是行是名實行善男子菩薩摩訶薩有八法者具足受持十善之法樂以化人具足受持優婆塞戒樂以化人雖得妙色終不以是而生憍慢雖持淨戒多聞精進大力好姓多饒財寶終不以此而生憍慢不以幻惑欺誑衆生不生放逸修六和敬菩薩具足如是等法雖復在家不異出家如是菩薩終不為他作惡因緣何以故慚愧堅故不憍即儒書中所謂富而不驕其實不僅富不應憍即貴或有學有名有德有智皆不應憍人十善但為人天善法而優婆塞五戒從佛法性海中流出乃可為出世階梯也幻惑者即以多智多力而施巧技六和敬者即尊重團體之法出家人有六和之戒法在家之人亦應身口意三業恭敬和合者在家人能修六和合敬善敬同道即無異在家慚愧堅則不為他作惡因緣癸二處世不動善男子在家之人設於一世受持如是優婆塞戒雖復後生無三寶處終不造作諸惡因緣所以者何二因緣故一者智慧二不放逸善男子於後惡處不作惡事有四因緣一者了知煩惱過故二者不隨諸煩惱故三者能忍諸惡苦故四者不生恐怖心故菩薩具足如是四法不為諸苦一切煩惱之所傾動善男子不動菩薩有五因緣一者樂修善法二者分別善惡三者親近正法四者憐愍衆生五者常識宿命善男子菩薩具足如是八法若聞譏毀心能堪忍若聞讚歎反生慚愧修行道時歡喜自慶不生憍慢能調惡人見離壞衆能令和合揚人善事隱他過咎人所慚恥處終不宣説聞他祕事不向餘説不為世事而作咒誓少恩加己思欲大報於己怨者恆生善心怨親等苦先救怨者見有罵者反生憐愍見他偷時默然不動見來打者生於悲心視諸衆生猶如父母寧喪身命終不虛言何以故知果報故於諸煩惱應生怨想於善法中生親舊想若於外法生於貪心尋能觀察貪之過咎一切煩惱亦復如是雖復久與惡人同處終不於中生親善想雖與善人不同居止終不於彼而生遠想雖復供養父母師長終不為是而作惡事乏財之時見有求者不生惡想雖不親近凶惡之人而其內心常生憐愍惡來加已以善報之自受樂時不輕他人見他受苦不生歡喜身業清淨持四威儀即以是法用化衆生口業清淨誦讀如來十二部經即以是法用化衆生意業清淨修四無量亦以是法開化衆生假身受苦令他受樂甘樂為之世間之事雖無利益為衆生故而亦學之所學之事世中最勝雖得通達心無憍慢以己所知勤用化人欲令此事經世不絶於親友中不令作惡樂以上八教化衆生説因説果無有錯謬愛別離時心不生惱觀無常故受樂受時心不耽荒觀苦無常善男子菩薩具足如上八法則能施作如是等事生無三寶處終不造惡以有不放逸及智慧之報故忍苦者如無恆産而有恆心之士及君子固窮之君子不動者如孔子四十不惑孟子四十不動心之類在佛法中十住十行十回向之三賢人亦可得不動正法者亦有世出世之分常識宿命者非人中聖人所能得到三賢位菩薩亦不能常得須到初地以上方得譏毀能忍者以無關自他利不必護雪之者是讚歎往往有過其實者在佛法中破和合僧即乖合鬥爭廣言之一國之中有破和合者輒起戰爭再廣言之全世界人類各民族國家亦因乖合起鬥爭推而廣之其義無窮能令和合則自他利矣咒誓即為世間事賭咒發誓之類在出世法上之誓願如四宏誓願之類則應為之見偷不動應事後以正法化之衆生為父母者自無始來從衆生受身謂為父母並不為過菩薩於他不生怨想而於己之煩惱應生怨想為供養父母師長而作惡事者世間往往有之究不應當也凶惡之人如自己為大菩薩還須親近而化度之四無量心即慈悲喜捨世事無利為衆生故學之者如修外道苦行之類是壬五顯在家菩薩勝善男子菩薩二種一者在家二者出家出家菩薩修是八法是不為難在家修集是乃為難何以故在家菩薩多惡因緣所纏繞故此為本經每品通義如前已詳二莊嚴品第十二辛三舉福智二嚴勸壬一躡前問答善生言世尊云何菩薩自他莊嚴佛言善男子菩薩具足二法能自他莊嚴一者福德二者智慧此承前問如何而能自他莊嚴佛稱為福智兩足尊故答言須具足福智方能自他莊嚴世尊何因緣故得二莊嚴善男子菩薩修集六波羅蜜便得如是二種莊嚴施戒精進名福莊嚴忍定智慧名智莊嚴復有六法二莊嚴因所謂六念念佛法僧名智莊嚴念戒施天名福莊嚴六波羅蜜中亦有分別施忍戒為福般若為智精進與定通於福智者亦有以施戒忍進定為福唯般若為智者此經又為一例壬三明二嚴相癸一以果利明善男子菩薩具足是二莊嚴能自他利為諸衆生受三惡苦而其內心不生憂悔若能具足是二莊嚴則得微妙善巧方便了知世法及出世法善男子福德莊嚴即智莊嚴智慧莊嚴即福莊嚴何以故夫智慧者能修善法具足十善獲得財富及大自在得是二故故能自利及利益他有智之人所學世法於學中勝以是因緣便得財富及大自在菩薩具足如是二法則能二世自他利益智者若能分別世法及出世法世間法者一切世論一切世定出世法者知陰入界菩薩知是二法因緣故能二世自他利益善男子菩薩雖知世間之樂虛妄非真而亦能造世樂因緣何以故為欲利益諸衆生故二世即現在世及未來世陰即色受想行識之五陰入即眼耳鼻舌身意色聲香味觸法之十二入界即眼耳鼻舌身意色聲香味觸法眼識耳識鼻識舌識身識意識之十八界癸二以因行明善男子是二莊嚴有二正因一者慈心二者悲心修是二因雖復流轉生死苦海心不生悔復次菩薩具足二法而能莊嚴無上菩提一者不樂生死二者深觀解脫是故亦能二世利益了知法相得大智慧能令自他財命增長善男子菩薩摩訶薩具是二法一切施時不生憂悔見衆惡事而能堪忍菩薩施時觀二種田一者福田二貧窮田菩薩為欲增福德故施於貧苦為增無上妙智慧故施於福田為報恩故施於福田生憐愍故給施貧窮捨煩惱故施於福田成功德故施於貧窮增長一切樂因緣故施於福田欲捨一切苦因緣故施於貧窮菩薩若施所親愛處為報恩故若施怨讎為除惡故菩薩摩訶薩見來求者生一子想是故任力多少施之是則名為施波羅蜜菩薩施時離於慳心名尸波羅蜜能忍一切求者之言名忍波羅蜜所施之物手自授與名精進波羅蜜至心繫念觀於解脫名禪波羅蜜不擇一切怨親之相名般若波羅蜜善男子如諸衆生貪心殺時一念具足十二因緣菩薩施時亦復如是一念具足如是六事是名功德智慧莊嚴不樂生死即於流轉生死中度生而不樂著之貧窮田即貧苦窮乏之衆生施怨讎則能解怨就融攝言一施波羅蜜能具足六波羅蜜其他五波羅蜜亦復如是明十二因緣有從一世明者有從二世三世明者亦有從一念明者若能念念不退即第八地境界癸三以別相明復次善男子菩薩摩訶薩造作不共法之因緣名福莊嚴教化衆生悉令獲得三種菩提名智莊嚴復次善男子菩薩若能調伏衆生名智莊嚴同於衆生受諸苦惱名福莊嚴菩薩能令一切衆生離於惡見名智莊嚴能教衆生住信施戒多聞智慧名福莊嚴復次善男子菩薩摩訶薩具足五法則能莊嚴無上菩提何等為五一者信心二者悲心三者勇健四者讀誦世論不生疲厭五者學諸世業亦不厭之善男子菩薩具足二種莊嚴則有七相何等為七一者自知罪過二者不説他過三者樂瞻病人四者樂施貧人五者獲菩提心六者心不放逸七者一切時中常至心修六波羅蜜善男子復有七相何等為七一者樂化怨讎二者化時不厭三者要令成熟解脫四者盡己所知世語世事以化衆生心不貪著五者能忍一切惡事六者終不宣説他人所不喜事七者見破戒者及弊惡人心不瞋恚常生憐愍善男子菩薩摩訶薩知是七相則能自利及利益他不共法即前所明之十八不共法令離惡見者菩薩造種種論皆為破衆生惡見信心者即信實德能信實者信真實之事理信德者信佛法僧之功德信能即信因能致果及自能成佛等能讀世論學世業者在菩薩智慧上對於世論世業本可不讀不學為化衆生故而讀而學之不然菩薩功德智慧超過一切衆生若卑視衆生而不教化則衆生何由得度弊惡人即極惡之人菩薩不能化之應常生慚愧壬四結在家勝善男子菩薩二種一者在家二者出家出家菩薩為二莊嚴是不為難在家修集是乃為難何以故在家多有諸惡因緣所纏繞故此為勉勵之語如前已詳攝取品第十三前來講修成實義菩薩須利他欲利他則須攝取徒衆此是品所由來也庚二化他攝衆辛一善生問善生言世尊菩薩具足二莊嚴已云何得畜徒衆弟子要具足自利利他方為實義菩薩要為實義菩薩方具足自他莊嚴具足莊嚴之出家在家能自他利以化衆生者自然有徒衆弟子前來依止在家者在學舍學院之類出家者有叢林寺院之類皆以有徒衆弟子之故問畜徒衆弟子應如何教誨即以如何方法攝養徒衆而教化之也辛二如來答壬一總明以四攝法畜徒善男子應以四攝而攝取之令離諸惡增諸善法至心教詔猶如一子不求恩報不為名稱不為利養不求自樂四攝法為攝取之方法四攝法所謂布施愛語利行同事即以四法攝取勾引布施中如所謂所求乎朋友先施之使無交情者漸成親近乃能攝取布施不必財物即用言語禮貌之類皆是六度之施度重在度自己之慳貪四攝之布施重在攝取衆生故為用稍有不同愛語者佛説法以四悉檀為宗旨初順世間所喜法説之次就各人之所宜而説之次就對治其煩惱而説之最後則可説第一義而使超出如對現在科學哲學之人先以佛法與科哲學之同者而説之次就同中之不同者説之再次詳辨其或同或異最後説出非同非異真如之理以顯佛法之勝義利行則為利他之行同事則情感無隔礙而易化矣善用四攝法則能近悅遠來而終不離去矣此種純係大菩薩行實為難行之行在佛法中亦有專以自己所學所樂教化他人者較為容易但往往不能得學人之信解而退失菩薩心以無四攝法之方便故壬二無德有德畜徒弊利善男子菩薩若無如是等事畜弟子者名弊惡人假名菩薩非義菩薩名旃陀羅臭穢不淨破壞佛法是人不為十方諸佛之所憐念善男子菩薩若能隨時教戒所言時者貪恚癡時起貪結時當為種種説對治法令得除貪餘二亦爾次當教學十二部經禪定三昧分別深義調其身心令修六念不放逸法瞻養病苦不生厭心能忍惡口誹謗罵辱苦加身心亦當堪忍設其有苦能為救解除其弊惡疑網之心善知利根中根鈍根教鈍根人令生信心中根之人能令純淑利根之人令得解脫若能如是勤教詔者名義菩薩是名善人分陀利華人中香象調御丈夫名大船師善男子寧受惡戒一日中斷無量命根終不養畜弊惡弟子不能調伏何以故是惡律儀殃齊自身畜惡弟子不能教誨乃令無量衆生作惡能謗無量善妙之法破和合僧令多衆生作五無間是故劇於惡律儀罪無如是等事者即無四攝等德者耽誤弟子事小展轉流傳誤人罪多旃陀羅為印度四族以下之最卑者謂之不可接觸以觸之為不祥不淨在佛法中一切平等釋尊亦度旃陀羅為弟子能隨時教戒即為有德者恚即瞋恚對治法者如貪重者令修不淨觀恚重者令修慈悲觀之類禪定三昧就廣義講皆可通攝若分別言則禪為色界四禪定即無色四定三昧即三摩地心住一境平等任持學十二部經為聞思二慧與禪定三昧相應為修慧六念如前已説分陀利華即白蓮華亦即蓮華中之盛美者惡戒者即誓受惡法之戒佛在時亦有從外道受戒教令一日斷一千人命根若央掘魔羅經説作五無間者即造五逆惡業即弒父弒母殺阿羅漢出佛身血破和合僧也壬三別辨在家出家畜徒癸一總明出家在家善男子菩薩二種一者在家二者出家出家菩薩有二弟子一者出家二者在家在家菩薩有一弟子所謂在家在家菩薩若畜出家弟子則破佛制癸二別辨出家在家子一出家教二衆丑一教出家弟子出家菩薩教出家者十二部經隨所犯罪諭令懺悔教習八智何等為八一者法智二者義智三者時智四者知足智五者自智六者衆智七者根智八者分別智善男子菩薩摩訶薩若能如是教詔調伏出家弟子是師弟子二人俱得無量利益如是師徒能增三寶何以故如是弟子知八智已能勤供養師長和上耆舊有德能受善語能勤讀誦兼為法施心不放逸調伏衆生能瞻病苦給施貧乏八智如前已説衆智即知他人智根智即知根上中下智梵音和上譯親教師即自己親從受教者謂之和上普通之師則稱師長耆舊有德為長者之類丑二教在家弟子善男子出家菩薩若有在家子弟亦當先教不放逸法不放逸者即是法行供養父母諸師和上耆舊有德施於安樂至心受戒不妄毀犯受寄不抵見恚能忍惡口惡語及無義語終不為之憐愍衆生於諸國王長者大臣恆生恭敬怖畏之心能自調伏妻子眷屬分別怨親不輕衆生除去憍慢不親惡友節食除貪少欲知足鬥諍之處身不往中乃至戲笑不説惡語是則名為不放逸法出家菩薩若畜在家弟子先當教告不放逸法受苦樂時常當共俱設在窮乏有所須者六物之外有不應惜病時當為求覓所須瞻病之時不應生厭若自無物應四出求求不能得貸三寶物差已依俗十倍償之如波斯匿國之正法若不能償復當教言汝今多負三寶之物不能得償應當勤修得須陀洹果至阿羅漢果若能至心發菩提心若教千人於佛法中生清淨信若壞一人殷重邪見出家菩薩能教在家如是等事是師弟子二人俱得無量利益此皆教誡弟子應行者受寄不抵者受人寄存之物不應處分用他物抵償怨親能分別則能解怨報恩在家弟子本不應用三寶之物六物即三衣一鉢臥具及漉水囊比邱乞食應分為三分以一分給貧病以一分與山林鳥獸以一分自食貸三寶物即借貸佛法僧物不能償者即應修經中所説各種功德方可消受子二在家教一衆丑一師長教徒衆善男子在家菩薩若畜在家弟子亦當先教不放逸法不放逸者供養父母師長和上耆舊有德復當供給兄弟妻子親友眷屬欲行之人及遠至者所有僮僕作使之人先給飲食然後自用又復教令信向三寶苦樂共俱終不偏獨隨時賞賜不令飢寒終不打罵鞭撻苦楚應當軟言敦諭教詔設有病者應當瞻療隨所乏少當為求索世間之事悉以教之婚姻求對不取卑下教以如來五部經典見離壞者能為和合既和合已令增善心一切出家內外諸道隨意供養終不選擇何以故先以施攝後當調故以六和敬而教詔之若求財物商賈農作奉事王者常當至心如法而作既得財已如法守護樂為福德見他作時心生歡喜是則名為不放逸法在家菩薩若能教誨如是事者是師弟子二人俱得無量利益婚姻求對者即求相當之匹配五部經典係編集為五阿笈摩部類供養外道者在家菩薩為方便攝取則可出家菩薩則不能行奉事王者即公務人員學佛之人在家者不惟不能廢事不作並須比不學佛人作得更好更積極丑二國王教民衆善男子在家菩薩若得自在為大國主擁護民庶猶如一子教離諸惡修行善法見作惡者撾打罵辱終不斷命財物六分稅取其一見瞋惡者教修忍辱及不放逸所言柔軟又能分別善惡之人見有罪者忍而不問隨有財物常行惠施任力讀誦五部經典善能守護身命財物能化衆生不令作惡見貧窮者生大憐愍自於國土常修知足惡人才謗終不信受不以非法求覓財物如法護國遠七種惡一者不樂摴蒲圍碁六博二者不樂射獵三者不樂飲酒四者不樂欲心五者不樂惡口六者不樂兩舌七者不樂非法取財常樂供養出家之人能令國人常於王所生父母想信因信果見有勝己不生嫉妒見己勝他不生憍慢知恩報恩小恩大報能伏諸根淨於三業讚歎善人呵責惡人先意發言言則柔軟自無力勢如法屬他取他國時不舉四兵衆生恐怖能為救解常以四攝而攝取之善能分別種種法相不受法者軟言調之轉輪聖王為國民作君作師多係初二地菩薩應化於國土知足者即不侵略他國摴蒲者賭戲為老子所作此中不樂欲心即不放縱淫欲惡口即罵人之語兩舌即挑撥是非感情之語諸根即眼耳鼻舌身意六根三業即身口意三業不舉四兵即不窮兵黷武種種法相即世出世間之一切法相壬四結顯在家菩薩難勝善男子菩薩有二種一者在家二者出家出家菩薩畜二弟子是不為難在家菩薩畜一弟子是乃為難何以故在家之人多惡因緣所纏繞故在家菩薩畜弟子比出家菩薩畜弟子為難國王能以此中所説法教民衆者即為聖王受戒品第十四此品受前方便中供養六方義善生經亦曾説之正受戒法六重二十八輕則為此經獨有前十三品明受戒之人此品明所受之戒若以此為本經之中樞則以後十四品即為受後應修之行由此故稱優婆塞戒經也丁三受持戒行戊一受戒己一善生問善生言世尊在家菩薩云何得受優婆塞戒善生問意謂應如何方得受優婆塞戒己二世尊答庚一受前方便辛一供養善男子在家菩薩若欲受持優婆塞戒先當次第供養六方東方南方西方北方下方上方言東方者即是父母若人有能供養父母衣服飲食臥具湯藥房舍財寶恭敬禮拜讚歎尊重是人則能供養東方父母還以五事報之一者至心愛念二者終不欺誑三者捨財與之四者為娉上族五者教以世事言南方者即是師長若有人能供養師長衣服飲食臥具湯藥尊重讚歎恭敬禮拜早起晚臥受行善教是人則能供養南方是師復以五事報之一者速教不令失時二者盡教不令不盡三者勝己不生嫉妒四者持付嚴師善友五者臨終捨財與之言西方者即是妻子若有人能供給妻子衣服飲食臥具湯藥瓔珞服飾嚴身之具是人則是供養西方妻子復以十四事報之一者所作盡心營之二者常作終不懈慢三者所作必令終竟四者疾作不令失時五者常為瞻視賓客六者淨其房舍臥具七者愛敬言則柔軟八者僮使軟言教詔九者善能守護財物十者晨起夜寐十一者能設淨食十二者能忍教誨十三者能覆惡事十四者能瞻病苦言北方者即善知識若有人能供施善友任力與之恭敬軟言禮拜讚歎是人則能供養北方是善知識復以四事而還報之一者教修善法二者令離惡法三者有恐怖時能為救解四者放逸之時能令除捨言下方者即是奴婢若有人能供給奴婢衣服飲食病瘦醫藥不罵不打是人則能供給下方奴婢復以十事報之一者不作罪過二者不待教作三者作必令竟四者疾作不令失時五者主雖貧窮終不捨離六者早起七者守物八者少恩多報九者至心敬念十者善覆惡事言上方者即是沙門婆羅門等若有供養沙門婆羅門衣服飲食房舍臥具病痛醫藥怖時能救饉世施食聞惡能遮禮拜恭敬尊重讚歎是人則能供養上方是出家人以五事報一者教令生信二者教生智慧三者教令行施四者教令持戒五者教令多聞若有供養是六方者是人則得增長財命能得受持優婆塞戒前明六方即六度此品明六方係就在家之環境以言人須善處理其環境與中國向重五倫者相當如不顧全則必互相衝突各走極端而於人類社會不能調和則非佛法所當有也明白此理則知供養六方之義東方為生方故説為父母師長通世法出世法之師長妻子可包括妻及子女善知識又謂善友即習善法之朋友奴婢包括奴僕婢使沙門即學佛法出家修行者婆羅門有出家在家二種在印度即掌教化者例如中國儒者此中皆以善生長者子能受優婆塞戒為中心而説欲受戒者使先行此種倫理道德即修身齊家皆能做到者方能受優婆塞戒也辛二請許善男子若人欲受優婆塞戒增長財命先當咨啓所生父母父母若聽次報妻子奴婢僮僕此輩若聽次白國主國主聽已誰有出家發菩提心者便往其所頭面作禮軟言問訊作如是言大德我是丈夫具男子身欲受菩薩優婆塞戒惟願大德憐愍故聽平常受優婆塞戒用不著如此鄭重此中係受菩薩優婆塞戒須自利利他教化衆生攝取徒衆故須特別鄭重因與家族國法社會發生大變化關係故須父母乃至國王允許丈夫者為成年之義因將受優婆塞戒故言具男子身辛三問答壬一問遮難是時比丘應作是言汝之父母妻子奴婢國主聽不若言聽者復應問言汝不負佛法僧物及他物耶若言不負復應問言汝今身中將無內外身心病耶若言無者復應問言汝不於比丘比丘尼所作非法耶若言不作復應問言汝不作五逆罪耶若言不作復應問言汝不作盜法人耶若言不作復應問言汝非二根無根人壞八戒齋父母師病不棄去耶不殺發菩提心人盜現前僧物兩舌惡口於母姐妹作非法耶不於大衆作妄語耶此問所應遮難之事如求戒人具有所應遮之事即不能允許其受戒通常受三歸五戒不問遮難此中為受菩薩優婆塞戒受戒之後即為在家菩薩故問遮難出家弟子於出家時亦有問遮難之事此中比丘指菩薩比丘從不負佛法僧物以下正為遮難之問其事共有八種非法即非梵行謂作邪淫盜法即竊聽或偷閲比丘比丘尼戒律或潛入僧中竊聽二根即男根女根無根即無男女根壬二審至誠若言無者復應語言善男子優婆塞戒極為甚難何以故是戒能為沙彌十戒大比丘戒及菩薩戒乃至阿耨多羅三藐三菩提而作根本至心受持優婆塞戒則能獲得如是等戒無量利益若有毀破如是戒者則於無量無邊世中處三惡道受大苦惱汝今欲得無量利益能至心受不無前問八種所遮難之事者即進而審其是否至誠求戒毀破如是戒者即受戒後自犯其所誓願受持之戒法無量利益與無量苦惱即係於自己之持犯由此可見人道一生之經過關係至大也沙彌即求寂之意以其欲求涅槃之圓寂故此是男子出家受十戒者之通稱沙彌十戒者一不殺生二不偷盜三不淫四不妄語五不飲酒六不香鬘嚴身七不歌舞觀聽八不坐臥高廣大床九不過午食十不畜金銀寶器大比丘戒通稱二百五十戒而不足其數菩薩戒梵網戒十重四十八輕瑜伽戒四重四十三輕辛三示歸戒若言能者復應語言優婆塞戒極為甚難若歸佛已寧捨身命終不依於自在天等若歸法已寧捨身命終不依於外道典籍若歸僧已寧捨身命終不依於外道邪衆汝能如是至心歸依於三寶不若言能者復應語言善男子優婆塞戒極為甚難若人歸依於三寶者是人則為施諸衆生無怖畏已若人能施無怖畏者是人則得優婆塞戒乃至阿耨多羅三藐三菩提汝能如是施諸衆生無怖畏不若言能者復應語言人有五事現在不能增長財命何等為五一者樂殺二者樂盜三者邪淫四者妄語五者飲酒一切衆生因殺生故現在獲得惡色惡力惡名短命財物耗減眷屬分離賢聖呵責人不信用他人作罪橫罹其殃是名現在惡業之果捨此身已當墮地獄多受苦惱飢渴長命惡色惡力惡名等事是名後世惡業之果若得人身復受惡色短命貧窮是一惡人因緣力故令外一切五穀果蓏悉皆減少是人殃流及一天下善男子若人樂偷是人亦得惡色惡力惡名短命財物耗減眷屬分離他人失物於己生疑雖親附人人不見信常為賢聖之所呵責是名現在惡業之果捨此身已墮於地獄受得惡色惡力惡名飢渴苦惱壽命長遠是名後世惡業之果若得人身貧於財物雖得隨失不為父母兄弟妻子之所愛念身常受苦心懷愁惱是一惡人因緣力故一切人民凡所食噉不得色力是人惡果殃流萬姓善男子若復有人樂於妄語是人現得惡口惡色所言雖實人不信受衆皆憎惡不喜見之是名現世惡業之報捨此身已入於地獄受大苦楚飢渴熱惱是名後世惡業之報若得人身口不具足所説雖實人不信受見者不樂雖説正法人不樂聞是一惡人因緣力故外物一切資産減少善男子若復有人樂飲酒者是人現世喜失財物身心多病常樂鬥諍惡名遠聞喪失智慧心無慚愧得惡色力常為一切之所呵責人不樂見不能修善是名飲酒現在惡報捨此身已處在地獄受飢渴等無量苦惱是名後世惡業之果若得人身心常狂亂不能繫念思惟善法是一惡人因緣力故一切外物資産臭爛善男子若復有人樂為邪淫是人不能護自他身一切衆生見皆生疑所作之事妄語在先於一切時常受苦惱心常散亂不能修善喜失財物所有妻子心不戀慕壽命短促是名邪淫現在惡果捨此身已處在地獄受惡色力飢渴長命無量苦惱是名後世惡業果報若得人身惡色惡口人不喜見不能守護妻妾男女是一惡人因緣力故一切外物不得自在善男子是五惡法汝今真實能遠離不受優婆塞戒須先歸依三寶歸依三寶後若再歸依天魔外道鬼神等即失其三歸之體此中僧即依佛法修行之三乘賢聖僧施無畏即不害衆生歸依大悲三寶後應具不害衆生之心故衆生即因之離怖畏觀世音菩薩亦稱為施無畏者邪淫謂對正當禮法結合夫婦以外之人行淫地獄梵音那落迦或泥犁此譯苦器謂苦的器世界地獄不皆在地之下科學亦明地中有火而不能有生物佛法則言有八熱地獄有受苦衆生生在其中而八寒地獄則在地之邊際如南北兩極等處五戒道理若詳究之則前之殺盜淫妄四戒為性戒後之飲酒一戒為遮戒遮禁飲酒令不引作他惡如僅飲酒不犯他戒於自己身心雖有損害於他人尚無侵犯但人每因飲酒而犯他惡故亦列為戒條以遮止之依國法處死或國際戰爭本為止殺而殺皆非樂於殺者若樂於殺則互相殘害無有已時人類將因之滅絶矣若樂於盜必至互相掠奪不治生産必致人皆不能得其一衣一食難望生存若不依國家制度社會禮法而事邪淫則易起人群之紛擾肇民族之衰弱妄語為害尤大如彼此不以誠信相處必至爾詐我虞互啓猜嫌社會解體若飲酒則易引起前四惡行而且減少智慧多生不良嗜好身心健康因之受損由此觀之禁戒此五種惡事確為維持人類生存所必需故為人生最基本之條件若知他人作惡其影響必及全世界則不能以事不干己而置不問故須用種種方便以止息之現在天災流行物力減少憂患迭興苦惱熾盛何莫非衆生共業所感讀此經文應惕然懼恍然悟立志修持戒法以求轉苦惱為安樂壬四廣教誡若言能者復應語言善男子受優婆塞戒有四事法所不應作何等為四為貪因緣不應虛妄為瞋恚癡恐怖因緣不應虛妄是四惡法汝能離不若言能者復應語言善男子受優婆塞戒有五處所所不應遊屠兒淫女酒肆國王旃陀羅舍如是五處汝能離不若言能者復應語言善男子受優婆塞戒復有五事所不應作一者不賣生命二者不賣刀劍三者不賣毒藥四者不得酤酒五者不得壓油如是五事汝能離不若言能者復應語言善男子受優婆塞戒復有三事所不應為一者不作羅網二者不作藍染三者不作釀皮如是三事汝能離不若言能者復應語言善男子受優婆塞戒復有二事所不應為一者摴蒲圍碁六博二者種種歌舞技樂如是二事汝能離不若言能者復應語言善男子受優婆塞戒有四種人不應親近一者碁博二者飲酒三者欺誑四者酤酒如是四人汝能離不若言能者復應語言善男子受優婆塞戒有法放逸所不應作何等放逸寒時熱時飢時渴時多食飽時清旦暮時懅時作時初欲作時失時得時怖時喜時賊難穀貴時病苦壯少年衰老時富時貧時為命求財時如是時中不修善法汝能離不若言能者復應語言善男子受優婆塞戒先學世事既學通達如法求財若得財物應作四分一分應供養父母己身妻子眷屬二分應作如法販轉留餘一分藏積俟用如是四事汝能作不若言能者復應語言善男子財物不應寄付四處一者老人二者遠處三者惡人四者大力如是四處不應寄付汝能離不若言能者復應語言善男子受優婆塞戒有四惡人常應離之一者樂説