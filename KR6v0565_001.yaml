而能忍之三者未除癡心而能分別善惡之法復有三法一者善知方便能教衆生遠離惡法二者善知方便能教衆生令修善法三者化衆生時心無疲悔復有三法一者為令衆生離身苦時自於身命心不吝惜二者為令衆生離心苦時自於身命心不吝惜三者教化衆生修善法時自於身命心不吝惜復有三法一者自捨己事先營他事二者營他事時不擇時節三者終不顧慮辛苦憂惱復有三法一者心無妒嫉二者見他受樂心生歡喜三者善心相續間無斷絶復有三法一者見他少善心初不忘二者毫末之惠輒思多報三者於無量世受無量苦其心堅固無退轉想復有三法一者深知生死多諸過咎猶故不捨一切作業二者見諸衆生無歸依者為作歸依三者見惡衆生心生憐愍不責其過復有三法一者親近善友二者聞法無厭三者至心咨受善知識教復有九法遠離三法三時不悔平等惠施三種衆生復有四法所謂慈悲喜捨若言不論是否佛説要合真理才信則為信法而未信佛若言凡佛大覺海中流出之説皆合真理則信法亦信佛僧為修學佛法之賢聖衆能從凡夫行至佛位故單信法或佛法或僧則信仰不為具足須三種具信則為具足信心深信因果非淺智所能古人答錯一句不落因果致墮野狐身經五百世後得大德為之轉語謂不昧因果方能解脫若能深信因果未有不清淨持戒者具解心則於佛法僧因果緣生性空空無相無願三解脫門等皆能明了勝解於一切法不取不著者即具有勝解者雖一切法緣生性空如幻如化而業報相續仍不落空亡古時有禪師言本來空即還業債還業債即本來空則為善知空性辛二辨淨心時善男子菩薩若以上法淨心要在二時一佛出世時二緣覺出時善男子衆生善法有三種生一從聞生二從思生三從修生聞思二種在二時中從修生者不必爾也菩薩善若從修生則修成時雖無佛緣覺亦能持戒清淨辛三結在家勝善男子菩薩二種一者在家二者出家出家菩薩如是淨戒是不為難在家淨戒是乃為難何以故在家之人多惡因緣所纏繞故息惡品第十六戒淨重在行善此品則明止惡己二息除諸惡庚一問答息惡善生言世尊菩薩已受優婆塞戒若有內外諸惡不淨因緣云何得離善男子菩薩若有內外諸惡不淨因緣是人應當修念佛心若有至心修念佛者是人則得離內外惡不淨因緣增長悲慧念佛以佛功德加持對治不淨因緣蓋佛心即慈悲心一心念佛則與慈悲相應而諸惡自息矣庚二問答修法辛一問修法世尊當云何修辛二答念佛壬一廣觀佛德善男子當觀如來有七勝事一者身勝二者如法住勝三者智勝四者具足勝五者行處勝六者不可思議勝七者解脫勝云何身勝如來身為三十二相八十種好之所嚴飾一一節力敵萬八千伊羅鉢那香象之力衆生樂見無有厭足是名身勝云何如法住勝如來既自得利益已復能憐愍救濟利益無量衆生是名如法住勝云何智勝如來所有四無礙智非諸聲聞緣覺所及是名智勝云何具足勝如來具足行命戒見是名具足勝云何行處勝如來世尊修三三昧九次第等非諸聲聞緣覺所及是名行處勝云何不可思議勝如來所有六種神通亦非聲聞緣覺所及如十力四無所畏大悲三念處是名不可思議勝云何解脫勝如來具足二種解脫除智慧障及煩惱障永斷一切煩惱習氣智緣二事俱得自在是名解脫勝是故舍利弗於契經中讚歎如來具七勝法如來從觀不淨乃至得阿耨多羅三藐三菩提從莊嚴地至解脫地勝於聲聞辟支佛等是故如來名無上尊如來世尊修空三昧滅定三昧四禪慈悲觀十二因緣皆悉為利諸衆生故如來正覺發言無二故名如來如往先佛從莊嚴地出得阿耨多羅三藐三菩提故名如來具足獲得微妙正法名阿羅訶能受一切人天供養名阿羅訶覺了二諦世諦真諦名三藐三佛陀修持淨戒具足三明名明行足更不復生諸有之中故名善逝知二世界衆生世界國土世界名世間解善知方便調伏衆生名調御丈夫能令衆生不生怖畏方便教化離苦受樂是名天人師知一切法及一切行故名為佛能破四魔名婆伽婆復觀如來行戒定慧為益衆生又於無量無數世中怨親等利無有差別悉斷一切無量煩惱一一皆知一一衆生為一煩惱無量世中受大苦惱如來世尊為衆生故難施能施難忍能忍佛有二淨一莊嚴淨二果報淨如是二淨因緣力故從初十十至後十十無有人天能説其過如來具足八萬音聲衆生聞之不生厭離以是因緣如來出勝一切聲聞辟支佛等平常以持名念佛為念佛而於念字旁加一口其實念佛即念念相續觀佛勝事之謂如法住即如法之真實性相而住四無礙智者一法無礙智二詞無礙智三義無礙智四樂無礙智三三昧者一空二無相三無願九次第定者四禪定四空處滅盡定六神通前已釋滅定將有漏心行皆已滅盡如來謂從真理説法不二而來謂之如來又從先佛修行成佛而來謂之如來應供正遍知明行足善逝世間解無上士調御丈夫天人師佛世尊共十德號初十十即十善十波羅蜜後十十即十力十號又於十善具十種修成百福德貫於初後通名十十壬二結會戒淨善男子若人受持優婆塞戒欲淨戒者當作如是修念佛心若修念佛是人則離內外諸惡不淨因緣增長悲慧貪瞋癡斷具足成就一切善法結歸於念戒清淨也壬三結在家勝善男子菩薩二種一者在家二者出家出家菩薩修念佛心是不為難在家修集是乃為難何以故在家之人多惡因緣所纏繞故供養三寶品第十七三寶為一切衆生之真歸依處仰賴三寶加被則能持戒息惡離過清淨己三供養三寶庚一善生問善生言世尊菩薩已受優婆塞戒復當云何供養三寶三寶又稱三尊佛為福智莊嚴之福慧兩足尊法為能離貪欲之離欲尊僧為衆中清淨之衆中尊三寶實為暗室之明燈迷途之覺路一切衆生皆應供養故善生問應如何供養三寶庚二世尊答辛一三寶福田善男子世間福田凡有三種一報恩田二功德田三貧窮田報恩田者所謂父母師長和上功德田者從得暖法乃至得阿耨多羅三藐三菩提貧窮田者一切窮苦困厄之人如來世尊是二種福田一報恩田二功德田法亦如是是二種田衆僧三種一報恩田二功德田三貧窮田以是因緣菩薩已受優婆塞戒應當至心勤供養三寶三藐三菩提下應增一者字福田者田以生長為義於應供養者供養之則能受諸福報如農夫種田有收獲之利故曰福田約之則為三種一報恩田亦曰恩田於己有養育教誨之恩者報答之自獲無量之福二功德田亦曰敬田於有修集世出世功德之三寶恭敬供養自生無量之福三貧窮田亦曰悲田係可悲愍之苦難貧窮境界向此境界惠施則得無量之福僧於尚未得到大福德時又已捨棄家財不治生産實行乞食故亦為貧窮田和上譯親教師又曰和尚義譯力生以依歸之力而弟子之道得生故也從暖法乃至得阿耨多羅三藐三菩提者乃至二字指四加行中之頂忍世第一法聲聞四果緣覺及菩薩而言辛二住持三寶三寶應有三種第一一體三寶清淨自性佛法僧人人本具法法不無心佛衆生平等一體第二別相三寶即得無上菩提者為佛寶由佛所證所説之法為法寶依佛法修行從得暖法乃至等覺菩薩為僧寶第三則住持三寶即寺塔等處供奉之佛像為佛寶一切佛經典册為法寶出家奉行佛律之僧衆為僧寶此中所説正是住持三寶或有執著自性三寶而輕慢住持三寶者不免錯誤壬一廣明佛寶癸一建供塔像善男子如來即是一切法藏是故智者應當至心勤心供養生身滅身形像塔廟若於空野無塔像處常當繫念尊重讚歎若自力作若勸人作見人作時心生歡喜如其自有功德力者要當廣教衆多之人而共作之既供養已於己身中莫生輕想於三寶所亦應如是凡所供養不使人作不為勝他作時不悔心不愁惱合掌讚歎恭敬尊重若以一錢至無量寶若以一綖至無量綖若以一華至無量華若以一香至無量香若以一偈讚至無量偈讚若以一禮至無量禮若繞一匝至無量匝若一時中乃至無量時若自獨作若共人作善男子若能如是至心供養佛法僧者若我現在及涅槃後等無差別見塔廟時應以金銀銅鐵繩鎖幡蓋技樂香油燈明而供養之若見鳥獸踐踏毀壞要當塗治掃除令淨暴風水火之所壞處亦當自治自若無力當勸人治或以金銀銅鐵土木若有塵土灑掃除拂若有垢汙以香水洗若作寶塔及作寶像作訖當以種種幡蓋香華奉上若無真寶力不能辦次以土木而造成之成訖亦當幡蓋香華種種技樂而供養之若是塔中草木不淨鳥獸死尸及其糞穢萎華臭爛悉當除去蛇鼠孔穴當塞治之銅像木像石像泥像金銀琉璃頗梨等像常當洗治任力香塗隨力造作種種瓔珞乃至猶如轉輪聖王塔精舍內當以香塗若白土泥作塔像已當以琉璃頗梨真珠綾絹綵錦鈴磬繩鎖而供養之畫佛像時綵中不雜膠乳雞子應以種種華貫散華妙紼明鏡末香塗香散香燒香種種技樂歌舞供養如晝夜亦如是如夜晝亦如是不如外道燒酥大麥而供養之終不以酥塗塔像身亦不乳洗不應造作半身佛像若有形像身不具足當密覆藏勸人令治治已具足然後顯示見像毀壞應當至心供養恭敬如完無別如是供養要身自作若自無力當為他使亦勸他人令佐助之此中正明住持佛寶生身者即佛在印度之生身滅身者即佛以三昧真火自焚其身而留存之舍利琉璃非琉璃燈之琉璃乃一種青色之寶華貫即以線貫串之花癸二敬讚佛法若人能以四天下寶供養如來有人直以種種功德尊重讚歎至心恭敬是二福德等無差別所謂如來身心具足身有微妙三十二相八十種好具足大力心有十力四無所畏大悲三念五智三昧三種法門十一種空觀十二緣智無量禪定具足七智已能度到六波羅蜜岸若人能以如是等法讚歎佛者是人則名真供養佛此明恭敬讚歎佛法五智三昧者此中五智三昧係指修五停心智而得之定五停心即不淨慈悲因緣界分別數息之五觀三種法門者指奢摩他止毗鉢舍那觀及禪那止觀不二而言十一空觀者指內空外空內外空有為空無為空無始空性空無所有空第一義空大空等十一空而言尚有説十六空十八空二十空多與此相同者十二緣智者即指緣十二因緣之智七智即七覺分謂擇法精進喜輕安念定行捨之七菩提分壬二略顯法僧云何名為供養於法善男子若能供養十二部經名供養法云何供養十二部經若能至心信樂受持讀誦解説如説而行既自為己復勸人行是名供養十二部經若能書寫十二部經既書寫已種種供養如供養佛唯除洗浴若有供養受持讀誦如是經者是則名為供養法也供養法時如供養佛又復有法謂菩薩一根辟支佛人三根三諦若信是者名供養法若有供養發菩提心受持戒者出家之人向須陀洹至阿羅漢果名供養僧此中正明住持法寶僧寶供養法應以誦讀解説受行勸他為正解或有謂僅以説法他聽為法供養者不免罣漏三根者此中指辟支佛之上中下三根言三諦者通常指真諦俗諦中諦此中即指三根所證之上中下三諦又諸行無常諸法無我涅槃寂靜亦為三諦發菩提心出家受比丘及菩薩戒之人為菩薩比丘僧又向須陀洹至阿羅漢果之小乘聖衆亦應供養辛三示供養益若有人能如是供養佛法僧寶當知是人終不遠離十方如來常與諸佛行住坐臥善男子若有人能如説多少供養如是三福田者當知是人於無量世多受利益恆常供養住持三寶能與自性三寶相應和合而成為一故於無量世多受利益辛四結在家勝善男子菩薩二種一者在家二者出家出家菩薩供養三寶是不為難在家供養是乃為難何以故在家之人多惡因緣所纏繞故出家人每日有常課每食修供養供養三寶較為容易在家人環境惡劣乃為難能以上廣顯修成菩薩之行一大科共十六品已講完文中皆係以在家菩薩為中心作標準能如此修行即成為在家菩薩以下正明能行六度之相即能行六度菩薩之體相六波羅蜜品第十八此六種修行度到彼岸如六種渡人之船菩薩即藉此以渡到彼岸此品正明其總相丙二正明能行六度之相丁一善生問善生言世尊如佛先説供養六方六方即是六波羅蜜是人則能增長財命如是之人有何等相問意為能供養六方六波羅蜜之菩薩究有何種行相可辨丁二世尊答戊一正答能行人相佛言善男子若能不惜一切財物常於他人作利益事念於布施樂行布施隨有隨施不問多少當行施時於身財物不生輕想淨施不擇持戒毀戒讚歎布施見行布施歡喜不妒見有求者心則悅樂起迎禮拜施床命坐前人咨問若不咨問輒為讚歎布施之果見恐怖者能為救護處飢饉世樂施飲食雖作是施不為果報不求恩報施不誑衆生能讚三寶所有功德不以斗稱雜餘異賤欺誑於人不樂酒博貪欲之心常修慚愧羞恥之德雖復巨富心不放逸多行惠施不生憍慢善男子有是相者當知是人則能供養施波羅蜜善男子若有人能淨身口意常修軟心不作罪過設誤作者常生愧悔信是罪業得惡果報所修善事心生歡喜於小罪中生極重想設其作已恐怖憂悔終不打罵瞋惱衆生先意語言言輒柔軟見衆生已生愛念心知恩報恩心不慳吝不誑衆生如法求財樂作福德所作功德常以化人見窮苦者身代受之常修慈心憐愍一切見作惡者能為遮護見作善者讚德説果復以身力往營佐之身不自由令他自在常修遠離瞋恚之心或時暫起覺生愧悔實語軟語遠離兩舌及無義語善男子有是相者當知是人則能供養戒波羅蜜善男子若人能淨身口意業衆生設以大惡事加乃至不生一念瞋心終不惡報若來悔謝即時受之見衆生時心常歡喜見作惡者生憐愍心讚歎忍果訶責瞋恚説瞋果報多有苦毒修施忍時先及怨家正觀五陰衆緣和合若和合成何故生瞋深觀瞋恚乃是未來無量惡道受苦因緣若暫生瞋則生慚愧恐怖悔心見他忍勝不生妒嫉善男子有是相者當知是人則能供養忍波羅蜜善男子若有人能不作懈怠不受不貪坐臥等樂如作大事功德時力及營小事心亦如是凡所作業要令畢竟作時不觀飢渴寒熱時與非時不輕自身大事未訖不生悔心作既終訖自慶能辦讚歎精進所得果報如法得財用皆以理見邪進者為説惡果善教衆生令修精進所作未竟不中休息修善法時不隨他語善男子有是相者當知是人則能供養進波羅蜜善男子若有人能淨身口意樂處空間若窟若山樹林空舍不樂憒鬧貪著臥具不樂聽説世間之事不樂貪欲瞋恚愚癡先語軟語常樂出家教化衆生所有煩惱輕微軟薄離惡覺觀見怨修慈樂説定報心若逸亂生怖愧悔見邪定者為説罪過善化衆生置正定中善男子有是相者當知是人則能供養禪波羅蜜善男子若有人能淨身口意悉學一切世間之事於貪瞋癡心不貪樂不狂不亂憐愍衆生善能供養父母師長和上長老耆舊有德修不放逸先語軟語不誑衆生能分別説邪道正道及善惡報常樂寂靜出家修道能以世事用教衆生見學勝己不生妒心自勝他人不生憍慢受苦不憂受樂不喜善男子有是相者當知是人則能供養般若波羅蜜此正分答能行六度菩薩之六種相瞋心為純惡法若貪及癡尚通無記及通三界瞋唯惡性只在欲界戊二別明各有四事善男子一一方中各有四事施方四者一者調伏衆生二者離對三者自利四者利他若人於財不生慳惜亦不分別怨親之相時與非時是人則能調伏衆生於財不惜故能行施是故得離慳吝之惡是名離對欲施施時施已歡喜不生悔心是故未來受人天樂至無上樂是名自利能令他人離於飢渴苦切之惱故名利他戒方四者一者莊嚴菩提二者離對三者自利四者利他莊嚴菩提者優婆塞戒至菩薩戒能為阿耨多羅三藐三菩提初地根基是名莊嚴既受戒已復得遠離惡戒無戒是名離對受持戒已得人天樂至無上樂是名自利既受戒已施諸衆生無恐無畏咸令一切離苦獲安是名利他忍方四者一者莊嚴菩提二者離對三者自利四者利他莊嚴菩提者因忍故得修善修善故得初地乃至阿耨多羅三藐三菩提是名莊嚴既修忍已能離瞋惡是名離對忍因緣故得人天樂至無上樂是名自利忍因緣故人生喜心善心調心是名利他進方四者一者莊嚴菩提二者離對三者自利四者利他莊嚴菩提者因精進故得修善修善法故得初地乃至阿耨多羅三藐三菩提是名莊嚴修善法時離惡懈怠是名離對因是善法得人天樂至無上樂是名自利教衆生修善令離惡法是名利他禪方四者一者莊嚴菩提二者離對三者自利四者利他莊嚴菩提者因修如是禪定力故獲得初地乃至阿耨多羅三藐三菩提是名莊嚴因是禪定修無量善離惡覺觀是名離對修舍摩他因緣力故常樂寂靜得人天樂至無上樂是名自利斷諸衆生貪欲瞋恚狂癡之心是名利他智方四者一者莊嚴菩提二者離對三者自利四者利他莊嚴菩提者因修智慧獲得初地乃至阿耨多羅三藐三菩提是名莊嚴修智慧故遠離無明令諸煩惱不得自在是名離對除煩惱障及智慧障是名自利教化衆生令得調伏是名利他此別明六方六度各有四事煩惱障從能障得名智慧障即所知障從所障得名此六度為修行最要之法自應各度平等均修但因本經為在家菩薩經故尤重在施度戊三確示定有六度善男子或有説言離戒無忍離智無定是故説有四波羅蜜若能忍惡不還報者即名為戒若修禪定心不放逸即是智慧是故戒即是忍慧即是定離慧無定離定無慧是故慧即是定定即是慧離戒無進離進無戒是故戒即精進精進即戒離施無進離進無施是故施即精進精進即施故知無有六波羅蜜者是義不然何以故智慧是因布施是果精進是因持戒是果三昧是因忍辱是果然因與果不得為一是故應有六波羅蜜若有説言戒即是忍忍即是戒是義不然何以故戒從他得忍不如是有不受戒而能忍惡為衆修善忍無數苦無量世中代諸衆生受大苦惱心不悔退是故離戒應有忍辱善男子三昧即是舍摩他智慧即是毗婆舍那舍摩他名緣一不亂毗婆舍那名能分別是故我於十二部經説定慧異當知定有六波羅蜜如來所以最初先説檀波羅蜜為調衆生施時離貪是故次説尸波羅蜜施時能忍捨離之心是故次説忍波羅蜜施時心樂不觀時節是故次説進波羅蜜施時心一無有亂想是故次説定波羅蜜施時不為受生死樂是故次説智波羅蜜此中引或言只四度或三度二度及一度而破斥之確示定有六度之別體相三昧即正定由舍摩他而得毗婆舍那即是觀緣一不亂即是止能善分別乃是觀戊四出六波羅蜜相善男子云何名為波羅蜜耶施時不求內外果報不觀福田及非福田施一切財心不吝惜不擇時節是故名為施波羅蜜乃至小罪雖為生命尚不毀犯是故名為戒波羅蜜乃至惡人來割其身忍而不瞋是故名為忍波羅蜜三月之中一偈讚佛不休不息是故名為進波羅蜜具足獲得金剛三昧是故名為禪波羅蜜善男子得阿耨多羅三藐三菩提時具足成就六波羅蜜是故名為智波羅蜜施度須與智慧相應了達根身器界皆空無我不分別福田非福田所謂是法平等無有高下其他五度亦復如是佛作忍辱仙人時任人割截支體而不生瞋即忍辱與生空法空慧相應之實例金剛三昧即金剛定金剛喻定正指菩薩於最後位斷最極細微煩惱之禪定依此定之慧如金剛能斷一切障習得此定已即將成佛若引申之則世第一位亦可謂之無間道即亦可謂為金剛三昧再廣義則由此一地進入彼一地時通可謂金剛三昧戊五結顯在家為難善男子菩薩有二一者在家二者出家出家能淨六波羅蜜是不為難在家能淨是乃為難何以故在家之人多惡因緣所纏繞故此顯在家菩薩能行六度為難能可貴
