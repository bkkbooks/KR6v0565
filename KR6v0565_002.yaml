body:
  text: 優婆塞戒經講録下雜品第十九從此以下為明菩薩所修之六度前十七品則講能行之人也此品為施度因品文甚長分刻於第四第五兩卷中故有雜品第十九之一之二其實即為一品題雜品者亦以其文義廣長耳其實皆講明施度者以題作檀波羅密品為是乙二明菩薩所修之六度丙一施度丁一問答能事善生言世尊菩薩已修六波羅蜜能為衆生作何等事善男子如是菩薩能拔沉沒苦海衆生善生問意為已修六度者對於衆生能作何種利益事苦海者即三界以六道衆生皆不能離苦示苦之深廣故如三苦之苦苦為生老病死等苦又壞苦即人道雖間有樂天道雖多受樂而樂壞即是苦又行苦即無常不住之苦由是衆生皆在苦中如馬陷泥中不能自拔人道雖有智慧然為五欲財色名食睡所沉沒而難於認清看空又有欲自振拔而復遇邪見外道為其所縛難得解脫超拔如有發菩提心修六度行之菩薩則能救拔此苦海衆生丁二廣明施度戊一略示施體善男子若有於財法食生慳當知是人於無量世得癡貧報是故菩薩修行布施波羅蜜時要作自利及利益他善男子若人樂施一切怨讎悉生親想不自在者皆得自在信施因果信戒因果是人則得成就施果善男子有人説言施即是意所以者何意是施根故是義不然何以故施即五陰所以者何由身口意具足施故布施若為自利他利及自他利則具五陰如是布施即能莊嚴菩提之道遠離煩惱多財巨富名施正果壽命色力安樂辨才名施餘果施果三種有財勝故獲得勝果有田勝故獲得勝果施主勝故獲得勝果向須陀洹至後身菩薩乃至成佛是名勝田施如是田故得勝果若有施物具足妙好色香味觸是名財勝以是物施故得勝果若有施主信心淳濃施戒聞慧則得勝果此經為開示在家菩薩修菩薩行之經典而布施又為在家菩薩所易行故特重施度之説明五陰即色受想行識於施時其色身感受想像剎那生滅相續之行及意識並前五識皆為其體布施能度慳貪諸煩惱以慳貪為諸煩惱首故布施能現生破慳貪正得來生享巨富報其餘壽命長遠色力健康身心安樂言語辨慧亦皆布施所應有之果報後身菩薩者曰一生補處菩薩如彌勒菩薩今處兜率內院時是再進而降生人間則為後身菩薩而即身成佛矣戊二分別施相己一五種施善男子有智之人施有五種一者至心施二者自手施三者信心施四者時節施五者如法求物施善男子至心施者得何等果若至心施者是人則得多饒財寶金銀琉璃硨磲瑪瑙珍珠珊瑚象馬牛羊田宅奴婢多饒眷屬至心施者得如是果自手施者得何等果自手施者所得果報如上所説得已能用自手施者得如是報信心施者得何等果信心施者所得果報如上所説常為父母兄弟宗親一切衆生之所愛念信心施者加如是報時節施者得何等果時節施者所得果報如上所説所須之物隨時而得時節施者兼如是果如法財施得何等果如法財施所得果報如上所説得是財已王賊水火所不能侵此説明五種之施得五種之果己二四塵施若好色施以是因緣是人獲得微妙上色若以香施是人因是名稱遠聞若以味施是人因是衆樂見聞既見聞已生愛重心若好觸施是人因是得上妙觸受者受已則能獲得壽命色力安樂辨才善男子有人説言施於塔像不得壽命色力安辨無受者故是義不然何以故有信心故施主信心而行布施是故應得如是五報善男子譬如比丘修集慈心如是慈心實無受者而亦獲得無量果報施塔像等亦應如是得五果報善男子如人種穀終不生瓜施於塔像亦復如是以福田故得種種果是故我説田得果報物得果報主得果報此説明以好色香味觸布施則獲得壽命色力安樂辨才之果報五報即壽命色力安樂辨才己三二三施善男子施有二種一者法施二者財施法施則得財法二報財施唯還得財寶報菩薩修行如是二施為二事故一令衆生遠離苦惱二令衆生心得調伏善男子復有三施一以法施二無畏施三財物施以法施者教他受戒出家修道白四羯磨為壞邪見説於正法能分別説實非實等宣説四倒及不放逸是名法施若有衆生怖畏王者獅子虎狼水火盜賊菩薩見已能為救濟名無畏施自於財寶破慳不吝若好若醜若多若少牛羊象馬房舍臥具樹林泉井奴婢僕使水牛駝驢車乘輦輿瓶盆斧鑊繩床坐具銅鐵瓦器衣服瓔珞燈明香華扇蓋帽履機杖繩索犁耨斧鑿草木水石如是等物稱求者意隨所須與是名財施若起僧坊及起別房如上施與出家之人唯除象馬此説明二施三施之相法施即以正法啓人正見正念正信正行正智慧等布施無畏施者衆生有恐怖畏懼時能使其出離是名無畏施白四羯磨即出家受戒經過所白羯磨四倒者以無常為常不淨為淨無樂為樂無我為我也己四除障施善男子施有四纍一慳貪心二不修施三輕小物四求世報如是四纍二法能壞一修無我二修無常善男子若欲樂施當破五事一者瞋心二者慳心三者妒心四者貪惜身命五者不信因果破是五事常樂布施樂施之人獲得五事一者終不遠離一切聖人二者一切衆生樂見樂聞三者入大衆時不生怖畏四者得好名稱五者莊嚴菩提善男子菩薩之人名一切施云何名為一切施耶善男子菩薩摩訶薩如法求物持以布施名一切施恆以淨心施於受者名一切施少物能施名一切施所愛之物破慳能捨名一切施施不求報名一切施施時不觀田以非田名一切施怨親等施名一切施菩薩施財凡有二種一者衆生二者非衆生於是二中乃至自身都不吝惜名一切施菩薩布施由憐愍心名一切施欲施施時施已不悔名一切施或時設以不淨物施為令前人生喜心故酒毒刀杖枷鎖等物若得自在若不自在終不以施不施病人不淨食藥不劫他物乃至一錢持以布施菩薩施時雖得自在終不罵打令諸僕使生瞋苦惱如法財施不求現在後世果報施已常觀煩惱罪過深觀涅槃功德微妙除菩提已更無所求施貧窮時起悲愍心施福田時生喜敬心施親友時不生放捨心若見乞者則知所須隨相給與不令發言何以故不待求施得無量果此説明破除四種障礙於布施之相破除四障即能一切施也己五辨施主善男子施主有三謂下中上不信業果深著慳吝恐財有盡見來求者生瞋礙想是名為下雖信業果於財生慳恐有空竭見來求者生於捨心是名為中深信業果於財物所不生慳吝觀諸財物是無常想見來求者有與則喜無與則惱以身質物而用與之是名為上復有下者見來求者䫌不看惡罵毀辱復有中者雖復施與輕賤不敬復有上者未來便施敬心而與復有下者為現報施復有中者為後報施復有上者憐愍故施復有下者為報恩施復有中者為業故施復有上者為法藏施復有下者畏勝故施復有中者等已故施復有上者不擇怨親又復下者有財言無又復中者多財言少又復上者少索多與施者無財亦復三種最下之人見來求者惡心瞋責中品之人見來求者直言無物上品之人見來求者自鄙無物心生愁惱復有下者常為賢聖之所訶責復有中者常為賢聖之所憐愍復有上者賢聖見已心生歡喜此説明施主有下中上之三等䫌頁面即側頭不顧己六觀施理善男子智人行施為自他利知財寶物是無常故為令衆生生喜心故為憐愍故為壞慳故為不求索後果報故為欲莊嚴菩提道故是故菩薩一切施已不生悔心不慮財盡不輕財物不輕自身不觀時節不觀求者常念乞者如飢思食親近善友咨受正教見來求者心生歡喜如失火家得出財物歡喜讚歎説財多過施已生喜如寄善人復語乞者汝今真是我功德因我今遠離慳貪之心皆由於汝來乞因緣即於求者生親愛心既施與已復教乞者如法守護勤修供養佛法僧寶菩薩如是樂行施已則得遠離一切放逸雖以身分施於乞者終不生於一念惡心因是更增慈悲喜捨不輕受者亦不自高自慶有財稱求者意增長信心不疑業果善男子若能觀財是無常相觀諸衆生作一子想是人乃能施於乞者善男子是人不為慳結所動如須彌山風不能動如是之人能為衆生而作歸依是人能具檀波羅蜜此説明布施中能修理觀則成為施波羅密己七能樂施善男子有智之人為四事故樂行惠施一者因施能破煩惱二者因施發種種願三者因施得受安樂四者因施多饒財寶善男子無貪之心名之為施云何無貪施即是業物即是作為業為作具足布施名為無貪因於布施破煩惱者既行惠施破慳貪吝瞋恚愚癡云何因施發種種願因是施已能發種種善惡等願因善惡願得善惡果何以故誓願力故云何因施得受安樂因是施故受人天樂至無上樂云何因施多饒財寶因是施故所求金銀乃至畜生如意即得善男子若人樂施是人即壞五弊惡法一者邪見二者無信三者放逸四者慳吝五者瞋癡離是惡已心生歡喜因歡喜故乃至獲得真正解脫是人現在得四果報一者一切樂見乃至怨家二者善名流布遍於四方三者入大衆時心無怖畏四者一切善人樂來親附善男子修行施已其心無悔是人若以客煩惱故墮於地獄雖處惡處不飢不渴以是因緣離二種苦一鐵丸苦二鐵漿苦若畜生身所須易得無所匱乏若餓鬼身不受飢渴常得飽滿若得人身壽命色力安樂辨才及信戒施多聞智慧勝於一切雖處惡世不為惡事惡法生時終不隨受於怖畏處不生恐怖若受天身十事殊勝善男子有智之人為二事故能行布施一者調伏自心二者壞怨瞋心如來因是名無上尊善男子智者施已不求受者愛念之心不求名稱免於怖畏不求善人來見親附亦不求望天人果報觀於二事一者以不堅財易於堅財二者終不隨順慳吝之心何以故如是財物我若終沒不隨我去是故應當自手施與我今不應隨失生惱應當隨施生於歡喜善男子施者先當自試其心以外物施其心調已次施內物因是二施獲得二法一者永離諸有二者得正解脫善男子如人遠行身荷重擔疲苦勞極捨之則樂行施之人見來求者捨財與之心生喜樂亦復如是此説明施主樂於布施之相客煩惱謂由前煩惱習氣或環境等關係非自主自願所起之煩惱不堅財世間易壞之物堅財功德之財永離諸有即離三界二十五有己八策貧施善男子智者常作如是思惟欲令此物隨逐我身至後世者莫先於施復當深觀貧窮之苦豪貴快樂是故繫心常樂行施善男子若人有財見有求者言無言匱當知是人已説來世貧窮薄德如是之人名為放逸善男子無財之人自説無財是義不然何以故一切水草人無不有雖是國主不必能施雖是貧窮非不能施何以故貧窮之人亦有食分食已洗器棄蕩滌汁施應食者亦得福德若以塵麨施於蟻子亦得無量福德果報天下極貧誰當無此塵許麨耶誰有一日食三揣麨命不全者是故諸人應以食半施於乞者善男子極貧之人誰有赤裸無衣服者若有衣服豈無一綖施人繫瘡一指許財作燈炷耶善男子天下之人誰有貧窮當無身者如其有身見他作福身應往助歡喜無厭亦名施主亦得福德或時有分或有與等或有勝者以是因緣我受波斯匿王食時亦咒願王及貧窮人所得福德等無差別善男子如人買香塗香末香散香燒香如是四香有人觸者買者量者等聞無異而是諸香不失毫釐修施之德亦復如是若多若少若粗若細若隨喜心身往佐助若遙見聞心生歡喜其心等故所得果報無有差別善男子若無財物見他施已心不喜信疑於福田是名貧窮若多財寶自在無礙有良福田內無信心不能奉施亦名貧窮是故智者隨有多少任力施與除布施已無有能得人天之樂至無上樂是故我於契經中説智者自觀餘一揣食自食則生施他則死猶應施與況復多耶善男子智者當觀財是無常是無常故於無量世失壞耗減不得利益雖是無常而能施作無量利益云何慳惜不布施耶智者復觀世間若有持戒多聞持戒多聞因緣力故乃至獲得阿羅漢果雖得是果不能遮斷飢渴等苦若阿羅漢難得房舍衣服飲食臥具病藥皆由先世不施因緣破戒之人若樂行施是人雖墮餓鬼畜生常得飽滿無所乏少善男子除布施已不得二果一者自在二者解脫若持戒人雖得生天不修施故不得上食微妙瓔珞若人欲求世間之樂及無上樂應當樂施智者當觀生死無邊受樂亦爾是故應為斷生死施不求受樂復作是觀雖復富有四天下地受無量樂猶不知足是故我應為無上樂而行布施不為人天何以故無常故有邊故此説明雖貧乏之人亦能行所應行之布施戊三論施受義己一略明施受善男子若有説言施主受者及受樂者皆是五陰如是五陰即是無常捨施五陰誰於彼受雖無受者善果不滅是故無有施者受者應反問言有施受不若言施即是施受即我者復應語言我亦如是施即是施我即五陰此辨明布施受報不落空亡或言施者受者及所受物皆空無有則不成立布施行果佛言布施受報皆相續不斷之五陰己二陰作陰受若言施陰此處無常誰與彼受諦聽諦聽當為汝説種子常耶是無常乎若言常者云何子滅而生於芽若見是過復言無常復當語言若無常者子時與糞水土等功云何而令芽得增長若言子雖無常以功業故而得芽果應言五陰亦復如是若言子中先已有芽人功水糞為作了因是義不然何以故了因所了物無增減多則多住少則少住而今水糞芽則增長是故本無今有若言了因二種一多二少多則見大少則見小猶如然燈明多見大明少見小是義不然何以故猶如一種多與水糞不能一時一日增長人等過人若言了因雖有二種要待時節物少了少物多了多是故我言了因不增是義不然何以故汝法時常是故不應作如是説善男子子異芽異雖作得異相似不斷五陰亦爾善男子如子業增芽芽業增莖莖業增葉葉業增華華業增果一道五陰增五道陰亦復如是若言如是異作異受是義汝有非我所説何以故如汝法中作者是我受者是身而復不説異作異受受不殺戒即是我也以是因緣身得妙色是故汝法受者無因作者無果有如是過若言我作身受我亦如是此作彼受復應問言汝身我異身受飲食被服瓔珞妙食因緣得好色力惡食因緣得弊色力是好惡色若屬因緣我何所得若言我得憂愁歡喜云何不是異作異受譬如有人為力服酥是人久服身得大力上妙好色有人羸瘦見之心喜是人即得大色力不若言不得我亦如是身所作事我云何得何以故不相似故我法不爾陰作陰受相似不斷此辨明由五陰作而五陰受即由此人道五陰作布施而由相續不斷轉生他道五陰受報以破或説之常見了因所了物無增減如此殿中有花盆四不因光之有無強弱有所增減或漲大縮小此中或言為數論外道之所説彼執於常及神我故一道即指人道五道即指其餘五道己三前作後受善男子若言五陰無常此不至彼而得受報是義不然何以故我法或有即作即受或有異作異受無作無受即作即受者陰作陰受異作異受者人作天受無作無受者作業因緣和合而有本無自性何有作受汝意若謂異作異受云何復言相續不斷是義不然何以故譬如置毒乳中至醍醐時故能殺人乳時異故醍醐亦異雖復有異次第而生相似不斷故能害人五陰亦爾雖復有異次第而生相似不斷是故可言異作異受即作即受無作無受者若離五陰者無我我所一切衆生顛倒覆心或説色即是我乃至識即是我或有説言色即是我其餘四陰即是我所乃至識亦如是若有説言離五陰已別有我者無有是處何以故我佛法中色非我也所以者何無常無作不自在故是名四陰不名我所乃至識亦如是衆緣和合異法出生故名為作實無異作衆緣和合異法出生名為受者實無異受是故名為無作無受若汝意謂異作異受何故此人作業不彼人受俱有五陰是義不然何以故異有二種一者身異二者名異一者佛得二者天得佛得天得身名各異是因緣故身口應異身口異故造業亦異造業異故壽命色力安辨亦異是故不得佛得作業天得受果雖俱五陰色名是一受想行異何以故佛得受樂天得受苦佛得生貪天得生瞋是故不得名為相似色名雖一其實有異或有佛得白色天得黑色若以名同為一義者一人生時應一切生一人死時應一切死汝若不欲然此義者是故不得異作異受汝意若謂汝亦異作異受我亦如是異作異受若異作異受應同我過何故不見自過而責我者是義不然何以故我異二種一次第生亦次第滅二次第生不次第滅是生異故滅亦復異是故我言異作異受此作此受不同汝過譬如有人欲燒聚落於乾草中放一粒火是火次第生因緣故能燒百里至二百里村主求得即便問之汝弊惡人何因緣故燒是大村彼人答言實非我燒何以故我所放火尋已滅盡所燒之處一把草耳我今當還償汝二把其餘之物我不應償是時村主復作是言癡人由汝小火次第生火彼燒百里至二百里辜由於汝云何不償雖知是火異作異燒相續不斷故彼得罪善惡五陰亦復如是受報時陰雖言不作以其次第相續而生是故受報譬如有人與他共賭執炬遠行至百里外若不至者我當輸汝如其到者汝當輸我執炬之人至百里已即從索物他言汝炬發迹已滅云何於此從我索物執炬者言彼火雖滅次第相續生來至此如是二人説俱得理何以故如是義者亦即亦異是故二人俱無過失若有説言五陰亦爾即作即受異作異受俱無過失譬如此彼二岸中流總名恆河夏時二岸相去甚遠秋時二岸相去則近無常定相或大或小雖復增減人皆謂河或有説言此不是河智人亦説有異不異五陰亦爾智人亦説即作即受異作異受汝意若謂二岸是土中流是水河神是河是義不然何以故若神是河何故復言河清河濁有此岸彼岸中流深淺到於大海可度不度譬如有樹則有神居若無樹者神何所居河之與神亦應如是是故彼此二岸中流次第不斷總名為河是故可言即之與異五陰亦爾譬如有人罵辱貴勝因惡口故腳被鎖械是腳實無惡口之罪而被鎖械是故不得決定説言異作異受即作即受唯有智者可得説言即作即受異作異受譬如器油炷火人工衆緣和合乃名燈明汝意若謂燈明增減是義不然何以故減故不增來故無減以次第生故言燈增減汝意若謂燈是無常油即是常油多明多油少明少者是義不然何以故油無常故有盡有燒如其常者應二念住若二念住誰能燒盡是故智人亦復説言燈明即異五陰亦爾明即六入油即是業油業因緣故令五陰有增有減有彼有此如有人説阿坻耶語是阿坻耶久已過去不在今日世人相傳次第不滅故得稱為阿坻耶語智者亦説是阿坻耶語非阿坻耶語雖復是非俱不失理五陰亦爾亦可説言即作即受異作異受有人巨富繼嗣中斷身復喪沒財當入官有人言曰如是財物應當屬我官人語言是財云何異作異屬是人復言我是亡者第七世孫次第不斷云何是財不屬我耶官人即言如是如是如汝所説智者説言五陰亦爾即作即受異作異受此明在五陰無我之中有施有受如此種詳明施義在別經中甚難得到此正本經殊勝之處此不至彼而得受報者以此生布施而至彼生受報在佛法五陰相續義中不妨有此陰作陰受者即是色受想行識之五陰作業而色受想行識之五陰受報異作異受者如在人道之五陰作在天道之五陰受無作無受者即五陰和合而作而受五陰本無自性是作無自性受亦無自性此三道理即在一事上具明之人道五陰作天道五陰受而五陰本是因緣和合而作而受即此一事是陰作陰受異作異受無作無受佛法以無自性故明一切法空佛法之空非滅盡謂之空即以事物之因緣和合無實體性謂之空故與世間科學虛空真空之所謂空不同現在科學以物質為本體而精神為附屬又有宗教以靈魂為主體而以身體為工具者與此執色乃至執識為我執其餘為我所者無異佛得天得是二人名意謂名佛得者布施行應得之果不能由另一名天得者而得之反之則天得行布施亦不能由佛得得報放火等喻以喻由布施之人道五陰剎那剎那次第相續而成他道五陰故由布施之五陰次第相續而受報執炬相續喻河流大小喻罵辱貴勝喻器油燈明喻阿坻耶語喻及巨富繼嗣喻均反復證明前作後受之義者六入即眼耳鼻舌身意六根阿坻耶譯義無可考語是一種方言己四待時成受汝意若謂五陰作業成已便過是身猶在業無所依業若無依便是無業捨是身已云何得報是義不然何以故一切過業待體待時譬如橘子因橘而生從酢而甜人為橘故種殖是子是子根莖葉華生果皆悉不酢時到果熟酢味則發如是酢味非本無今有亦非無緣乃是過去本果因緣身口意業亦復如是若言是業住何處者是業住於過去世中待時待器得受果報如人服藥經於時節藥雖消滅時到則發好力好色身口意業亦復如是雖復過滅時到則受譬如小兒初所學事雖念念滅無有住處然至百年亦不亡失是過去業亦復如是雖無住處時到自受是故言非陰作陰受亦復不得非陰受也若能了了通達是事是人則能獲無上果此即異熟報之所謂異時而熟異類而熟變異而熟若欲詳知則須究明阿賴耶識種現熏生之理此處已將此理含於其中念念滅無有住處者亦尚未明現行熏成藏識種義欲詳明此理則須研究成立阿賴耶識之成唯識論非五陰作受則真諦不得非五陰作受則為俗諦能通達此真俗二諦義則能明布施受報雖無自性而因果顯然此一大科經文亦可謂成施受論成立布施作受之理戊四成淨施主己一離不淨施善男子若復有人於身命財慳吝不施是名為慳護惜慳人不施之心不生憐愍留待福田求覓福田既得求過觀財難得為之受苦或説無果無施無受護惜妻子眷屬等心積財求名見多生喜觀財是常是名慳垢是垢能汙諸衆生心以是因緣於他物中尚不能施況出自物智人行施不為報恩不為求事不為護惜慳貪之人不為生天人中受樂不為善名流布於外不為畏怖三惡道苦不為他求不為勝他不為失財不以多有不為不用不為家法不為親近智人行施為憐愍故為欲令他得安樂故為令他人生施心故為諸聖人本行道故為欲破壞諸煩惱故為入涅槃斷於有故善男子菩薩布施遠離四惡一者破戒二者疑網三者邪見四者慳吝復離五法一者施時不選有德無德二者施時不説善惡三者施時不擇種姓四者施時不輕求者五者施時不惡口罵復有三事施已不得勝妙果報一者先多發心後則少與二者擇選惡物持以施人三者既行施已心生悔恨善男子復有八事施已不得成就上果一者施已見受者過二者施時心不平施三者施已求受者作四者施已喜自讚歎五者説無後乃與之六者施已惡口罵詈七者施已求還二倍八者施已生於疑心如是施主則不能得親近諸佛賢聖之人此中説明遠離不淨之布施己二正明淨施若以具足色香味觸施於彼者是名淨施若能如法得財施者是名淨施觀財無常不可久保而行布施是名淨施為破煩惱故行布施是名淨施為淨自心因緣故施是名淨施若觀誰施誰是受者施何等物何緣故施是施因緣得何等果如是布施即十二入受者施主因緣果報皆十二入能如是觀行於施者是名淨施若行施時於福田所生歡喜心如諸福田所求功德我亦如是求之不息施於妻子眷屬僕使生憐愍心施於貧窮為壞苦惱施時不求世間果報破憍慢施柔軟心施離諸有施為求無上解脫故施深觀生死多過罪施不觀福田非福田施若能如是行布施者報逐是人如犢隨母此中説明清淨之布施十二入即六根六塵己三較量施福若求果施市易無異如為身命耕田種作隨其種子獲其果實施主施已亦復如是隨其所施獲其福報如受施者受已得命色力安辨施主亦得如是五報若施畜生得百倍報施破戒者得千倍報施持戒者得十萬報施外道離欲得百萬報施向道者得千億報施須陀洹得無量報向斯陀含亦無量報乃至成佛亦無量報善男子我今為汝分別諸福田故作如是説得百倍報至無量報若能至心生大憐愍施於畜生專心恭敬施於諸佛其福正等無有差別言百倍者如以壽命色力安辨施於彼者施主後得壽命色力安樂辨才各各百倍乃至無量亦復如是是故我於契經中説我施舍利弗舍利弗亦施於我然我得多非舍利弗得福多也此中説明各種布施得福之多少向道即修五停心總相念別相念暖頂忍世第一法之七方便者須陀洹斯陀含阿那含阿羅漢各有向果乃至即指斯陀含果向阿那含阿那含果向阿羅漢阿羅漢果辟支佛等佛與舍利弗互施因佛大悲遍虛空盡未來一切衆生一子等視心量廣大所以得福甚多而舍利弗不能及也己四辨無惡果或有人説受者作惡罪及施主是義不然何以故施主施時為破彼苦非為作罪是故施主應得善果受者作惡罪自鍾之不及施主施主若以淨妙物施後得好色人所樂見善名流布所求如意生上種姓是不名惡云何説言施主得罪施主施己歡喜不悔親近善人財富自在生上族家得人天樂至無上樂能離一切煩惱結縛施主乃得如是妙果云何説言得惡果報施主若能自手施已生上姓家遇善知識多饒財寶眷屬成就能用能施一切衆生喜樂見之見已恭敬尊重讚歎施主受報得如是事云何説言得惡果報施主若以淨物施已以是因緣多饒財寶生上種姓眷屬無量身無病苦心無憂怖所有財物王賊水火所不能侵設失財物不生愁惱無量世中身心安樂云何説言受惡果報若未施時生於信心施時歡喜施已安樂求時守時用時不苦若以衣施得上妙色若以食施得無上力若以燈施得淨妙眼若以乘施身受安樂若以舍施所須無乏施主乃得如是善報云何説言得惡果耶此破或言若施於惡人以之作惡則施主反得惡果之説以此説能惑人聽聞阻人布施也己五論得果別復次施主若施佛已用與不用果報已定施人及僧有二種福一從用生二從受生何以故施主施時自破慳吝受者用時破他慳吝是故説言從用生福又復從用人能轉用僧能增長施已不求世之果報不以能起煩惱因施是故能得無上淨果名曰涅槃若有人能日日立要先施他食然後自食若違此要誓輸佛物犯則生愧如其不違即是微妙智慧因緣如是施者諸施中最是人亦得名上施主若能隨順求者意施是人於後無量世中所求如意若有淨心財物福田悉清淨者是人則得無量果報若給妻子奴婢衣食恆以憐愍歡喜心與未來則得無量福德復觀田倉多有鼠雀犯暴穀米恆生憐愍復作是念如是鼠雀因我得活念已歡喜無觸惱想當知是人得福無量若為自身造作衣服瓔珞環釧嚴身之具種種器物作已歡喜自未服用持以施人是人未來得如意樹若有説言離於布施得善果者無有是處離財得施離受有施不離慳惜成布施者亦無是處若不求施若乏時施少求多施求惡施好教他索施自往行施當知是人未來之世多獲寶藏非寶之物悉變成寶為戲笑施非福田施不信因果施如是布施不名為施若人偏為良福田施不樂常施是人未來得果報時不樂惠施若人施已生於悔心若劫他物持以布施是人未來雖得財物常耗不集若惱眷屬得物以施是人未來雖得大報身常病苦若先不能供養父母惱其妻子奴婢困苦而布施者是名惡人是假名施不名義施如是施者名無憐愍不知恩報是人未來雖得財寶常失不集不能出用身多病苦若人如法以財布施是人未來得無量福有財能用若有不以如法財施是人未來雖得果報恆賴他得他若喪沒尋便貧窮有智之人深觀人天轉輪王樂雖復微妙皆是無常是故施時不為人天此論布施果報有別即從施者施物受者三方面而定其分別己六明財法施善男子施有二種一者財施二者法施財施為下法施為上云何法施若有比丘比丘尼優婆塞優婆夷能教他人具信戒施多聞智慧若以紙墨令人書寫若自書寫如來正典然後施人令得讀誦是名法施如是施者未來無量得好上色何以故衆生聞法斷除瞋心以是因緣施主未來無量世中得成上色衆生聞法慈心不殺以是因緣施主未來無量世中得壽命長衆生聞法不盜他財以是因緣施主未來無量世中多饒財寶衆生聞已開心樂施以是因緣施主未來無量世中身得大力衆生聞法斷諸放逸以是因緣施主未來無量世中身得安樂衆生聞法斷除癡心以是因緣施主未來無量世中得無礙辨衆生聞法生信無疑以是因緣施主未來無量世中信心明了戒施聞慧亦復如是是故法施勝於財施財施法施之義前已説過此處更廣明法施之益印刷與書寫事同出錢印經送人亦具足財法二施己七明鬼神施或有説言子修善法父作不善因子修善令父不墮三惡道者是義不然何以故身口意業各別異故若父喪已墮餓鬼中子為追福當知即得若生天中都不思念人中之物何以故天上成就勝妙寶故若入地獄身受苦惱不暇思念是故不得畜生人中亦復如是若謂餓鬼何緣獨得以其本有愛貪慳吝故墮餓鬼既為餓鬼常悔本過思念欲得是故得之若所為者生餘道中其餘眷屬墮餓鬼者皆悉得之是故智者應為餓鬼勤作福德若以衣食房舍臥具資生所須施於沙門婆羅門等貧窮乞士為其咒願令其得福以是施願因緣力故墮餓鬼者得大勢力隨施隨得何以故生處爾故諸餓鬼等所食不同或有食膿或有食糞或食血汙嘔吐涕唾得是施已一切變成上妙色味雖以不淨蕩滌汁等施應食者然有遮護竟不得食如是施主亦得福德何以故以施主心慈憐愍故若有祀祠誰是受者隨其祠處而為受者若近樹林則樹神受舍河泉井山林堆阜亦復如是是人祀已亦得福德何以故令彼受者生喜心故是祀福德能護身財若説殺生祀祠得福是義不然何以故不見世人種伊蘭子生旃檀樹斷衆生命而得福德若欲祀者應用香華乳酪酥藥為亡追福則有三時春時二月夏時五月秋時九月此中明施鬼神之義雖前述異作異受乃此生作而他生受然不可此人作彼人受但以追荐修福展轉增上則不無益究非此人應得之福即歸彼人受報餓鬼因小有夙命通知悔本過所以平常放焰口之施食原為餓鬼而設故寺院中每日晚課皆有蒙山施食以濟餓鬼如廣東南洋等地方供養觀世音菩薩亦殺豬祀之以此經理衡之即不得福咒願如上疏文之類即以回向於被超荐者伊蘭子為臭樹種子平常以人死為鬼者此不必然以人死後轉生天人修羅鬼地獄畜生之六道未有定準不過有生鬼趣之可能耳尚有中陰身為死後尚未投生他道之一種過渡意生身唯在鬼道及意生身為能感受追荐之益己八雜明施義若人以房舍臥具湯藥園林池井牛羊象馬種種資生布施於他施已命終是人福德隨所施物任用久近福德常生是福追人如影隨形或有説言終已便失是義不然何以故物壞不用二時中失非命盡失若出家人效在家人歲節之日喜飲食者隨世法故非真實也亦信世法出世法故若能隨家所有好惡常樂施者名一切施若以身分及以妻子所重之物施於人者是則名為不思議施若有惡人毀戒怨家不知恩義不信因果強乞索者大勢力人健罵詈者得已瞋恚詐現好相大富貴者施如是等十一種人名不思議施善男子一切布施有三根本施於貧窮以憐愍故施於怨家不求報故施福德人心喜敬故善男子若人多財無量歲中供養三寶雖得無量福德果報不如勸人共和合作若人輕於少物惡物羞不肯施是人增長來世貧苦若人共施財物福田施心俱等是二得果無有差別有財心俱等福田勝者得果報勝有田心俱下財物勝者得果則勝有田財俱下施心勝者得果亦勝有田財俱勝施心下者得果不如如文可解己九施到彼岸善男子智者施時不為果報何以故定知此因必得果故若人無慈不知恩義不貪聖人所有功德惜財身命貪著心重如是之人不能布施智者深觀一切衆生求財物時不惜身命既得財物能捨施人當知是人能捨身命若人慳吝不能捨財當知是人亦惜身命若捨身命求得財物以布施者當知是人是大施主若人得財貪惜不施當知即是未來世中貧窮種子是故我於契經中説四天下中閻浮提人有三事勝一者勇健二者念心三者行淨不見果報能預作因不惜身命求得財已能壞慳吝捨以用施既捨施已心不生悔復能分別福田非福田是名勇健善男子施已生悔因於三事一者於財貪愛二者咨承邪見三者見受者過復有三事一者畏他訶責二者畏財盡受苦三者見他施已受諸衰惱善男子智人三時不生悔心復有三事一者明信因果二者親近善友三者不貪著財信因果者復有二事一者從他聞法二者內自思惟親近善友復有二事一者深信二者智慧不貪著財復有二事一觀無常二不自在善男子施主若能如是觀察如是行施當知是人能具足行檀波羅蜜是故我先説有布施非波羅蜜有波羅蜜非是布施有亦布施亦波羅蜜有非布施非波羅蜜施時不為果報非不信果報正是信果報之極故不須再求所謂但勤耕耘不問收穫文中契經大抵指阿含經而言四天下即東南西北四洲閻浮提乃南洲也己十先教後施善男子智有三種一者能捨外物二者捨內外物三者施內外已兼化衆生云何教化見貧窮者先當語言汝能歸依於三寶不受齋戒不若言能者先授三歸及以齋戒後則施物若言不能復應語言若不能者汝能隨我説一切法無常無我涅槃寂滅不若言能者復當教之教已便施若言我今能説二事唯不能説諸法無我復應語言汝若不能説諸法無我能説諸法是無性不若言能者教已便施若能如是先教後施名大施主善男子若能如是教化衆生及諸怨親無所選擇名大地主善男子智者若有財寶物時應當如是修行布施如其無財復當轉教餘有財者令作是施若餘施主先知此法不須教者應以身力往佐助之此中明先教化而後布施法財並施己十一醫藥施病若窮無物應誦醫方種種咒術求賤湯藥須者施之至心瞻病將養療治勸有財者和合諸藥若丸若散若種種湯既了醫方遍行看病案方診視知病所在隨其病處而為療治療治病時善知方便雖處不淨不生厭心病增知增損時知損復能善知如是食藥能增病苦如是食藥能除病苦病者若求增病食藥應當方便隨宜喻語不得言無若言無者或增苦劇若知定死亦不言死但當教令歸依三寶念佛法僧勤修供養為説病苦皆是往世不善因緣獲是苦報今當懺悔病者聞已或生瞋恚惡口罵詈默不報之亦不捨棄雖復瞻養慎無責恩瘥已猶看恐後勞復若見平復如本健時心應生喜不求恩報如其死已當為殯葬説法慰喻知識眷屬無以增病食藥施人若病瘥已喜心施物便可受之受已轉施餘窮乏者若能如是瞻養治病當知是人是大施主真求無上菩提之道善男子有智之人求菩提時設多財寶亦當讀誦如是醫方作瞻病舍具病所須飲食湯藥以供給之此中明無論貧富均應研究醫藥以治人疾病富者且應施以藥物己十二廣作淨施道路凹迮平治令寬除去刺石糞穢不淨嶮處所須若板若梯若椽若索悉皆施之曠路作井種果樹林修治泉潢無樹木處為畜豎柱負擔息處為作基埵造立客舍具諸所須瓶盆燭燈床臥敷具臭穢流處為作橋磴津濟渡頭施橋船筏不能渡者自往渡之老小羸瘦無筋力者自手攜將而令得過路次作塔種華果樹見怖畏者輒為救藏以物善語誘喻捕者若見行者次至嶮處輒前扶接令得過嶮若見失土破喪之人隨宜給與善言慰喻遠行疲極當為洗浴按摩手足施以床座若無床座以草為敷熱時以扇衣裳作蔭寒時施火衣服溫暖若自為之若教人為販賣市易教令依平無貪小利共相中欺見行路者示道非道道者所謂多饒水草無有賊盜宣説非道多諸患難見人靴履衣裳鉢盂朽故壞者即為縫補浣染熏治有患鼠蛇壁蝨毒蟲能為除遣施人如意摘抓耳鉤縫治浣濯招提僧物謂坐臥具廁上安置淨水澡豆淨灰土等若自造作衣服鉢器先奉上佛并令父母師長和上先一受用然後自服若上佛者以華香贖凡所食噉要先施於沙門梵志然後自食見遠至者軟言問訊施以淨水洗浴身體與油塗足香華楊枝澡豆灰土香油香水蜜毗鉢羅舍勒小衣作塗油者洗已復以種種香華丸藥散藥飲食漿水隨所須施復施剃刀漉水囊等針縷衣衲紙筆墨等若不能常隨齋日施若見盲者自前捉手施杖示道若見有苦亡失財物父母喪歿當以財給善語説法慰喻勸諫善説煩惱福德二果善男子若能修集如是施者名淨施主此中廣作淨施以歷史考之如印度阿育王於國中各處若寺若塔若橋若路若樹若井普遍建設廣作施事在高位者有大勢力即是修惠施大好機會毗鉢羅舍勒係譯音其義無可考大抵為平常應用之物齋日即六齋日或受八戒齋日大淨施主生在人間定為政教領袖故有大富貴之人或發菩提心之人必應種種方便為大施主或以學佛為欲享清間福或為學佛而先以種種不善方法獲財産以圖安享或既學佛之後出而作事反藉為圖利之方便凡此種種其病根在以學佛為自求靜逸而以社會公益之事委之世俗之人而又專以出家人為學佛標準出家人之教人學佛復以出家之法教之然而此皆未合乎大乘佛法之真義丁三結在家難善男子菩薩二種一者在家二者出家出家菩薩為淨施主是不為難在家菩薩為淨施主是乃為難何以故在家之人多惡因緣所纏繞故淨三歸品第二十淨三歸者為清淨受持三歸法在三歸前説施度者以未受三歸時應為樂善好施之人再次第受三歸五戒丙二戒度丁一淨三歸戊一善生問善生言世尊如佛先説有來乞者當先教令受三歸依然後施者何因緣故受三歸依云何名為三歸依也善生早為受三歸者此問蓋為未受三歸衆生而發也戊二如來答己一明三歸依義善男子為破諸苦斷除煩惱受於無上寂滅之樂以是因緣受三歸依如汝所問云何三歸依者善男子謂佛法僧佛者能説壞煩惱因得正解脫法者即是壞煩惱因真實解脫僧者稟受破煩惱因得正解脫或有説言若如是者即是一歸是義不然何以故如來出世及不出世正法常有無分別者如來出已則有分別是故應當別歸依佛如來出世及不出世正法常有無有受者佛弟子衆能稟受故是故應當別歸依僧正道解脫是名為法無師獨覺是名為佛能如法受是名為僧若無三歸云何説有四不壞信得三歸者或有具足或不具足云何具足所謂歸佛法僧不具足者所謂如來歸依於法善男子得三歸者無不具足如比丘比丘尼優婆塞優婆夷戒善男子如佛緣覺聲聞各異是故三寶不得不異云何為異發心時異莊嚴時異得道時異性分各異是故為異何因緣故説佛即法能解是法故名為佛受分別説故名為僧若有説言佛入僧數是義不然何以故佛若入僧則無三寶及三歸依四不壞信善男子菩薩法異佛法亦異菩薩二種一者後身二者修道歸依後身名歸依法歸依修道名歸依僧觀有為法多諸罪過獨處修行得甘露味故名為佛一切無漏無為法界故名為法受持禁戒讀誦解説十二部經故名為僧若有問言如來滅已歸依佛者是何歸依善男子如是歸依名為歸依過去諸佛無學之法如我先教提謂長者汝當歸依未來世僧依過去佛亦復如是福田果報有多少故差別為三若佛在世及涅槃後供養果報無有差別受歸依者亦復如是如佛在世為諸弟子立諸要制佛雖過去有犯之者亦獲罪報歸過去佛亦復如是猶如如來臨涅槃時一切人天為涅槃故多設供養爾時如來未入涅槃猶故在世懸受未來世供養事歸過去佛亦復如是譬如有人父母在遠是人或時瞋罵得罪或時恭敬讚歎得福歸過去佛亦復如是是故我説我若在世及涅槃後所設供養施者受福等無差別苦為三苦八苦苦之因為業業之因為煩惱佛為能説解脫法者法者正為道諦滅諦僧為修法得解脫者或言但須一歸意即歸依法而不必歸依佛僧正為此經佛之所呵四不壞信即信佛法僧戒修道菩薩為初地以上至十地菩薩後身菩薩如前已釋釋尊所説之法現雖流行而釋尊則已過去二千餘年當亦為過去之佛然依大乘佛法則現在仍有十方諸佛己二明三歸次第善男子若男若女若能三説三歸依者名優婆塞名優婆夷一切諸佛雖歸依法法由佛説故得顯現是故先應歸依於佛淨身口意至心念佛念已即離怖畏苦惱是故應當先歸依佛智者深觀如來智慧解脫最勝能説解脫及解脫因能説無上寂靜之處能竭生死苦惱大海威儀庠序三業寂靜是故應當先歸依佛智者深觀生死之法是大苦聚無上正道能永斷之生死之法渴愛飢饉無上甘露味能充足生死之法怖畏嶮難無上正法能除斷之生死錯謬邪僻不正無常見常無我見我無樂見樂不淨見淨無上正法悉能斷除以是因緣應歸依法智者應觀外道徒衆無慚無愧非如法住雖為道行不知正路雖求解脫不得正要雖得世俗微善之法慳吝護惜不能轉説非善行性作善行想佛僧寂靜心多憐愍少欲知足如法而住修於正道得正解脫得已復能轉為人説是故應當次歸依僧念佛名號固為念佛念佛之功德相好亦為念佛不知正要者如求仙之人以為可長生然求得仙果不過壽命較長業報一盡仍應死滅正道即八正道己三明三歸依戒若能禮拜如是三寶來迎去送尊重讚歎如法而住信之不疑是則名為供養三寶若有人能歸三寶已雖不受戒斷一切惡修一切善雖復在家如法而住是亦得名為優婆塞若有説言先不歸依佛法僧寶當知是人不得戒者是義不然何以故如我先説善來比丘是竟未得歸依三寶而其戒律悉得具足或有説言若不具受則不得戒八戒齋法亦復如是是義不然何以故若不具受不得戒者求有優婆塞云何得戒實是得戒但不具足八戒齋法若不具受雖不名齋可得名善善男子若能潔淨身口意業受優婆塞戒是名五陰云何五陰不受邪見不説邪見信受正見説於正見修行正法是名五陰如法而住即如三歸依法而住依通常受戒義須先歸三寶但有善根已熟經佛一呼比丘而即得須陀洹乃至阿羅漢果而具是戒律者此種利根當下即得道共戒不必經三白羯磨具受即全受如五戒須全受等求有優婆塞即求人天福報者不必求佛戒之全部八戒齋為佛戒不過時間較短耳如言如佛畢竟不殺生我某甲一日一夜不殺生八戒齋法不全受則可謂受幾種善法五戒亦可只受一二戒也明身口意為五陰所成則不受邪見如執五陰中有神我常住則為常見又有以血肉之軀一經死亡即永滅者則為斷見但五陰三業若為善則再得善趣五陰為惡則得惡趣五陰己四明三歸得失受三歸已造作癡業受外道法自在天語以是因緣失於三歸若人質直心無慳貪常修慚愧少欲知足是人不久得寂靜身若有造作種種雜業為受樂故修於善事如市易法其心不能憐愍衆生如是之人不得三歸若人為護舍宅身命祠祀諸神是人不名失歸依法若人至心信其能救一切怖畏禮拜外道是人則失三歸依法若聞諸天有曾見佛功德勝己禮拜供養是人不失歸依之法或時禮拜自在天王應如禮拜世間諸王長者貴人耆舊有德如是之人亦復不失歸依之法此明若以佛法僧以外之天神為最高無上之權威者則失三歸否則不失若於因緣和合無我之理作業受報之事不能明了則謂之癡有憐愍心即與佛心相應須有與佛相應之心方得三歸此明在家菩薩可禮拜耳若出家人則一概不應禮拜自在天王及世間諸王長者己五明破邪崇正雖復禮拜所説邪法慎無受之供養天時當起慈心為護身命財物國土人民恐怖所説邪見何故不受智者應觀外道所説云一切物悉是自在天之所作若是自在之所作者我今何故修是善業或説投淵赴火自餓捨命即得離苦此即苦因云何説言得遠離苦一切衆生作善惡業以是業緣自受果報復有説言一切萬物時節星宿自在天作如是邪説我云何受現在造業亦受過去所作業果智者了了知是業果云何説言時節星宿自在作耶若以時節星宿因緣受苦樂者天下多有同時同宿云何復有一人受苦一人受樂一人是男一人是女天阿修羅有同時生同宿生者或有天勝阿修羅負阿修羅勝諸天不如復有諸王同時同宿俱共治政一人失國一則保土諸外道等亦復説言若有惡年惡宿現時當教衆生令修善法以禳卻之若是年宿何得修善而得除滅以是因緣智者云何受於外道邪錯之説善男子一切衆生隨於業行若修正見受於安樂修邪見者受大苦惱因修善業得大自在得自在已衆生親近復為宣説善業因緣善業因緣故得自在一切衆生皆由修善業因緣故得受安樂非年宿也善男子阿闍世王提婆達多皆由造惡業因緣故墮於地獄非因年宿得是報也鬱頭藍弗邪見因緣未來當墮大地獄中善男子一切善法欲為根本是欲因緣得三菩提及解脫果入出家法破本惡業及諸有業能受持戒親近諸佛能一切捨施於乞者能作定性壞惡果報滅大惡罪得決定聚離於三障善能修集壞煩惱道是欲因緣能受三歸因三歸已即能受戒既受戒已行見修道過於聲聞若有畏於師子虎狼惡獸等類歸依於佛尚得解脫況發善心求出世者不得解脫阿那邠坻教告家內在胎之子悉受歸依是胎中子實不成就何以故是法要當口自宣説雖不成就亦能護之善男子諸外道説一切世間皆是自在天之所作亦復説言未來之世過百劫已當有幻出所言幻者即是佛也若自在天能作佛者是佛云何能破歸依自在天義若自在天不能作佛云何説言一切皆是自在天作外道復説大梵天王大自在天毗紐天主悉皆是一復説生處各各別異自在天者名自在天名常名主名有名曰律陀名曰尸婆是一一名各有異事亦求解脫亦即解脫是義不然何以故若自在天能生衆生造作諸有作善惡業及業果報作貪瞋癡繫縛衆生復言衆生得解脫時悉入身中是故解脫是無常法是義不然何以故若無常者云何得名為解脫也如婆羅門子還得壽命是故不得名自在天是三種天亦不得一何以故阿周那人毗紐大天為作解脫以是義故亦不得一若言解脫是無常者當知即幻非佛名幻若能了了正見真我是名解脫復有説言見微塵者是名解脫復有説言見性異我異是名解脫是義不然何以故若能修道見四真諦是人乃得見性見我若人能受三歸依者是人乃能真見四諦是三歸依乃是一切無量善法乃至阿耨多羅三藐三菩提之根本也破邪崇正樂善好施為在家人歸依三寶後之正行禮拜諸天若在家之政府官長社會領袖為息災求雨等類不以為最高無上拜之者則無妨害皈依佛教要義即信佛法僧信業果報明業果報則能明因緣生法皆無自性平等真如之理故真信佛法僧業果報者則不求於外而求之於己若多作善業則可銷除宿罪或制伏之能轉煩惱而不為煩惱轉所謂我為法王於法自在三菩提即三乘菩提定性依佛法有定信性三障即煩惱障業障報障見修道即見道修道阿闍世譯為未生怨提婆達多譯為天授佛世有一龍出家者舍利弗等觀其無善根而不度佛見其夙生被虎迫逼時曾呼一聲歸依佛因度出家亦即證果幻即指魔蓋外道指佛為魔也大梵天即色界第一天大自在天即色界第四天毗紐天即那羅延天之別名力士天也律陀尸婆譯義不明阿周那乃地名此中譯意欠明蓋言阿周那人須要毗紐天為作解脫真我即大涅槃經所説常樂我淨之我即解脫後自在法身數論執冥性與神我和合而成世界若使不和合離而異則得解脫四真諦則苦集滅道己六結在家難行菩薩二種一者在家二者出家出家菩薩淨三歸依是不為難在家修淨是乃為難何以故在家之人多惡因緣所纏繞故八戒齋品第二十一丁二八戒齋戊一善生問善生言世尊若有人能受三歸齋戒是人當得何等果報問意為先受三歸後受八戒齋者當得何報戊二世尊答己一總答善男子若人能受三歸依者當知是人所得福報不可窮盡己二廣答庚一説四喻顯德善男子迦陵伽國有七寶藏名賓伽羅其國人民大小男女於七日中七月七年常以車乘象馬駝驢擔負持去獨不能盡若有至心受三歸齋是人所得功德果報出勝彼藏所有寶物善男子毗提呵國有七寶藏名半陸迦其國人民男女大小於七日中七月七年常以車乘象馬駝驢擔負持去猶不能盡若有至心受三歸齋是人所得功德果報出勝彼藏所有寶物善男子波羅㮈國有七寶藏名曰儴佉其國人民男女大小於七日中七月七年常以車乘象馬駝驢擔負持去亦不能盡若有至心受三歸齋是人所得功德果報出勝彼藏所有寶物善男子乾陀羅國有七寶藏名伊羅鉢多其國人民男女大小於七日中七月七年常以車乘象馬駝驢擔負持去亦不能盡若有至心受三歸齋是人所得功德果報出勝彼藏所有寶物迦陵伽為鳥名此國多出此鳥因以名國賓伽羅此云青目為寶藏之名毗提呵國名也此云勝身半陸迦義為不男此為寶藏名波羅㮈即佛初轉法輪之國譯江繞城儴佉亦一寶藏名乾陀羅在古北印度義為香遍伊羅鉢多原為一象名此中亦寶藏名庚二正受八戒齋善男子若有從他三受三歸三受八戒是名得具一日一夜優婆塞齋明相出時是時則失是故不得佛像邊受要當從人根本清淨受已清淨莊嚴清淨覺觀清淨念心清淨求報清淨是名三歸清淨齋法善男子若能如是清淨歸依受八戒者除五逆罪餘一切罪悉皆消滅如是戒者不得一時二人並受何以故若一時中二人共受何因緣故一人毀犯一人堅持是戒力故後世生時不能造惡受已作罪復不永失若先遣信欲刑戮人信遲未至其人尋後發心受齋當受齋時信至即殺雖復一時以戒力故不得殺罪若諸貴人常敕作惡若欲受齋先當敕語遮先諸惡乃得成就若先不遮輒便受齋者不名得齋欲受齋者先當宣令所屬國境我欲受齋凡是齋日悉斷諸惡罰戮之事若能如是清淨受持八戒齋者是人則得無量果報至無上樂八戒齋有説只能受一日一夜者一日持已再受有説可隨意三五七日等者此蓋為短期出家之行也三受者説三遍庚三明此時受勝彌勒出時百年受齋不如我世一日一夜何以故我時衆生具五濁故是故我為鹿子母説善女若娑羅樹能受八齋是亦得受人天之樂至無上樂善男子是八戒齋即是莊嚴無上菩提之瓔珞也如是齋者既是易作而能獲得無量功德若有易作而不作者是名放逸彌勒出世時世界廣大安樂人壽八萬歲無諸濁惡苦惱鹿子母為佛世有名之優婆夷前已詳述娑羅樹為無知之木譬喻雖愚若草木者受八戒齋亦得至無上樂之果現在有人時至寺廟宿齋誦經即受八戒齋之遺風但惜多不明戒齋之意耳己三結勝善男子菩薩二種一者在家二者出家出家菩薩能教衆生淨八戒齋是不為難在家菩薩教他清淨是乃為難何以故在家之人多惡因緣所纏繞故五戒品第二十二五戒雖戒條比八戒齋少而須終身受故次在八戒齋後丁三五戒戊一善生問善生言世尊何等之人得三歸依何等之人不得三歸以五戒先須受三歸必先得三歸方能淨五戒故從得不得三歸依問起戊二世尊答己一答得歸戒善男子若人信因信果信諦信有得道如是之人則得三歸若人至心信不可敗親近三寶受善友教如是之人則得三歸優婆塞戒亦復如是若能觀是優婆塞戒多有無量功德果報能壞無量弊惡之法衆生無邊受苦亦爾難得人身雖得人身難具諸根雖具諸根難得信心雖得信心難遇善友雖遇善友難得自在雖得自在諸法無常我今若造惡業因是惡業獲得二世身心惡報以是因緣身口意惡即是我怨設三惡業不得惡報現在之惡亦不應作是三惡業現在能生弊惡色等死時生悔以是因緣我受三歸及八齋法遠離一切惡不善業此明從心上得歸戒義也真了因緣果報之人稍起惡業即應自怨自艾生大怖畏慚愧悔除己二分別戒相智者當觀戒有二種一者世戒二者第一義戒若不依於三寶受戒是名世戒是戒不堅如彩色無膠是故我先歸依三寶然後受戒若終身受若一日一夜所謂優婆塞戒八戒齋法夫世戒者不能破壞先諸惡業受三歸戒則能壞之雖作大罪亦不失戒何以故戒力勢故如有二人同共作罪一者受戒二不受戒已受戒者犯則罪重不受戒者犯則罪輕何以故毀佛語故罪有二種一者性重二者遮重是二種罪復有輕重或有人能重罪作輕輕罪作重如鴦掘魔受於世戒伊羅鉢龍受於義戒鴦掘魔羅破於性重不得重罪伊羅鉢龍壞於遮制而得重罪是故有人重罪作輕輕罪作重是故不應以戒同故得果亦同世戒亦有不殺不盜義戒亦有不殺不盜至不飲酒亦復如是如是世戒根本不淨受已不淨莊嚴不淨覺觀不淨念心不淨果報不淨故不得名第一義戒唯名世戒是故我當受於義戒此分別世戒與佛戒相受戒後所作功德大而犯戒其罪亦大故尤應慎之鴦掘魔羅為人名此云指鬘伊羅鉢為龍名義戒即佛第一義戒己三廣讚戒德善男子後世衆生身長八丈壽命滿足八萬四千歲是時受戒復有於今惡世受戒是二所得果報正等何以故三善根平等故或有説言可斷命處乃得戒者是義不然何以故夫禁戒者悉於一切可殺不可殺中得一切可殺不可殺者無量無邊戒之果報亦復如是無量無邊善男子一切施中施無怖畏最為第一是故我説五大施者即是五戒如是五戒能令衆生離五怖畏是五種施易可修行自在無礙不失財物然得無量無邊福德離是五施不能獲得須陀洹果乃至得阿耨多羅三藐三菩提善男子若受戒已當知是人為諸天人恭敬守護得大名稱雖遭惡對心無愁惱衆生親附樂來依止阿那邠坻長者之子雖為八千金錢受戒亦得無量功德果報善男子為財受戒尚得利益況有至心為於解脫而當不得善男子有五善法圍繞是戒常得增長如恆河水何等為五一者慈二者悲三者喜四者忍五者信若人能破殷重邪見心無疑網則具正念莊嚴清淨根本清淨離惡覺觀善男子若人能遠五惡事者是名受戒遠離一切身口意惡若有説言離五戒已度生死者無有是處善男子若人欲度生死大海應當至心受持五戒此明持戒之功德己四別詳戒齋是五戒中四於後世成無作戒唯愛難斷故不得成以是因緣淫欲纏綿應當至心慎無放逸若有説言更有無量極重之法過去諸佛何緣不制而制於酒善男子因於飲酒慚愧心壞於三惡道不生怖畏以是因緣則不能受其餘四戒是故過去諸佛如來制不聽飲若有説言如來已説酒多過失何故不在五戒初説是義不然何以故如是酒戒名為遮重不為性重如來先制性重之戒後制遮重善男子如來先説白黑月中各有三齋隨外道故諸外道輩常以此日供養諸天是故如來説有三齋善男子如因帳窗帳勒故不墮三齋之法亦復如是衆生若有發心受持終不墮於三惡道中善男子有人若欲施時供養三寶時若坐禪時若修善時若讀經時供養父母時當先立制我若不作要自剋罰是人福德日夜增長如恆河流如是五戒有五種果一者無作果二者報果三者餘果四者作果五者解脫果若有具足受持五戒當知是人得是五果若優婆塞常能出至寺廟僧坊到已親近諸比丘等既親近已咨問法味既問法已當至心聽聽已受持憶念不忘能分別義分別義已轉化衆生是名優婆塞自利利他後世即死後再生之一世無作戒從受戒時三説不殺等即熏在阿賴耶識內與思心所相應成無表色或受所引色經此熏入藏識之身口意三業種子勢力即於不知不覺之中受其支配只要無失卻戒體之過犯則戒體於後世亦不失失戒體之相前已詳言例如發願素食後久之於肉食之臭味亦不願近此即誓願熏成種子之勢力若中途開肉食後即失此無作戒體圓覺經言欲界衆生皆以淫欲而正性命若生色界即有定共戒相應所謂定共戒非此五戒也除初地以上菩薩係正念投生外欲界衆生皆由淫欲而有生命故不邪淫於後世不得成就邪淫之戒雖現身能持者多而邪淫之念不起則難須至阿那含果方斷淫欲三齋如未長素者此三日中不食肉已長素者此三日中應過午不食白月自初一至十五黑月自十六至三十白月三齋初八十四十五黑月三齋草三草九卅日自立制約行諸善行止諸惡行為修行最要之法餘果為旁帶之果如不殺生得長壽果為正果而旁帶色力具足之果等為餘果己五法非法住若優婆塞不能習學如是所説輕慢比丘為求過失而往聽法無信敬心奉事外道見其功德深信日月五星諸宿是優婆塞不名堅固如法住也若優婆塞雖不自作五惡之業教人作者是優婆塞非如法住若優婆塞先取他物許為了事是優婆塞非如法住若優婆塞典知官津稅賣估物是優婆塞非如法住若優婆塞計價治病治已賣物是優婆塞非如法住若優婆塞違官私制非如法住若優婆塞自不作惡不教他作心不念惡名如法住若優婆塞因客煩惱所起之罪作已不生慚愧悔心非如法住若優婆塞為身命故作諸惡事非如法住若優婆塞雖得人身行於非法不名為人若得信心能作福德善修正念觀一切法皆是無常無我我所於一切法心無取著見一切法不得自在生滅苦空無有寂靜人身難得雖得人身難具諸根雖具諸根難得正見雖具正見難得信心雖得信心難遇善友雖遇善友難聞正法雖聞正法難得受持能如是觀是名人身若人能觀欲界無常乃至非想非非想處皆悉無常以是因緣不求三惡乃至非想非非想處如是觀已見三不堅以不堅身易於堅身禮拜供養來迎去送自手施與親執福事是名以不堅身易於堅身以不堅財易於堅財能自食用亦以布施供給病瘦行路之人供養沙門婆羅門等貧窮下賤是名以不堅財易於堅財以不堅命易於堅命修於六念慈悲喜捨證四真諦善能觀察生老病死明信善惡業之果報定知恩愛當有別離一切衆生不得自在未得聖道生死力大一切世樂常與苦俱雖復受之心不染著猶如寒月求火自暖雖復為之終不作惡修忍二施以潤衆生深觀苦樂其性平等凡所發言言則柔軟善化衆生令如法住遠離惡友心無放逸飲酒博奕射獵之事悉不為之是名以不堅命易於堅命善男子若得人身多饒財物兼得自在先應供養父母師長和上耆舊持法之人供給遠至初行之人疾病所須言則柔軟多有慚愧不偏信敬有德一人見有賢聖持戒多聞能以舍宅飲食臥具衣服病藥而供養之深信僧中多有功德修習向道得須陀洹果乃至能修向阿羅漢得阿羅漢果修金剛三昧電光三昧觀如是已平等奉施如是施已得無量福是故我於鹿子經中告鹿子母曰雖復請佛及五百阿羅漢猶故不得名請僧福若能僧中施一像似極惡比丘猶得無量福德果報何以故如是比丘雖是惡人無戒多聞不修善法亦能演説三種菩提有因有果亦不誹謗佛法僧寶執持如來無上勝幡正見無謬若供養僧即是供養佛僧二寶若觀佛法功德微妙即是具足供養三寶若人施時不求果報即是供養無上菩提具足成就檀波羅蜜修菩提道能得未來無量功德亦能自利及利益他能修慈悲為破他苦自捨己樂未得菩提心無憂悔雖聞菩提久遠難得而其內心初無退轉為諸衆生無量世中受大苦惱亦不疲厭樂如法行不求世樂樂處寂靜出家修道未得出家雖在家居如解脫人不作衆惡得三種戒戒戒定戒無漏戒依照佛法而行者謂之如法住否則非如法住客煩惱或環境牽連或為前世習氣與其現行心不相應者皆是即非意識上情願之事一切法均是因緣所成剎那生滅故不得自在金剛無漏之身謂之堅身功德法財謂之堅財煩惱業報之命謂之不堅命慈悲慧命謂之堅命此四真諦指苦集滅道言三乘將得極果時皆以能斷微細最後一分煩惱之定謂之金剛三昧在真見道時一剎那如電光一閃謂之電光三昧在欲界未到地定有一剎那之定一現者亦謂之電光三昧戒戒即別解脫戒定戒即定共戒得到禪定能除欲界諸惡如欲界之淫欲瞋恨等得定時自不生起但僅以定力降伏而猶未斷至無漏戒即道共戒則斷滅一切惡法種子己六顯在家難善男子菩薩二種一者在家二者出家出家菩薩如法修行是不為難在家菩薩如法修行是乃為難何以故在家之人多惡因緣所纏繞故尸波羅密品第二十三尸羅此云清涼亦即至善此波羅密到彼岸為大乘而前三品則為三乘共法或五乘共法通人天法丁四尸波羅密戊一善生問善生言世尊云何菩薩趣向菩提其心堅固戊二如來答己一通答堅固四法善男子菩薩堅固具足四法一者受大苦時終不捨離如法之行二者得大自在常修忍辱三者身處貧窮常樂施與四者盛壯之年常樂出家若有菩薩具足四法趣向菩提其心堅固常樂出家不必即是出家即在家而不為五欲所纏常有超脫之志但出家者確以盛壯之年為宜以出家後能以長時具足色力聞思修戒定慧精進成就自他作一切宏法利生之事中國向來多以晚年不能作事時為可出家享清福者此種觀念根本錯誤又有以為一出家即廢為無用之人而一談佛法即以為勸人出家成無用者亦屬誤解故信佛法之人雖多而正行者仍少己二別明戒為根本庚一顯戒持犯得失菩薩具足如是四法復作是念是菩提道初根本地名之為戒如是戒者亦名初地亦名導地亦名平地亦名等地亦名慈地亦名悲地亦名佛迹亦名一切功德根本亦名福田以是因緣智者應當受持不毀復次智者又作是念戒有二果一諸天樂二菩提樂智者應當求菩提樂不求天樂若受戒已所不應作而故作之所不應思而故思惟懈怠懶惰樂於睡眠念惡覺觀邪命惡願是名汙戒若受戒已心生悔恨求人天樂多諸放逸不生憐愍是名汙戒若畏貧窮若為恐怖若為失財若畏作役若為身命若為利養若為愛心而受禁戒既受戒已心生疑惑是名汙戒善男子若人不樂久處生死深見過罪觀人天樂阿鼻獄苦平等無差憐愍衆生具足正念為欲利益無量衆生使得成道為具無上菩提道故為如法行故受持是戒心不放逸能觀過去未來現在身口意業知輕知重凡所作事先當繫心修不放逸作已作時亦復如是修不放逸若先不知作已得罪若失念心亦得犯罪若客煩惱時暫起者亦得犯罪若小放逸亦得犯罪是人常觀犯輕如重觀已生悔及慚愧心怖畏愁惱心不樂之至心懺悔既懺悔已心生歡喜慎護受持更不敢犯是名淨戒在佛法信解行證中行之第一步即為持戒地者為所依能持之義如地能為草木山河所依而能任持草木山河是依邪法而活生命者謂之邪命受戒動機如不清淨若在受戒後能深心信解不生疑惑則仍不失為持戒清淨也庚二為自為世為法善男子有智之人既受戒已當觀三事不作惡行一者自為二者為世三者為法云何自為我自證知此是惡事知作惡業得如是果知作善業得如是果所作惡業無有虛妄決定還得諸惡之果所作善業亦無虛妄決定還得諸善之果若是二業無虛妄者我今云何而自欺誑以是因緣我受戒已不應毀犯當至心持是名自為云何為世有智者觀見世間之人有得清淨天耳天眼及他心智我若作惡是人必當見聞知我若見聞知我當云何不生慚愧而作惡耶復觀諸天具足無量福德神足天耳天眼具他心智遙能見聞雖近於人人不能見若我作惡如是等天當見聞知若是天等了了見我我當云何不生慚愧故作罪耶是名為世云何為法有智之人觀如來法清淨無染得現在利能令寂靜度於彼岸能作解脫不選時節我為是法故受持戒我若不能先受小制云何能得受大制耶破小制已增五有苦若至心持增無上樂我受身來所以未得證解脫者實由不從過去無量諸佛如來受禁戒故我今受戒未來定當值遇恆河沙等諸佛深觀是已生大憐愍至心受戒受已堅持為阿耨多羅三藐三菩提利益無量諸衆生故此間禪定及諸天鬼神均可有天眼天耳他心宿命神境之五通得阿羅漢果者乃至佛並加漏盡古時有入禪定者聞附近有若牛鬥之聲起而細察之則為螞蟻鬥此不過天耳通之發端真天耳最細最遠之聲亦能聞天眼通不必以目見即閉目亦能見最小最遠者且能障壁而見及見未來之事他心通則他人起心皆能知之神足通又謂神境通亦謂變化如意通往來隱現一切無礙五有即五趣庚三持戒到於彼岸善男子若在家若出家若三歸若八齋若五戒若具足若不具足若一日一夜若一時一念若盡形壽至心受持當知是人得大福德善男子若受戒已修三善業多聞布施修定修善供養三寶是則名為莊嚴菩提若受戒已能讀如來十二部經是名無上大法之藏勤加精進欲得具足尸波羅蜜如是戒者今世受已後雖不受成無作戒善男子有戒非波羅蜜有波羅蜜非戒有戒有波羅蜜有非戒非波羅蜜是戒非波羅蜜者所謂聲聞辟支佛戒是波羅蜜非是戒者所謂檀波羅蜜是戒是波羅蜜者如昔菩薩受瞿陀身時為諸蟲獸及諸蟻子之所唼食身不傾動不生惡心亦如仙人為衆生故十二年中青雀處頂不起不動非戒非波羅蜜者如世俗施三善業一多聞二布施三修定此中係菩薩戒與通常五戒不同通途五戒盡形壽而已後世須再受菩薩戒至後世亦不失壞如昔菩薩者即釋尊在菩薩位時庚四正明持戒諸相善男子菩薩摩訶薩住尸波羅蜜時所受衆苦誰能説之有人若受小小戒已少欲知足不能憐愍諸苦衆生當知是人不能具足尸波羅蜜若能修忍三昧智慧勤行精進樂於多聞當知是人則能增長尸波羅蜜莊嚴菩提證菩提果如是戒者無量衆善故無量果報故無量戒禁故以是因緣莊嚴菩提善男子菩薩摩訶薩既受戒已口不説惡耳不樂聞不樂説世亦不樂聞終不放心在惡覺觀不親惡友是故得名寂靜淨戒菩薩若見破戒惡人不生惡心為設種種善巧方便而調伏之若不調伏當生憐愍不為身命破戒捨戒食已先修慚愧之心不放逸心為治身命如療惡瘡若入村落如刀刺林攝護諸根修集正念觀察可作及不可作不生放逸若人作福亦因於我若人作罪亦因於我是故我得大供養時不應生喜得衰苦時不應生瞋得少供養應作是念我今信戒施聞智慧如法住少故得如是微少供養是故我今不應生於愁苦之念我為二事受他信施一者為增他福二者為增自善是故若得少物惡物不應生惱久住遲得輕罵已得爾時復當自責其身是我宿罪非衆生過是故我今不應生惱若受戒已為他作罪亦應説言如是所作實非是道何以故十二部經不説諸惡為菩提道是故我今獲得雜報若能如是深觀察者當知是人則能具足尸波羅蜜善男子若有人能攝護諸根身四威儀不作諸惡能堪衆苦不作邪命當知是人則能具足尸波羅蜜若於輕重戒中等生怖畏雖遭惡時不犯小戒不令煩惱穢汙其心修集忍辱當知是人則能具足尸波羅蜜若離惡友令諸衆生遠惡邪見知恩報恩當知是人則能具足尸波羅蜜若為善事不惜身命罷散自事營成他事見罵詈者不生惡心當知是人則能具足尸波羅蜜若見如來所開之處如本持之護衆生命不惜財命乃至命終不犯小戒雖得微妙七珍之物心不生貪不為報恩以善加人為憐愍故受持禁戒既受持已善發大願願諸衆生悉得淨戒當知是人則能具足尸波羅蜜此明修一度必兼備五度方能到一度之究竟菩薩或有為衆生而捨戒者然非為自己也雜報即善中有惡之報受持戒不發誓願求無上菩提則僅能得人天小果己三結成在家難勝善男子菩薩二種一者在家二者出家出家菩薩具尸波羅蜜是不為難在家具足是乃為難何以故在家之人多惡因緣所纏繞故業品第二十四丁五十善戊一善生問善生言世尊諸佛如來未出世時菩薩摩訶薩以何為戒菩薩摩訶薩即大菩薩出無佛法時以何為戒戊二如來答己一略明十善源流善男子佛未出世是時無有三歸依戒唯有智人求菩提道修十善法是十善法除佛無能分別説者過去佛説流轉至今無有漏失智者受行善男子衆生不能受持修集十善法者皆由過去不能親近咨承佛故十善法亦是戒亦不是戒就佛説瓔珞經受者為戒無佛法時則為非戒如佛法未來中國時亦有與五戒相似之仁義禮智信等此一善法若通三世因果除佛無能詳細説者十善者身三不殺不盜不淫口四不妄語不兩舌不惡口不綺語意三不貪不瞋不癡溯十善法之源乃皆從佛流出佛法能包括一切世間宗教而超出一切世間宗教通常五戒十善已屬甚難然而超過五戒十善之四禪四空定仍為世間之善必能清淨菩薩諸戒方為究竟己二廣説十善法義庚一開示業果勸修善男子一切衆生皆有雜心雜心因緣有雜煩惱雜煩惱故造作雜業雜業因緣受於雜有雜有因緣受於雜身善男子一切衆生得雜身已見於雜色見雜色已生惡思惟是惡思惟名為無明無明因緣生於求心名之為愛因愛所作名之為業是業因緣獲得果報有智之人能破析之由內煩惱外有因緣則能繫縛修十善已則能解之是故如來初得阿耨多羅三藐三菩提時分別演説十善之法因十善故世間則有善行惡行善友惡友乃至解脫是故衆生應當至心分別體解十善之道若有風雲為持大水阿修羅宮大地大山餓鬼畜生地獄四天王處乃至他化自在天處悉因衆生十善道故轉輪聖王所有四輪金銀銅鐵七衆受戒求三菩提亦因十善業因緣故是十善業道因緣故一切衆生內外之物色之與命皆有增減是故智者應當具足修十善道雜者善惡無記混雜之謂無明者不明業果事理之謂求心即有我見在中故名之為愛此中愛含有取因愛所作之業即六道之生死業所得果亦為六道之生死果六根所觸之色聲香味觸法即外有佛從成道以後所説之法皆係十善之法即華嚴經亦係説十善業果之增長推廣者耳今人多有好高騖遠而輕十善者不知十善之法能至究竟即成為佛風大即風輪風輪之上有水水下有阿修羅宮金輪王能化四天下銀銅鐵王以次能化三二一天下佛法最根本最普遍者為業果之理一切佛法無非此理開合明得此業果之理則豎窮三際橫遍十方一切事理無不明了而自然發起無上菩提之心若學佛人不明業果之理則必墮外道及世間惡法之中庚二分別善惡令持若諸衆生少壯老時春秋冬夏所起煩惱各各別異小中大劫所起煩惱亦復如是各各別異衆生初修十善業時得無量命色香味具因貪瞋癡一切皆失是十惡業道因緣故時節年歲星辰日月四大變異若人能觀如是事者當知是人能得解脫衆生皆由苦因緣故則生信心既得信心能觀善惡如是觀已修十善法意行十處故名十道身三道者謂殺盜淫口四道者惡口妄語兩舌無義語心三道者妒瞋邪見是十惡業悉是一切衆罪根本若諸衆生異界異有異生異色異命異名以是因緣應名無量不但有十如是十事三名為業不名為道身口七事亦業亦道是故名十是十業道自作他作自他共作從是而得善惡二果亦是衆生善惡因緣是故智者尚不應念況身故作若人令業煩惱諸結得自在者當知即是行十惡道若有能壞煩惱諸結不令自在是人即是行十善道若人始設方便若先不思惟當時卒作是人不得業所攝罪是故智者應當勤修十善業道證四真諦亦復如是作期為惡若失期者亦不得罪是故智者應修十善因是十善衆生修已增長壽命及內外物煩惱因緣故十惡業增無煩惱因緣故十善業增世界初成衆生皆因修十善而生所以色香味均具足十善法又謂之十善業道即十條善路十惡業即十條惡路為意所行之處故謂意行十處在欲界中有陰陽性故有淫欲在色界中無陰陽性則無淫欲中國古代有以一陰一陽之道講明萬有者其實陰陽性只能解釋欲界而不能説明色無色界今日之辨證法謂由矛盾而調和由調和而矛盾以説明變化其實亦只能解釋欲界而不能説明色無色界至無色界并物質而亦無之故至色界以上則殺盜淫皆自無矣惡口謂罵詈等妄語謂説不實之語兩舌則為挑撥是非無義語即綺語無實義者妒即貪心瞋即瞋恚邪見即謗佛法僧等不正之見妒瞋邪見為業不為道身三口四為業亦為道為善為惡必須意識分明若不具意識則不得罪若知心能造一切善惡而創一切宇宙萬有則宇宙在吾身萬物在吾手矣庚三説十不善業相辛一正説十不善業善男子是十業道一一事中各有三事一者根本二者方便三者成已根本者若有他想有衆生想若以疑心斷其命根若動身作相或口説殺是名根本求刀磨利買毒作索是名方便殺已手觸稱量捉持若自食噉若與人食得物用度任意施與歡喜受樂無有慚愧心不悔恨自讚其身生大憍慢是名成已是他財有亦作他想若自往取若遣人取若以疑心移置異處是名根本若壞垣墻咨問計數置梯緣墻入舍求覓乃至手觸是名方便若得物已負擔藏隱任意施與賣用賜遺歡喜受樂無有慚愧心不悔恨自讚其身生大憍慢是名成已若是婦女繫屬他人起於他想若以疑心作非梵行是名根本若遣使往若自眼見若與信物若以手觸若軟細語是名方便若事已竟遺以瓔珞共坐飲食歡喜受樂無有慚愧心不悔恨自讚其身生大憍慢是名成已若於大衆捨離本相若於三時若二時中虛妄説之是名根本若於先時次第莊嚴搆言語端或受他語起往彼説是名方便若事成已受取財物任意施與歡喜受樂無有慚愧不生悔恨自讚其身生大憍慢是名成已是妄語中雜有兩舌能壞和合是名根本若説他過及餘惡事言和合者必有不可若離壞者則有好事是名方便和合既離受他財物任意施與歡喜受樂無有慚愧不生悔恨自讚其身生大憍慢是名成已若變容色惡口罵詈是名根本若聞他罪莊嚴辭章起去到彼欲説是惡是名方便若罵詈已還受他物任意施與歡喜受樂無有慚愧不生悔恨自讚其身生大憍慢是名成已若説欲事非時之言是名根本若歌若頌無義章句隨人所熹造作百端是名方便若教他已還受財物任意施與歡喜受樂無有慚愧不生悔恨自讚其身生大憍慢是名成已於他財物生貪欲得是名根本發煩惱心是名方便作已得財任意施與歡喜受樂復向餘説無有慚愧不生悔恨自讚其身生大憍慢是名成已若打罵人是名根本若捉杖石問其過罪是名方便打已生喜受取財物任意施與歡喜受樂無有慚愧不生悔恨自讚其身生大憍慢是名成已若誹謗業因果真諦賢聖之人是名根本若讀誦書寫信受邪書讚歎稱譽是名方便受已向他分別演説增其邪見受取財物任意施與歡喜受樂無有慚愧不生悔恨自讚其身生大憍慢是名成已此中邪淫係以優婆塞為中心而説故説若是婦女云云若係優婆夷則對方即為男子其理通也聖賢皆修行階級上之分別如小乘七方便為賢證四聖果為聖大乘十住十行十回向即為三賢十地為十聖辛二分別復單輕重或復有人於十業道一時作二妄語兩舌或一時三所謂妄語兩舌惡口又復有三所謂邪見惡口妄語如是説者即是無義是名為四瞋之與貪不得一時其餘八事可得一時云何一時六處遣使自作二事一者淫他妻婦二者謂無業果先作期要一時得業是十惡業或得作色無無作色或有作色及無作色若無方便及成已者則得作色無無作色若有莊嚴及成已者則得作色及無作色是十業道有輕有重若殺父母及辟支佛偷三寶物於所生母及羅漢尼作非梵行妄語壞僧是名為重無作色係熏於心內之有力種子有作色即表現於外之行為辛三示從貪瞋癡起善男子是十業道各有三種一從貪生二從瞋生三從癡生若為貪利故害命者是名從貪若殺怨家是名從瞋殺父母者是名從癡劫盜他財亦復三種自為己身妻子眷屬貪他財物而往劫奪是名從貪盜怨家物是名從瞋劫奪下姓是名從癡邪淫亦三若為自樂行非梵行是名從貪淫怨眷屬是名從瞋於所生母作非梵行是名從癡妄語三種若為財利自受快樂是名從貪為壞怨故是名從瞋若畏他死是名從癡兩舌三種為財利故是名從貪為壞怨故是名從瞋破壞和合邪見之衆是名從癡惡口三種為財利故罵詈婦兒是名從貪故向怨家説所惡事是名從瞋説他往昔先人過罪是名從癡無義語亦三種若為歡樂歌叫喧譁是名從貪為勝他故歌叫喧譁是名從瞋為增邪見歌叫喧譁是名從癡從貪生者是名為妒從瞋生者是名為恚從癡生者是名邪見此明十惡業皆由貪瞋癡起如通常懺悔偈中有往昔所作諸惡業皆由無始貪瞋癡句所以貪瞋癡謂之三不善根又謂之三毒辛四止十惡修十善修十善已一一事中得三解脫是十惡業決定當得地獄果報或有餓鬼或有畜生餘果則得人中短命貧窮乏財婦不貞廉有所言説人不信受無有親厚常被誹謗耳初不聞善好之言能令外物四大衰微無有真實惡非暴雨爛臭敗壞土地不平無有七寶多有石沙荊棘惡刺時節轉變無有常定果蓏少實味不具足若欲破壞如是等事應當至心修行十善是十善法三天下具或有戒攝或非戒攝北鬱單曰唯有四事地獄有五餓鬼畜生天中具十非戒所攝欲界六天無有方便唯有根本成已二事三天下即東西南三洲從佛法受戒者為戒攝不從佛法受戒者則非戒攝如孔子等教化世間善法之類北洲則自然享受其前世所修善業之福報衣食天然而不知修十善唯自然無殺盜邪淫妄語之四事地獄則受其前惡業苦報在地獄時以苦盛故不暇造惡五事雖無明文以理推之而殺盜淫妄貪之五事為地獄所無也欲界六天亦係享受前世修善業之福報所以無方便之設施辛五就殺廣辨業道夫業道者一念中得如其殺者可殺俱死是則不得根本業果若作莊嚴事竟不成唯得方便不得根本作莊嚴已便得殺者得根本罪如其殺已不追成已無無作罪若殺者一念中死可殺之者次後念死殺者不得根本業罪若遣使殺使得作罪口敕之者得作無作罪若惡口敕亦得作罪及無作罪若其殺已心善無記亦得作罪及無作罪若有説言過去已滅未來未生現在無住云何名殺一念不殺微塵不壞若一不殺多亦不能云何言殺是義不然何以故雖復現在一念不殺能遮未來使不起故故得名殺以是義故不可以見一處無殺舉一切處悉便無殺有人刺手則便命終或有截足而命全者頭則不爾刺截俱死若有作已得大罪者是名業道三業自得七業自他若無作者亦無無作或有説言身業三事有作無作口不如是是義不然何以故若口無作無無作者口敕殺已不應得罪是故口業亦應有作及以無作心則不爾何以故賢聖之人不得罪故何因緣故名作無作是業墮於三惡道故生於人中壽命短故所有六入常受苦故餘果相似根本正果或有相似或不相似受果報時在活地獄黑繩地獄餓鬼畜生人中三處受於餘果若於一人作殺莊嚴作莊嚴已有二人死當知唯於本所為人得作無作若有説言色是無記命亦無記如是無記云何殺已而得殺罪是義不然何以故如是身命是善惡心器若壞是器遮於未來善惡心故是故得罪若王敕殺侍臣稱善是王與臣罪無差別獵亦如是若有垂終其命餘殘有一念在若下刀殺是得殺罪若命已盡而下刀者不得殺罪若先作意規欲撾打然下手時彼便命終不得殺罪若作毒藥與懷妊者若破歌羅邏是人則得作無作罪若自刑者不得殺罪何以故不起他想故無瞋恚心故非他自因緣故或有説言若心在善不善無記悉得殺罪猶如火毒雖復善心不善無記觸食之者悉皆死者是義不然何以故世間有人捉火不燒食毒不死非惡心殺亦復如是不得殺罪如諸醫等或有説言婆藪仙人説咒殺人殺羊祀天不得殺罪是義不然何以故斷他命故癡因緣故若見人死心生歡喜當知是人得成已罪見他殺已心生歡喜出財賞之亦復如是若使他殺受使之人到已更以種種苦毒而殺戮之口敕之者唯得作罪受使之人兼得二罪作以無作或執佛法明空之説以為從析空觀或體空觀觀之殺之事亦無所有此説不然雖現在一念不成殺而能使所殺者次念之五陰不能相續仍成殺事惡業謂之道者以作惡業而至三惡趣中是由惡業成入惡趣之道路故三業自得謂意三七業自他謂身三口四意三業不成道者以賢聖之人持戒重在身口故不得罪三處受於餘果者即東南西三洲以北洲無苦報故身命是善惡心之器具殺壞身命則心不能相續故應得罪歌羅邏即胎兒初位辛六就餘總略分別若發惡心奪取他物是人亦得作無作罪若數時取若寄時取因市易取亦得偷罪若自不取不貪不用教他令取是人亦得作無作罪若欲偷金取時得銀出外識已還置本處是人不得偷盜之罪若欲偷金得已即念無常之想心生悔恨欲還本主而復畏之設餘方便還所偷物雖離本處不得偷罪奴僕財産先悉生意與主同共後生貪想輒取主物取已生疑而便藏避復思是物同共無異雖離本處不得偷罪若人行路為賊所劫既至村落村主問言汝失何物我當償之若説過所失取他物者是得偷罪若有發心施他二衣受者取一云不須二輒還留者是得偷罪若人發心欲以房舍臥具醫藥資生所須施一比丘未與之間更聞他方有大德來輒回施之是得偷罪若取命過比丘財物誰邊得罪若羯磨已從羯磨僧得若未羯磨從十方僧得若臨終時隨所與處因之得罪若偷佛物從守塔人主邊得罪若暴水漂財物穀米果蓏衣服資生之物取不得罪若於非時非處非女處女他婦若屬自身是名邪淫唯三天下有邪淫罪鬱單曰無若畜生若破壞若屬僧若繫獄若亡逃若師婦若出家人近如是人名為邪淫出家之人無所繫屬從誰得罪從其親屬王所得罪惡時亂時虐王出時怖畏之時若令婦妾出家剃髮還近之者是得淫罪若到三道是得淫罪若自若他在於道邊塔邊祠邊大會之處作非梵行得邪淫罪若為父母兄弟國王之所守護或先與他期或先許他或先受財或先受請木泥畫像及以死尸如是人邊作非梵行得邪淫罪若屬自身而作他想屬他之人而作自想亦名邪淫如是邪淫亦有輕重從重煩惱則得重罪從輕煩惱則得輕罪若有疑心若無疑心若見若聞若覺若知若問不問異本説者是名妄語若言不本見聞覺知亦是妄語不名具足若破相説無覆藏相是非妄語若異音説前人不解亦是妄語不名具足若顛倒語若發大聲不了了語若有所説前人不解亦是妄語不名具足兩舌惡口若壞前人不壞前人作已得罪無義語亦復如是如是七事亦道亦業其餘三事是業非道何以故自不行故妨於自他得大罪故此就殺外餘惡業加以總略分別庚四證成作無作義或有説言一切微塵次第而住亦念念滅滅已無住若無住者尚無有作況有無作是義不然何以故世間之法有因有果無因無果如面水鏡則有像現離面無像作亦如是從身有作從是作法則出無作如面水鏡則有像現譬如有人發惡心故則惡色現發善心故則善色現作以無作亦復如是若因善業得善妙色若因惡業得粗惡色作以無作亦復如是若以念念常滅無有作無作者如先所説燈河等喻雖念念滅以二諦故説作無作微塵雖復次第不住亦復不破世諦法也正以微塵次第得名父母羅漢其有殺者得無量罪父母羅漢及以他人陰界入等等無差別所以得重以是福田報恩田故如説二字不得一時然此二字終不和合義不可説雖念念滅亦名妄語不破世諦猶如射箭雖念念滅因於身業微塵力故到不到處作以無作亦復如是如舞獨樂雖念念滅因於身業微塵力故而能動轉作以無作亦復如是如旋火輪雖念念滅因於身業微塵力故火得圓匝初發心異方便心異作時心異説時心異衆緣和合故得名作以作因緣生於無作如威儀異其心亦異不可得壞故名無作從此作法得無作已心雖在善不善無記所作諸業無有漏失故名無作若身作善口作不善當知是人獲得雜果若身善業有作無作口不善業唯有有作無有無作當知是人唯得善果不得惡果是故經中説七種業有作無作如人重病要須衆藥和合治之若少一種則不能治何以故其病重故一切衆生亦復如是具諸惡故要須衆戒然後治之若少一戒則不能治此引執空而撥無因果者破其不明真俗二諦也以真諦言雖自性本空而就俗諦言則相續不斷故説二字不得一時者如説因果二字説因字時果字未説説果字時因字已滅然因果二字若不和合則因果之義不成此明相續不斷之俗諦義庚五辨明惡戒勸離善男子衆生作罪凡有二種一者惡戒二者無戒惡戒之人雖殺一羊及不殺時常得殺罪何以故先發誓故無戒之人雖殺千口殺時得罪不殺不得何以故不發誓故是故一切善不善法心為根本因根本故説諸比丘犯有二種一者身犯二者口犯無心犯也如是戒者時不具足支不具足則不得戒譬如鑽火有燧有力有乾糞草然後得火若少一法則不得火戒法亦爾如是戒者若得若捨若持若毀皆隨於心如來了了知諸法性是故制之若復有人因於善業思惟力故不造諸惡名如法戒若從他得名為受戒若離受戒有功德者一切惡獸師子虎狼應得功德然實不得以是因緣受善戒者得無量福受惡戒者得無量罪是故經中説惡律儀一者畜羊二者畜雞三者畜豬四者釣魚五者網魚六者殺牛七者獄卒八畜獵狗九作張弶十作獵師十一咒龍十二殺人十三作賊十四兩舌十五以苦鞭韃枷鎖押額鐵釘燒炙加人國王大臣受寄抵謾不知恩者惡性惡心大惡村主典稅物者毀戒比丘心無慚愧如是之人皆無戒也雖復不名不善業道而得大罪何以故盡壽作故如是等事若不立誓不從人受則不成就如是惡戒四時中捨一者得二根時二者捨壽命時三者受善戒時四者斷欲結時受惡戒人如受殺羊戒者誓言見羊必殺雖不殺時亦得無作殺罪其他惡戒亦復如是惡律儀多各以其事為終身職業而結為團體入團體時必教發誓作惡故謂為受惡戒庚六明受戒得戒相或有説言如善戒具足惡戒亦爾是義不然何以故惡戒易得故一因緣得故所謂立誓善戒不爾有五方便所謂五根是故難得以難得故要須具足若有説言優婆塞戒無無義語兩舌惡口是故優婆塞戒八戒齋法沙彌比丘不具足得是義不然何以故我今受持淨口業故若有説言我受五戒淨身口意心若不淨當知是人不得具戒譬如有人受惡戒已雖不殺生是人常有惡戒成就毀禁比丘亦復如是何以故受持戒已一一戒邊多業多果故衆生無量戒亦無量物無量故戒亦無量是善惡戒俱有三種謂上中下若不受惡戒雖多作罪不名惡戒若有難言何緣五戒盡形壽受八戒齋法一日一夜當言如來善知法相通達無礙作如是説以人作惡易而作善難所謂人之行善如逆水行舟必須具信解念定慧五根方能得戒八戒齋法只一日一夜受者乃如來之方便以終身受極難能故庚七別辨五逆罪相善男子世間福田凡有二種一功德田二報恩田壞此二田名五逆罪是五逆罪有三因緣一者有極惡心二者不識福德三者不見正果若人異想殺阿羅漢不得逆罪父母亦爾若無慚愧不觀報恩心無恭敬但作方便不作根本雖非逆罪亦得大報善教授故生憐愛故能堪忍故能作作故受大苦故是故父母名報恩田若復有人殺父母已雖復修善是善無報是故我説人所蔭處乃至少時慎勿毀折枝條華果善男子我涅槃後有諸弟子當作是説若以異想異名殺父母不得逆罪即曇無德或復説言雖以異想殺於父母故得逆罪即彌沙塞或復有説異想異名殺於父母俱得逆罪即薩婆多何以故世間真實是可信故父母真實想亦不轉惡心殺之即得逆罪實是父母無父母想不發惡心父母雖死不得逆罪何以故具足四事乃得逆罪一者實是父母作父母想二者惡心三者捨心四者作衆生想具是四事逆罪成就若不具者則不成就若為憐愍故若為恭敬故若為受法故若為怖畏故若為名稱故授與死具雖不手殺亦得逆罪若為他使令殺父母啼哭憂愁而為之者如是罪相初中後輕欲殺父母誤中他人不得逆罪欲殺他人誤中父母亦復如是欲殺母時誤殺相似殺已藏刀復中母身不得逆罪母有異見兒有異殺但得殺罪不得逆罪是五逆罪殺父則輕殺母則重殺羅漢重於殺母出佛身血重殺羅漢破僧復重出佛身血有物重意輕有物輕意重有物重意重有物輕意輕物重意輕者如無惡心殺於父母物輕意重者如以惡心殺於畜生物重意重者以極惡心殺所生母物輕意輕者如以輕心殺於畜生如是惡業有方便重根本成已輕有方便根本輕成已重有方便根本重成已輕有根本輕方便成已重曇無德即四分律開祖之法藏尊者彌沙塞即五分律部薩婆多即一切有部律部母為育兒比父為苦故殺母者比殺父為重羅漢為世福田故殺之者比殺母為更重佛為人天師無能殺之者但可破出身血僧衆為住持佛法者故破之者比出佛身血為尤重庚八辨得報定不定物是一種以心力故得輕重果善男子有人以食欲施於我未與我間轉施餓狗我亦稱讚如是人者是大施主若是福田若非福田心不選擇而施與者是人獲得無量福德何以故心善淨故是業四種一者現報二者生報三者後報四者無報業有四種一者時定果報不定二者報定時不必定三者時定果報亦定四者時果二俱不定時定者所謂現在次生後世若時不定果報不定是業可轉若果報定應後受者是業可轉現在受之何以故善心智慧因緣力故惡果定者亦可轉輕何因緣故名果報定常作無悔故專心作故樂善作故立誓願故作已歡喜故是故是業得果報定除是之外悉名不定衆生行業有輕有重有遠有近隨其因緣先後受之如有修身修戒修心修慧定知善惡當有果報是人能轉重業為輕輕者不受若遭福田遇善知識修道修善是人能轉後世重罪現世輕受若人具有欲界諸業得阿那含果能轉後業現在受之阿羅漢果亦復如是善男子智者若能修身修戒修心修慧是人能壞極重之業如阿伽陀咒及除毒寶破壞惡毒若作小罪初方便輕後成已重是人不修身戒心慧令輕作重衆生若作一種二種乃至種種有作不具足有作具足先念後作名作具足先不生念直造作者名作不具足復有作已不具足者謂作業已果報不定復有作已亦具足者謂作業已定當得報復有作已不具足者果報雖定時節不定復有作已亦具足者時報俱定復有作已不具足者持戒正見復有作已亦具足者毀戒邪見復有作已不具足者信因信果復有作已亦具足者不信因果復有作已不具足者作惡之時有善圍繞復有作已亦具足者作惡之時惡來圍繞復有作已不具足者雖作衆惡人中受報復有作已亦具足者人中作惡地獄受報復有作已不具足者有正念心復有作已亦具足者無有念心復有作已不具足者三時生悔復有作已亦具足者三時不悔如惡善亦如是因是作已亦具足故作小得大作大得小佛以有德之人供養者多而無德之衆生則供養者少甚可憐愍故以施佛之食施畜生者即讚其福德無量阿伽陀為無病不治之如意藥除毒寶為金翅鳥心所作能破壞諸惡毒以譬能修戒定慧者能破除諸惡也至受報之早遲大約輕惡可於現世受若作重惡則此身難受必到後受之庚九顯由意成形義一意摸身身既成就有無量意摸身初意即是善也身既成就得二種果雜善不善如人天亦如是地獄衆生惡意摸身身既成已一向不善餓鬼畜生亦惡意摸身身既成已雜善不善善惡中陰以善惡摸身身既成已俱得雜報善以不善歌羅邏時乃至老時亦得雜報善以不善是故經説有四種業黑業黑報白業白報雜業雜報不黑不白是業無報黑業黑報所謂地獄白業白報所謂色天雜業雜報所謂欲天人中畜生餓鬼不白不黑無報所謂無漏善男子若人不解如是業緣無量世中流轉生死何以故不解如是業因緣者雖生非想非非想處壽八萬劫福盡還墮三惡道故善男子一切摸畫無勝於意意畫煩惱煩惱畫業業則畫身貪因緣故色聲妙好威儀庠序瞋因緣故色聲粗惡威儀卒暴如瞋癡亦如是此明由意識業而成各報身形體之義也摸身初意是善係指人身而言意業有二種一者引業二者滿業引業力強唯在意識能引得一期之身命果報故八識規矩頌頌第六識言引滿能招業力牽蓋由一意業可為引受一期報身之模型身模成後復能起無量意世謂天命之謂性天命即是此模型之意業性善之説於此亦可通也以天即前生意業引人身者比較為善故云初意為善是善業果故性是善但於身既成後仍雜起善不善之業故不盡善天道與人相同地獄惡意模身身成後則一向純惡餓鬼畜生雖惡意模身而身成後則雜善不善中陰身常人或誤為鬼或靈魂以人死為鬼也然此中陰身並不同所謂魂靈或鬼乃此報身死後應得之彼報身尚須待時在此過渡中由意業新模五陰所成不過中陰身為微細五陰與餓鬼身略同亦謂之意生身雖人天等報身皆可謂之意生身而中陰身與餓鬼身時可隨意變化斯為意生之身事甚明顯模畫謂模型繪畫之意華嚴經言心如工畫師畫種種世間於一切五陰無形而不畫模畫莫勝於意之相應煩惱雖前五識相應煩惱亦能模畫而以意識為主前五不過相隨而已所謂應觀法界性一切唯心造之理此中已略明之庚十明諸戒得捨相無量世界一百三十六地獄處無量畜生無量餓鬼皆因業作人天亦爾無量衆生獲得解脫亦因於業善男子是十善道有三事一者能遮煩惱二者能作善心三者能增長戒如除毒藥凡有三種一者阿伽陀藥二者神咒三者真實若人善修不放逸行具足正念分別善惡當知是人決定能修十善業道若多放逸無有慚愧及以信心當知是人決定能作十不善業道是十業道復有三事一者方便二者根本三者成已若復有人能勤於禮拜供養父母師長和上有德之人先意問訊言則柔軟是名方便若作已竟能修念心歡喜不悔是名成已作時專著是名根本善男子是十業道復有三種謂上中下或方便上根本中成已下或方便中根本下成已上或方便下根本上成已中是十業道三法圍繞所謂無貪恚癡有貪恚癡是十業道有共戒行不共戒行捨戒有六一者斷善根時二者得二根時三者捨壽命時四者受惡戒時五者捨戒時六者捨欲界身時或復説言佛法滅時便失戒者是義不然何以故受已不失未受不得斷身口意惡故名戒戒根本四禪四未到禪是名定戒根本四禪初禪未到名無漏戒捨身後世更不作惡名無作戒守攝諸根修正念心見聞覺知色聲香味觸法不生放逸名攝根戒何因緣故得名為戒戒者名制能制一切不善之法故得名制又復戒者名曰迮隘雖有惡法性不能容故名迮隘又復戒者名曰清涼遮煩惱熱不令得入是故名涼又復戒者名上能上天上至無上道是故名上又復戒者名學學調伏心智慧諸根是故名學善男子或時有人具足一戒所謂波羅提木叉戒或具二戒加定共戒或具三戒加無漏戒或具四戒加攝根戒或具五戒加無作戒善男子波羅提木叉戒現在得定共戒者三世中得善男子若復有人欲受戒時至心能觀生死罪過解脫功德信心歡喜是人兼得作無作戒如是戒者隨命長短命長長得命短短得是無作戒三因緣捨一者少莊嚴故二者心放逸故三者作不堅故不捨因緣復有三事一者有本願故二者作業堅故三者至心不放逸故善男子除十善業及十惡業善戒惡戒已更有業戒所不攝者謂善惡法如是善惡有作無作有人具足作及無作若現在作善未捨之頃具作無作第二念中成就過去作無作作已過去唯有無作無有作也若人得戒雖作不善是人現世成就二法惡法有作善法無作是作無作二因緣捨一者所施物盡二者心捨善作二世成就過去現在無作三世定戒二因緣捨一者退時二者斷善根時復有三時一者捨身時二者退時三者生上時無漏戒有三時捨一者退時二者轉鈍作利時三者得上果時心善業一時失謂上生時身口意善斷善根時一時俱失善男子若得具足戒定戒無漏戒攝根戒是人了了解十業道十業道上中下三種者以作時之輕重為標準而分別依瓔珞經戒有捨得之時此中亦略明捨得之相得二根者男子變得女根或非男女子變得男根或非女皆捨戒根本四禪即四禪天四未到禪即向四禪而未到時之中間禪菩薩戒所謂金剛戒捨身後亦不失此中菩薩優婆塞戒雖言盡形壽然亦如菩薩戒即捨身如不犯毀亦不失無作戒體受戒之後如道路界以準繩非無遮欄者故曰迮隘不能容許惡法攔入定與戒三世中得者以定共戒或從宿生所得或現受現得或現受後得故也無漏戒退時如阿羅漢退到三果三果退到二果初果轉鈍作利時如阿羅漢轉辟支佛或菩薩時庚十一明善惡報壽命善男子因十業道衆生壽命有增有減減者壽命十年增者至無量年北鬱單曰定壽千年此壽百年東西二方二百五十此壽無量彼亦無量四天王壽人數九百萬歲命亦不定如三天下三十三天壽千八百萬歲命亦不定焰摩天壽三千六百萬歲命亦不定兜率天壽七千二百萬歲除後身菩薩餘一切命皆亦不定化樂天壽萬四千四百萬歲命亦不定他化自在天壽二萬八千八百萬歲命亦不定他化自在天上一年即熱地獄一日一夜如是三十日為一月十二月為一歲彼地獄壽命二萬八千八百萬歲命亦不定化樂天上一年即大聲地獄一日一夜如是三十日為一月十二月為一歲彼獄壽命萬四千四百萬歲命亦不定兜率天一年即小聲地獄一日一夜如是三十日為一月十二月為一歲彼地獄壽命七千二百萬歲命亦不定焰摩天一年即衆合地獄一日一夜如是三十日為一月十二月為一歲彼地獄壽命三千六百萬歲命亦不定三十三天一年即是黑繩地獄一日一夜如是三十日為一月十二月為一歲彼地獄壽命一千八百萬歲命亦不定四天王上一年即是活地獄中一日一夜如是三十日為一月十二月為一歲彼地獄壽命九百萬歲命亦不定阿鼻地獄壽命一劫大熱地獄壽命半劫唯此二處壽命決定人中五十年是餓鬼中一日一夜如是三十日為一月十二月為一歲彼鬼壽命萬五千歲命亦不定畜生道中除難陀婆難陀其餘一切命亦不定阿鼻地獄一年即是非想非非想處一日一夜如是三十日為一月十二月為一歲彼天壽命八萬大劫無所有處六萬劫識處四萬劫空處二萬劫此明善惡業得報壽命之長短合三界六道言之也三十三天即忉利天大聲地獄他處謂大叫喚地獄小聲地獄謂小叫喚地獄活地獄即等活地獄受刑死已等復活後又受刑苦阿鼻譯無間即造五逆罪所受之報故五逆又謂之五無間在地獄中其壽最長難陀婆難陀為一龍名壽一大劫空處即空無邊處天證此定者身心世界皆空無所有庚十二總明諸業報相若有發起輕微煩惱愛著空定當知是人生四無色從十年增至八萬歲從八萬歲減還至十年如是增減滿十八反名一中劫穀貴三災疾病三災刀兵一災名一小劫水火二災各五段過有一風災五風災過名一大劫閻浮提中刀兵起時東西二方人暫生瞋此病起時彼小頭痛力少微弱此穀貴時彼則念食如是惡事鬱單曰無因不殺故壽命增長偷因緣故壽命減少有二種劫一者水劫二者火劫火劫起時地獄衆生若報盡者悉得出離若未盡者移至他方大地獄中若此世間八大地獄空無衆生是名衆生脫於地獄四大海中所有衆生業若盡者悉皆得脫若未盡者悉轉生於他方海中若是海中無一衆生是名得脫閻浮提地直下過於五百由延有閻羅王城周匝縱廣七萬五千由延如是城中餓鬼衆生業已盡者悉得出離業未盡者轉生他方閻羅王所若是城中乃至無有一衆生者是名得脫爾時有人內因緣故獲得初禪得已即起大聲唱言初禪寂靜初禪寂靜諸人聞已即各思惟一切皆共獲得初禪即捨人身生初禪地時初禪中復有一人內因緣故修得二禪得已即起大聲唱言二禪寂靜二禪寂靜衆生聞已各自思惟復獲二禪捨初禪身生二禪處當爾之時從阿鼻獄上至初禪乃至無有一衆生在善男子四天下外有由乾陀山中有七日衆生福德因緣力故唯一日現賴之成熟百穀草木火劫起時七日都現燒然一切百穀草木山河大地須彌山王乃至初禪二禪衆生見是火災心生怖畏彼中復有先生諸天語後來天汝等莫怖我往曾見如是火災齊彼而止不來至此如諸衆生增十年壽至八萬歲減八萬壽還至十年經爾所時如是火災熱猶未息是時便從中間禪處降注大雨復經壽命一增一減衆生業行因緣力故為持此水其下復出七重風雲是時雨止水上生膜猶如乳肥四天下中須彌山王漸漸生現水中自然具有一切種種種子是時二禪復有一人短命福盡業力故墮生於世間壽無量歲光明自照獨處經久心生愁惱而自念言我既獨處若我有福願更有人來生此間與我為伴發是念已是時二禪有諸衆生薄福命盡業因緣故便來生此是人見已心生歡喜即自念言如是人者我所化生即是我作我於彼人有自在力彼人亦念我從彼生彼化作我彼於我身有自在力以是因緣一切衆生生我見想善男子陰界入等衆生世界國土世界皆是十業因緣而有此總明受報之期皆由衆生諸業所造也十八反合前無量壽減至十歲合後十年增至無量壽為二十小劫即一中劫七日出就科學言似不能成立然此有不可思議者世界學問尚難究知前時報載天文家有發現冥王星者最近又發現一星其光熱尤超過日球假使此星移近日球則地上有二日矣現在生物學家研究生命起源異説紛紜或謂從他世界來或謂從此世之物質中出者皆非真理以世界原由一切衆生業力引生各種種子皆已具足於世界中緣熟之時種種種子皆生長也二禪一人墮生初禪即大梵王先僅一人嗣後方有與之相感總續生彼故世間有以大梵天王能造一切世界人類萬物而主宰之者根本誤會即從此起陰即五陰界即十八界入即十二入一類一類中而成一個一個有情衆生者皆因第七末那識我執所成由有我執方成個我由善惡業方感類生成唯識論即徹底究明此微細之法相者己三結成在家難勝善男子菩薩二種一者在家二者出家出家菩薩能觀如是十業道者是不為難在家觀者是乃為難何以故在家之人多惡因緣所纏繞故此明在家人能解行十善業之極難能也以上五品皆説明戒度者最後十善統一切戒以及戒所不攝各善惡法羼提波羅蜜品第二十五羼提為梵音此云忍辱丙三忍度丁一善生問善生言世尊佛先已説檀波羅蜜尸波羅蜜菩薩云何而得修集忍波羅蜜丁二如來答戊一略出忍體佛言善男子忍有二種一者世忍二者出世忍能忍飢渴寒熱苦樂是名世忍能忍信戒施聞智慧正見無謬忍佛法僧罵詈撾打惡口惡事貪瞋癡等悉能忍之能忍難忍難作能作名出世忍善男子菩薩若值他人打罵輕賤毀呰惡口罵詈是時內心無加報想菩薩雖作如是忍事不為現在但為後利有善報之惡則不反正確無謬即能忍可此忍即是勝解大概能忍物質上之難忍者謂之世忍能忍精神上之難忍者謂之出世忍戊二忍波羅蜜善男子有是忍辱非波羅蜜有波羅蜜非是忍辱有是忍辱是波羅蜜有非忍辱非波羅蜜是忍辱非波羅蜜者所謂世忍聲聞緣覺所行忍辱是波羅蜜非忍辱者所謂禪波羅蜜亦是忍辱亦波羅蜜者所謂若被割截頭目手足乃至不生一念瞋心檀波羅蜜尸波羅蜜般若波羅蜜非忍辱非波羅蜜者所謂聲聞緣覺持戒布施如金剛經言佛於作忍辱仙人時被歌利王割截身體不起瞋心即為忍辱到究竟者即是忍辱波羅蜜戊三示修忍法善男子若欲修忍是人應當先破憍慢瞋心癡心不觀我及我所相種性常相若人能作如是等觀當知是人能修忍辱如是修已心得歡喜有智之人若遇惡罵當作是念是罵詈字不一時生初字出時後字未生後字生已初字復滅若不一時云何是罵直是風聲我云何瞋我今此身五陰和合四陰不現則不可罵色陰十分和合而有如是和合念念不停若不停住誰當受罵然彼罵者即是風氣風亦二種有內有外我於外風都不生瞋云何於內而生瞋也世間罵者亦有二種一者實二者虛若説實者實何所瞋若説虛者虛自得罵無豫我事我何緣瞋若我瞋者我自作惡何以故因瞋恚故生三惡道若我於彼三惡道中受苦惱者則為自作自受苦報是故説言一切善惡皆因我身善男子生忍因緣有五事一者惡來不報二者觀無常想三者修於慈悲四者心不放逸五者斷除瞋恚善男子若人能成如是五事當知是人能修忍辱若人軟言淨身口業和顏悅色先意問訊能觀一切苦樂因緣當知是人能修忍辱若能修空三昧觀諸衆生悉是無常受苦等想被罵辱時能觀罵者如狂如癡稚小無智當知是人能修忍辱智人當觀勝我者罵我不應瞋何以故我若瞋者或奪我命若不如者瞋亦不應報何以故非疇匹故我若報者辱我身口譬如有人授毒與他人無責者如其自服人則嗤笑我亦如是若瞋彼者當於未來受大苦惱一切聖人悉當責我以是因緣我身若被截斫分離不應生瞋應當深觀往業因緣當修慈悲憐愍一切如是小事不能忍者我當云何能調衆生忍辱即是菩提正因阿耨多羅三藐三菩提即是忍果我若不種如是種子云何獲得如是正果罵詈字不一時生者如罵人為畜生畜字出時生字未生生字生已畜字已滅既不一時罵即不成此即以析空或體空之理觀之也此種空觀要用得善巧則可遮止煩惱若用不善巧執空觀以撥無因果則成顛倒矣四十二章經中有一段言有人罵佛佛不應之罵已佛問之言若有人送禮不受送者當如何答言不受則攜回佛言汝罵我不受亦當帶回此亦為忍罵之最好模範戊四成就忍德善男子若有智人樂修忍辱是人常得顏色和悅好樂怡戲人見歡喜睹之無厭於受化者心不貪著智人見怨以惡來加當發善願願彼怨者未來之世為我父母兄弟親戚莫於我所生憎怨想復當觀察若人形殘顏色醜惡諸根不具乏於財物當知皆從瞋因緣得我今云何不修忍辱以是因緣智者應當深修忍德善男子菩薩摩訶薩修忍辱時常樂觀察生死罪過樂修法行勤於精進讀誦書寫如來正典供養師長有德之人能瞻病苦修於慈悲憐愍一切見苦惱者能令遠離常樂出家乃至盡壽持戒精進攝持六根不令得起煩惱因緣寧捨身命終不毀戒若他有事樂為管理常有慚愧樂讚忍德為調衆生堪忍衆苦於怨尚能忍於惡事況復親所能忍二瞋一衆生瞋二非衆生瞋捨己樂具令衆得樂不念多惡不忘少善遠離兩舌前後默然不説彼短説煩惱過令衆得離他所不喜不為説之淨身口意了諸罪業若客煩惱因緣作罪作已慚愧心生悔恨衆生瞋為有情瞋非衆生瞋為無情瞋即一種可瞋之境界戊五結在家難善男子菩薩二種一者在家二者出家出家菩薩修淨忍辱是不為難在家修忍是乃為難何以故在家之人多惡因緣所纏繞故此明在家修行忍辱之難能也毗梨耶波羅蜜品第二十六毗黎耶為梵音此云精進丙四進度丁一善生問善生言世尊菩薩摩訶薩能修六波羅蜜誰為正因此問何事為修行六度之正因丁二如來答戊一正答正因善男子若善男子善女人已生惡法為欲壞之未生惡法為遮不起未生善法為令速生已生善法為令增廣修勤精進是名精進如是精進即是修行六波羅蜜之正因也此中即明三十七道品中四正勤也戊二分別邪正是勤精進能脫一切諸煩惱界善男子若能受於三惡道苦當知是人真實能修毗梨耶波羅蜜平等修集不急不緩精進二種一正二邪菩薩遠離邪精進已修正精進修信施戒聞慧慈悲名正精進至心常作三時無悔於善法所不生知足所學世法及出世法一切皆名正精進也菩薩雖復不惜身命然為護法應當愛惜身四威儀常修如法修善法時心無懈息失身命時不捨如法若能到於六事彼岸悉是精進之因緣也若自讀誦書寫思惟十二部經名自為法勤行精進若能以是轉化衆生令調伏者名為他法勤行精進若為菩提修菩提道布施持戒多聞智慧修學世法供養父母師長有德之人修舍摩他毗婆舍那讀誦書寫十二部經復能遠離貪恚癡等名為菩提勤行精進如是悉名為正精進是名六波羅蜜之正因也善男子懈怠之人不能一時一切布施不能持戒勤行精進攝心念定忍於惡事分別善惡是故我言六波羅蜜因於精進對於財色名食睡之五欲則應知足對於善法則不應知足此中就行善故云不應知足也戊三進波羅蜜善男子有勤精進非波羅蜜有波羅蜜非勤精進有亦精進亦波羅蜜有非精進非波羅蜜精進非波羅蜜者如邪精進善事精進聲聞緣覺所有精進有波羅蜜非精進者所謂般若波羅蜜有亦精進亦波羅蜜者所謂布施持戒忍辱精進禪等五波羅蜜有非精進非波羅蜜者一切凡夫聲聞緣覺布施持戒忍辱禪定智慧及餘善法此正明應遍修精進波羅蜜戊四結在家難善男子菩薩有二種一者在家二者出家出家菩薩修勤精進是不為難在家修進是乃為難何以故在家之人多惡因緣所纏繞故此明在家修行精進難能禪波羅蜜品第二十七禪與波羅蜜之義前均講過此品正明禪波羅蜜丙五禪度丁一善生問善生言世尊菩薩摩訶薩修禪波羅蜜云何禪定禪為梵音具云禪那此云靜慮於寂靜之中能審慮照察之義善生即問如何修此禪定也丁二如來答戊一略明定相善男子禪定即戒慈悲喜捨遠離諸結修集善法是名禪定善男子若離禪定尚不能得一切世事況出世事是故應當至心修集戒可生定定即是戒慈悲喜捨即是四無量心在欲界修定先須持戒超欲界更須修四無量心欲離煩惱無論伏斷均須修定蓋無漏慧非散心心所能得也戒慈悲喜捨則為禪定之因遠離諸結修集善法為禪定之果四禪定為佛法中之最重要者一切世出世間善法均依之而得也戊二示修禪法菩薩欲得禪波羅蜜先當親近真善知識修集三昧方便之道所謂戒戒攝諸根戒斷於邪命如法而住隨順師教於善法所不生知足修行善時心無休息常樂寂靜遠離五蓋心樂思惟觀生死過常修善法至心不廢具足正念斷諸放逸省於言語亦損眠食心淨身淨不親惡友不與惡交不樂世事知時知法了知自身觀心數法若有喜相愁相瞋相軟相堅相知已能除猶如金師善知冷熱不令失所樂甘露味雖處世法身心不動猶如須彌不為四風之所傾動正念堅固亦見知覺有為多過若人樂修如是三昧不休不息當知是人能具足得譬如鑽火以不息故火則易得三昧梵音又謂三摩地此云定又謂正受又謂等持即心注一境平等正受五蓋即貪欲瞋恚癡惛沈掉舉謂蓋覆其心使不得寂靜能棄捨五蓋精修禪定則能得甘露味之涅槃寂靜戊三顯禪功德善男子若離三昧欲得世法出世菩提無有是處善男子一切三昧即是一切善法根本以是因緣應當攝心如人執鏡則見一切善惡之事是故三昧名菩提道之莊嚴也受身心樂名為三昧不增不減名等三昧從初骨觀乃至得阿耨多羅三藐三菩提皆名三昧是三昧有四種一者從欲二者從精進三者從心四者從慧是四緣故得無量福增一切善復有三種一者從聞二者從思三者從修從是三法漸漸而生復有三時所謂生時住時增時善男子欲界之中有三昧子是子因緣得三菩提是三昧者有退住增若在四禪性則堅固從初乃至非想非非想處上地勝下次第如是根本禪中則有喜樂非中間禪六通亦爾在於根本不在餘處是三昧名菩提莊嚴因是三昧能得學道及無學道四無量心三解脫門自利利他無量神足知他心智能調衆生無量智慧五智三昧轉鈍為利斷於一切生老病死能得成就一切種智見諸法性如羅縠視受身心樂者如初禪為離生喜樂二禪為定生喜樂三禪為離喜妙樂四禪為捨念清靜三昧子指修定之種子此種子即在欲界之中從初禪至二禪三禪四禪空無邊處識無邊處無所有處最後為非想非非想處由初禪至二乃至由無所有處至非想非非想處之中間謂之中間禪戊四四無量定善男子智者應當作如是觀一切煩惱是我大怨何以故因是煩惱能破自他以是因緣我當修集慈悲之心為欲利益諸衆生故為得無量純善法故若有説言離於慈悲得善法者無有是處如是慈悲能斷不善能令衆生離苦受樂能壞欲界是慈若能緣於欲界名欲界慈善男子衆生若能修集慈心是人當得無量功德修慈心時若能先於怨中施安是名修慈善男子一切衆生凡有三聚一者怨二者親三者中如是三聚名為慈緣修慈之人先從親起欲令受樂此觀既成次及怨家善男子起慈心時有因戒起有因施起若能觀怨作子想者是名得慈善男子慈唯能緣不能救苦悲則不爾亦緣亦救善男子若能觀怨一毫之善不見其惡當知是人名為習慈若彼怨家設遇病苦能往問訊瞻療所患給其所須當知是人能善修慈善男子若能修忍當知即是修慈因緣如是慈心即是一切安樂因緣若能修慈當知是人能破一切憍慢因緣能行施戒忍辱精進禪定智慧如法修行若人修定當知是人修梵福德得梵身故名梵福德若人能觀生死過罪涅槃功德是人足下所履糞土應當頂戴是人難忍能忍難施能施難作能作是人能修四禪四空及八解脫復作是念一切衆生身口意惡未來若受苦惱報者悉令我受若我所有善果報者悉令衆生同我受之如是慈悲緣廣故廣緣少故少慈悲三種謂下中上復有三種一者緣親二者緣怨三者緣中復有三種一者緣貪二者緣衆生三者緣非衆生如是緣者悉名三昧悲喜捨心亦復如是於有怨者修慈者如正曲木必過正方能矯枉也八解脫者一內有色觀外色二內無色觀外色三淨解脫具足住四空處五識處六無所有處七非非想處八滅受想處戊五禪波羅蜜善男子有禪非波羅蜜有波羅蜜非禪有亦是禪亦波羅蜜有非禪非波羅蜜是禪非波羅蜜者謂世俗禪聲聞緣覺所有禪定是波羅蜜非禪定者所謂施戒忍辱精進亦是禪亦波羅蜜者謂金剛三昧非禪非波羅蜜者謂一切衆生聲聞緣覺從聞思惟所生善法三昧有種種別相此中金剛三昧即一種之別相義見前戊六結在家難善男子菩薩有二種一者在家二者出家出家菩薩修於淨禪是不為難在家修淨是乃為難何以故在家之人多惡因緣所纏繞故般若波羅蜜品第二十八般若梵音此云智慧有謂因上為慧果上為智者此正明慧度為最後之一品丙六慧度丁一善生問善生言世尊菩薩云何修淨般若波羅蜜丁二如來答戊一顯示慧相善男子若有菩薩持戒精進多聞正念修於忍辱憐愍衆生心多慚愧遠離嫉妒真實了知諸善方便為衆受苦不生悔退樂行惠施能調衆生善知所犯輕重之罪勤勸衆生施作福業知字知義心無憍慢親近善友能自利益及利益他恭敬三寶諸師和上長老有德於身菩提不生輕想能觀菩提深妙功德知善惡相知世出世一切聲論知因知果知初方便及以根本當知是人能得智慧如是智慧有三種一從聞生二從思生三從修生從字得義名從聞生思惟得義名從思生從修得義名從修生能讀如來十二部經能除疑網能讀一切世論世事能善分別邪正之道是名智慧能善分別十二部經陰入界等因果字義毗婆舍那舍摩他相上中下相善惡無記及四顛倒見道修道能善分別如是等事是名智慧從聞生者即聞所成慧從思生者即思所成慧從修生者即修所成慧讀經除疑則為內明能讀世論世事則為聲明因明醫藥明工巧明以示菩薩於五明處求也戊二成慧功德善男子有智之人求於十力四無所畏大悲三念處常親近佛及佛弟子世無佛法樂在外道出家修學雖處邪道樂求正要常修慈悲喜捨之心及五通道得五通已觀不淨想及無常想能説有為多諸過罪為正語故教諸衆生令學聲論能令衆生離身心病樂以世事教於他人所作事業無能勝者所謂咒方種種醫藥能善求財得已能護用以道理如法惠施雖知一切不生憍慢得大功德不生知足能教衆生信施持戒多聞智慧知善不善無記方便善知學行因緣次第知菩提道及道莊嚴知諸衆生上中下根知外聲論心不存著知衆生時隨宜調伏知衆生世及國土世知從具足六波羅蜜聲論亦曰聲明即語言文字學令離身心病即醫藥明能善求財即工巧明均為求慧之方便也衆生世即有情世間國土世即器世間蓋即盡虛空遍衆生界之意戊三慧波羅蜜善男子有是智慧非波羅蜜有波羅蜜非是智慧有是智慧是波羅蜜有非智慧非波羅蜜是智慧非波羅蜜者所謂一切世間智慧聲聞緣覺所得智慧是波羅蜜非智慧者無有是義是智慧是波羅蜜者所謂一切六波羅蜜非智慧非波羅蜜者所謂一切聲聞緣覺施戒精進凡成波羅蜜皆是智慧故無波羅蜜而非智慧此與前五度不同之處從此可知前五度之成就波羅蜜皆不離般若戊四總修六度善男子若人有能勤修如是六波羅蜜是人名為供養六方能增財命能增世財業命及功德之財智慧之命至於究竟則成為福慧兩足尊之佛矣戊五結在家難善男子菩薩二種一者在家二者出家出家菩薩修淨智慧是不為難在家修淨是乃為難何以故在家之人多惡因緣所纏繞故此明在家菩薩修般若波羅蜜之難能也甲三結成分説是法時善生長者子等千優婆塞發阿耨多羅三藐三菩提心既發心已即從坐起禮佛而退辭還所止此明説本經之成效即得益也結成其效為當機之善生長者子等千優婆塞此處發菩提心乃真發菩提心即為初住菩薩前十八品為養成能發菩提心之菩薩依起信論言在真發菩提心之前須修十千大劫已入初住真發菩提心者乃能正修六度之菩薩行此當機之千優婆塞發真菩提心即為説此經之成效就理而談從坐起禮佛則為上求大覺辭還所止即為下度衆生乃至成佛而後亦仍是修菩薩之行耳此度一切衆生之菩薩行以虛空無盡故世界無盡世界無盡故衆生無盡衆生無盡故菩薩度生之行亦無盡也重示上來經文已略明竟茲將全經大義重示綱要本經重心點有三一此經名優婆塞戒經可以優婆塞戒為全經重心以此戒為菩薩優婆塞戒故從如何修菩提心悲心等以成為能受戒之人至受戒品後則為優婆塞之如何修持戒行二此經亦可以在家菩薩為重心以此經全部各品皆策進在家人之修菩薩行故因在家菩薩環境惡劣不易發心修行故重重勉勵之但出家修行固屬較易然能出家者僅有少數若無此經之方便則佛法不能普及所以今此分科即以在家菩薩為中心而以前十八品為養成在家菩薩後十品為勉修六度三本經亦以發菩提心為重心以第一品即以發菩提心否辨有無菩薩性次明發菩提心悲心最後又示千優婆塞發菩提心故可謂為以發菩提心為重心則讀誦受持解説時如衣之有領如網之有綱提其領挈其綱則全經文義了了分明矣此外尚有為本經之特點者再略明之一者即俗而真如禮拜六方或為俗習或為外道而此經並不積極破除只加以正當之解釋即為轉俗事為真理矣在善生經與本經皆解釋東方為父母南方為師長等即以之為倫理道德之標準此為即俗而真者一又就外道妄執之六方神而轉成屬衆生心之六度其為即俗而真者二二者特重布施修福前後經文處處勸行布施並常言增長財命是廣修施福亦為此經之特點三者特詳不放逸行而明精進為六度正因四者注重修成自在威力以調伏衆生而不為衆生之所轉勇猛精進為社會國家謀利益五者息惡品中以念佛之功德相好為能息惡此攝淨土宗而以佛之三密加持相應亦即攝密宗六者於雜品業品淨三皈品忍品之破我破自在天破空執及修空觀即於業果相續之中闡明不斷不常非實非有之中道義即攝大乘法性法相而法華之空假中三觀真俗中三諦義華嚴十玄六相禪宗見性成佛之大乘各宗義無不具足故此一經總持三藏而尤望聞此經者能真實發菩提心進修六度之菩薩行方不負佛説此經之悲願羅曜青記佛學書局流通本
